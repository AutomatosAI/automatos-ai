name: welcome

# Gerard, 15 Oct ("Can we automate the welcome message???"): the welcome a new
# contributor gets when they claim an issue, open their first pull request and land
# their first merge. scripts/ci/welcome_contributor.py posts it, from the templates in
# .github/welcome/ (edit the wording there); welcome_rules.py next to it decides, and
# welcome_github.py is its GitHub client. The claim rules it applies are
# CONTRIBUTING.md's "Picking up an issue"; its tests are
# orchestrator/tests/test_ci_welcome_contributor.py and test_ci_welcome_pull_requests.py
# (the orchestrator-tests shards in test.yml).
#
# pull_request_target runs with a write token, so this workflow NEVER checks out or
# runs a pull request's code: it checks out the default branch, only scripts/ci and
# .github/welcome, and doesn't persist the token. No event field is interpolated into
# a run line: the script reads the payload from $GITHUB_EVENT_PATH. The runner's own
# python3 runs it (stdlib only), so nothing is installed.
#
# Third-party actions are pinned to a commit; the comment names the release.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed]

permissions: {}

jobs:
  welcome:
    name: Welcome the contributor
    # The script's own checks, early, so most events never take a runner (the account
    # runs 20 jobs at once): no bots, no maintainers, no review talk on pull requests,
    # a pull request only from a first-time contributor. A merge counts whoever pressed
    # the button (a merge queue is a bot), so there the script checks the author.
    if: >-
      (github.event_name == 'issue_comment'
        && !github.event.issue.pull_request
        && github.event.issue.state == 'open'
        && !endsWith(github.actor, '[bot]')
        && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_target'
        && github.event.action == 'opened'
        && !endsWith(github.actor, '[bot]')
        && contains(fromJSON('["FIRST_TIME_CONTRIBUTOR", "FIRST_TIMER"]'), github.event.pull_request.author_association))
      || (github.event_name == 'pull_request_target'
        && github.event.action == 'closed'
        && github.event.pull_request.merged
        && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # Claims run one at a time across the whole repository, oldest first: each run
    # reads the issue and the claimer's assignments fresh, so two people claiming
    # one issue, or one person claiming several at once, can't both be told "it's
    # yours". A pull request's events queue per pull request (whether it is a first
    # PR or a first merge is decided by number and merge time, not by run order).
    # queue: max keeps up to 100 runs waiting instead of cancelling all but one;
    # nothing is cancelled mid-run. Serial runs also cap a burst of comments at one
    # run's API calls at a time against the shared GITHUB_TOKEN budget.
    concurrency:
      group: ${{ github.event_name == 'issue_comment' && 'welcome-claims' || format('welcome-pr-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout the default branch (the script and the templates only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            .github/welcome

      - name: Reply on the thread
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/welcome_contributor.py
