name: images

# Builds the platform's container images for linux/amd64 and linux/arm64 and
# publishes them to GHCR as ghcr.io/<owner>/automatos-<image>.
#
# - Only main and `v*` tags publish. Pull requests, and manual runs on any
#   other branch, build both architectures and push them by digest to a
#   throwaway `registry:2` service inside the job (localhost:5000), never to
#   GHCR, so they are measured without publishing. Only publishing runs write
#   the build cache; every run reads it (PRD-262 §9-Q13).
# - A push to main publishes `sha-<short>`; a `v*` tag publishes `X.Y.Z` and
#   `X.Y`. This workflow never moves `edge`: smoke-images.yml pulls and boots
#   each main publish on both arches, and its promote-edge job then points
#   `edge` at that `sha-<short>` (PRD-262 US-003). An image that cannot boot
#   never reaches `edge`, the tag plain compose and the Helm chart pull.
# - Each architecture builds on its own native runner (no QEMU), pushes by
#   digest and scans that digest with Grype, straight from the registry it was
#   pushed to, so amd64 and arm64 are both scanned, on pull requests as on main.
#   The scan policy (scripts/ci/image_scan_policy.py, PRD-262 US-013) blocks a
#   fixable Critical, or a match on CISA's Known Exploited Vulnerabilities list
#   at any severity, that .grype.yaml does not allowlist with a reason and an
#   expiry. The merge job needs every build job, so on main a failing scan
#   leaves the digest untagged and unsigned. The merge job joins the digests
#   into one multi-arch index and signs it with cosign (keyless, through
#   GitHub OIDC).
# - Every build reports its size, its layers (with the Dockerfile instruction
#   and the heaviest paths of each) and its update delta, the MB an existing
#   user downloads to move from `edge` to it, in the step summary and as a
#   `layers-<image>-<arch>` artifact, and checks its size against
#   .github/image-budgets.json (scripts/ci/image_report.py, PRD-262 US-001).
#   The report job adds the layers the API and the worker share and the app
#   images' first pull.
# - The weekly OS rebuild (PRD-262 US-011): every Monday at 05:00 UTC a schedule
#   run rebuilds each image's `no_cache_filters` stages (those whose apt or apk
#   packages ship) without the cache, so Debian and Alpine fixes reach the
#   images without a code change. It publishes `weekly-<yyyymmdd>` and never
#   `sha-<short>`, so a sha tag keeps the packages it was built with, and it
#   writes the cache, so every later `sha-<short>` builds on the fresh layers.
#   smoke-images.yml boots the weekly tag and moves `edge` to it. A manual run
#   with `no_cache` applies the same filters: on a branch it builds, pushes to
#   the job's registry and never publishes; on main it publishes `sha-<short>`,
#   as any manual run there does. Railway builds from source with its own
#   layer cache, so it gets these fixes only once it deploys the published
#   images (PRD-262 D2, held until after WebSummit).
#
# Build args match docker-compose.yml, i.e. the local edition: no graph extras,
# no bundled Chromium, and the frontend built for AUTH_EDITION=local against
# http://localhost:8000 (NEXT_PUBLIC_* are inlined at build time, for now).
# The API reads AUTH_EDITION at runtime; only the frontend fixes its edition
# at build time, and a hosted-edition frontend can't be published generically
# because its Clerk key is per deployment. Railway builds its own images and
# is unaffected.
#
# PRs build only when an image's inputs change (Dockerfiles, dependencies, the
# frontend's public files and build config, this file, the budgets): the
# changes job builds just the images whose inputs the PR touches, on both
# arches. test.yml's prod-image-parity job builds the three Railway-equivalent
# images on amd64 for PRs that touch its PROD_IMAGE_PATHS.
#
# The owner comes from the repository, so a fork publishes to its own
# namespace. New packages are private until an org owner makes them public.
#
# Third-party actions are pinned to a commit; the comment names the release.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    # Exactly the changes job's SHARED_INPUTS plus every image's `inputs`
    # (orchestrator/tests/test_prd262_image_matrix.py holds them equal).
    paths:
      - ".github/workflows/images.yml"
      - ".github/image-budgets.json"
      - ".grype.yaml"
      - "scripts/ci/image_*.py"
      - "orchestrator/Dockerfile"
      - "orchestrator/.dockerignore"
      - "orchestrator/requirements.txt"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/next.config.js"
      - "frontend/csp-sources.js"
      - "frontend/.npmrc"
      - "frontend/public/**"
      - "services/workspace-worker/**"
  # The weekly OS rebuild (PRD-262 US-011).
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Rebuild the OS-package stages from fresh packages, as the weekly run does (on a branch: never publishes)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR builds; never cancel a publish half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The merge job's `if:` repeats this: job-level `if:` can't read `env`.
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
  # Schedule runs, and manual runs with `no_cache`, rebuild each image's
  # `no_cache_filters` stages from fresh packages (PRD-262 US-011).
  NO_CACHE: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}

jobs:
  # Which images this run builds, as the build job's matrix
  # (scripts/ci/image_matrix.py). A PR builds the images whose `inputs` it
  # touches, on both arches, or every image when it touches a SHARED_INPUTS
  # path; a push, a schedule or a manual run builds every image. If the PR's
  # file list can't be read, every image builds: a gap here only costs time.
  # A schedule run also gets its `weekly-<yyyymmdd>` tag here, from the run's
  # created_at (actions: read), which smoke-images.yml reads too.
  changes:
    name: Which images this change builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
      weekly_tag: ${{ steps.pick.outputs.weekly_tag }}
    steps:
      - name: Checkout (the picker)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Pick the images
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # The images this workflow builds. `inputs` are the on.pull_request
          # paths that change the image. `publish: false` builds, measures and
          # scans an image without ever pushing it to GHCR, so it has no `edge`.
          # cache_mode: `min` for the API, whose pybuild output `max` would
          # export and never reuse; `max` for the frontend's builder
          # node_modules, and for the worker as before.
          # no_cache_filters: the stages whose apt or apk packages ship in the
          # image, which the weekly run rebuilds without the cache (PRD-262
          # US-011; orchestrator/tests/test_prd262_weekly_rebuild.py reads them
          # against each Dockerfile). The API's pybuild is not one: its compilers
          # never ship.
          IMAGES: |
            [
              {"name": "api", "context": "orchestrator", "target": "production",
               "build_args": ["INSTALL_GRAPH_EXTRAS=false"],
               "cache_mode": "min", "no_cache_filters": ["base"],
               "arches": ["amd64", "arm64"], "publish": true,
               "inputs": ["orchestrator/Dockerfile", "orchestrator/.dockerignore",
                          "orchestrator/requirements.txt"]},
              {"name": "frontend", "context": "frontend", "target": "production",
               "build_args": ["NEXT_PUBLIC_AUTH_EDITION=local",
                              "NEXT_PUBLIC_API_URL=http://localhost:8000",
                              "NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws",
                              "NEXT_PUBLIC_MEDIA_ORIGINS=http://localhost:9000"],
               "cache_mode": "max", "no_cache_filters": ["production"],
               "arches": ["amd64", "arm64"], "publish": true,
               "inputs": ["frontend/Dockerfile", "frontend/.dockerignore",
                          "frontend/package.json", "frontend/package-lock.json",
                          "frontend/next.config.js", "frontend/csp-sources.js",
                          "frontend/.npmrc", "frontend/public/**"]},
              {"name": "workspace-worker", "context": "services/workspace-worker", "target": "",
               "build_args": ["INSTALL_BROWSER=false"],
               "cache_mode": "max", "no_cache_filters": ["production"],
               "arches": ["amd64", "arm64"], "publish": true,
               "inputs": ["services/workspace-worker/**"]}
            ]
          # What every image is built or judged by: a change here builds them all.
          SHARED_INPUTS: |
            [".github/workflows/images.yml", ".github/image-budgets.json", ".grype.yaml",
             "scripts/ci/image_*.py"]
          RUNNERS: '{"amd64": "ubuntu-24.04", "arm64": "ubuntu-24.04-arm"}'
          LOCAL_REGISTRY: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 # 2.8.3
        run: |
          set -euo pipefail
          weekly=()
          if [ "$EVENT" = "schedule" ]; then
            created=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            weekly=(--created "$created")
          fi
          pick() {
            python3 scripts/ci/image_matrix.py --images "$IMAGES" --shared-inputs "$SHARED_INPUTS" \
              --runners "$RUNNERS" --owner "$GITHUB_REPOSITORY_OWNER" --publish "$PUBLISH" \
              --no-cache "$NO_CACHE" --local-registry "$LOCAL_REGISTRY" "${weekly[@]}" "$@" | tee -a "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" != "pull_request" ]; then pick --every < /dev/null; exit 0; fi
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "::warning::the PR's file list could not be read: every image builds"
            pick --every < /dev/null; exit 0
          fi
          if [ "$(wc -l <<< "$files")" -ge 3000 ]; then pick --every < /dev/null; exit 0; fi
          pick <<< "$files"

  build:
    name: build ${{ matrix.name }} (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    # The throwaway registry PR and branch builds push to (localhost:5000). A
    # build that publishes to GHCR leaves `registry` empty, so none starts.
    services:
      registry:
        image: ${{ matrix.registry }}
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PRD-262 US-013: Grype comes first, so its database download and load (73
      # to 120 s on 16 Oct) overlap the build instead of following it. Pinned to
      # 0.118.0, whose JSON the scan policy reads (`knownExploited` on a match).
      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v0.118.0

      # In the background, outside the checkout (Grype reads a .grype.yaml in its
      # working directory). The scan step waits for db.status.
      - name: Download the Grype database (background)
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          mkdir -p "${RUNNER_TEMP}/grype"
          cd "${RUNNER_TEMP}/grype"
          nohup bash -c '"$GRYPE" db update > db.log 2>&1; echo "$?" > db.status.tmp && mv db.status.tmp db.status' \
            > /dev/null 2>&1 < /dev/null &

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          # GitHub classifies LICENSE as "Other", so the default licence would be
          # NOASSERTION; the repository is Apache-2.0.
          labels: |
            org.opencontainers.image.title=automatos-${{ matrix.name }}
            org.opencontainers.image.licenses=Apache-2.0

      # network=host lets BuildKit's container reach the registry service on
      # localhost:5000.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        if: matrix.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes by digest: to GHCR when publishing, to the job's registry
      # otherwise. Every run reads the cache; only publishing runs write it, so
      # PR and branch caches (which main can never read) stop crowding main's
      # out of the 10 GB GHA cache. On a weekly or `no_cache` run,
      # no-cache-filters rebuilds the image's OS-package stages, and every step
      # after them, from fresh packages; the weekly run's cache-to then hands
      # those layers to the builds that follow.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ matrix.build_args }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,mode={0},scope={1}-{2}', matrix.cache_mode, matrix.name, matrix.arch) || '' }}
          no-cache-filters: ${{ matrix.no_cache_filters }}

      - name: Export digest
        if: matrix.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: matrix.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # Reads the pushed digest back: compressed size, each layer with its
      # Dockerfile instruction and heaviest paths, and the update delta against
      # the published `edge` (none for an image that is never published).
      - name: Size, layers and update delta
        env:
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EDGE: ${{ matrix.edge }}
          # Only a brand-new, still-private GHCR package needs these; reads are
          # anonymous otherwise.
          REGISTRY_USER: ${{ matrix.publish && github.actor || '' }}
          REGISTRY_TOKEN: ${{ matrix.publish && secrets.GITHUB_TOKEN || '' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/layers"
          python3 scripts/ci/image_report.py measure --name "$NAME" --arch "$ARCH" \
            --image "$IMAGE" --digest "$DIGEST" --edge "$EDGE" \
            --out "${RUNNER_TEMP}/layers/${NAME}-${ARCH}.json" --summary "$GITHUB_STEP_SUMMARY"

      # Report only: .github/image-budgets.json's `mode` is `warn` until
      # PRD-262 US-004 sets the baseline and switches it to `fail`.
      - name: Size budget
        env:
          REPORT: ${{ runner.temp }}/layers/${{ matrix.name }}-${{ matrix.arch }}.json
        run: |
          python3 scripts/ci/image_report.py budget --report "$REPORT" \
            --budgets .github/image-budgets.json --summary "$GITHUB_STEP_SUMMARY"

      # Each image and arch builds in its own job, and a PR's registry ends with
      # it, so the report job reads the layers from here.
      - name: Upload the layer report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layers-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/layers/${{ matrix.name }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

      # Scans this architecture's image on its own runner: Grype picks one
      # platform from a multi-arch index, so scanning the merged index would
      # miss arm64. Every build is scanned, read straight from the registry it
      # pushed to: the job's registry:2 over plain HTTP on a PR or branch, GHCR
      # (with the login above) when publishing. No docker pull or save. It runs
      # outside the checkout, so Grype applies no allowlist: its table shows
      # every row, and the policy step below applies .grype.yaml. A scanner
      # error fails the job; on main the merge job then never runs (PRD-262
      # US-013).
      - name: Vulnerability scan
        working-directory: ${{ runner.temp }}/grype
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          GRYPE_REGISTRY_INSECURE_USE_HTTP: ${{ matrix.registry != '' }}
          GRYPE_DB_AUTO_UPDATE: "false"
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          DB_WAIT_SECONDS: "600"
        run: |
          waited=0
          until [ -f db.status ]; do
            if [ "$waited" -ge "$DB_WAIT_SECONDS" ]; then
              cat db.log
              echo "::error title=Grype database::not downloaded after ${DB_WAIT_SECONDS} s"
              exit 1
            fi
            sleep 5
            waited=$((waited + 5))
          done
          if [ "$(cat db.status)" != "0" ]; then
            cat db.log
            echo "::error title=Grype database::the download failed"
            exit 1
          fi
          echo "The Grype database was ready after ${waited} s of waiting."
          "$GRYPE" "registry:${IMAGE}@${DIGEST}" --platform "linux/${ARCH}" -o table -o json=report.json

      - name: Upload the scan report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/grype/report.json
          if-no-files-found: error
          retention-days: 30

      # The policy reads .grype.yaml, so it needs PyYAML.
      - name: Set up Python (the scan policy)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # PRD-262 US-013 (D1, FR-3): fails on a fixable Critical, or a KEV match of
      # any severity, that no unexpired .grype.yaml entry covers. POLICY_MODE is
      # `report` (warnings only) until the W1 wave's last commit sets `fail`, once
      # every current finding is fixed or allowlisted. An allowlist entry without
      # a reason or an expiry, or one more than 90 days out, fails in either mode.
      - name: Scan policy
        env:
          POLICY_MODE: report
          REPORT: ${{ runner.temp }}/grype/report.json
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          python -m pip install --disable-pip-version-check --quiet "pyyaml==6.0.3"
          python scripts/ci/image_scan_policy.py check --report "$REPORT" --allowlist .grype.yaml \
            --mode "$POLICY_MODE" --name "$NAME" --arch "$ARCH" --summary "$GITHUB_STEP_SUMMARY"

  # Across the build jobs: the layers the API and the worker share, and what the
  # app images cost to pull together, per arch. An image this run did not build
  # counts as its current `edge`. PRD-262 US-058's shared-layer check reads it.
  report:
    name: image report
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      shared_layers_amd64: ${{ steps.report.outputs.shared_layers_amd64 }}
      shared_layers_arm64: ${{ steps.report.outputs.shared_layers_arm64 }}
      first_pull_bytes_amd64: ${{ steps.report.outputs.first_pull_bytes_amd64 }}
      first_pull_bytes_arm64: ${{ steps.report.outputs.first_pull_bytes_arm64 }}
    steps:
      - name: Checkout (the report script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Download the layer reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/layers
          pattern: layers-*
          merge-multiple: true

      - name: Shared layers and first pull
        id: report
        run: |
          python3 scripts/ci/image_report.py report --dir "${RUNNER_TEMP}/layers" \
            --edge-prefix "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/automatos-" \
            --out "${RUNNER_TEMP}/image-report.json" \
            --summary "$GITHUB_STEP_SUMMARY" --outputs "$GITHUB_OUTPUT"

      - name: Upload the image report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-report
          path: ${{ runner.temp }}/image-report.json
          if-no-files-found: error
          retention-days: 30

  merge:
    name: publish ${{ matrix.image.name }}
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [changes, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # cosign keyless signing exchanges the job's OIDC token for a certificate.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The description is set on the multi-arch index, where GHCR reads it.
        image:
          - name: api
            description: Automatos AI backend API (orchestrator), built without the graph-clustering extras. The edition is set at runtime by AUTH_EDITION. For now, run it with the repository's docker compose, which supplies the wait-migrate-seed entrypoint.
          - name: frontend
            description: Automatos AI web app, local edition. The API address is currently fixed at build time to http://localhost:8000; a runtime setting is coming.
          - name: workspace-worker
            description: Automatos AI workspace worker (Code Canvas runtime), built without Chromium.

    steps:
      - name: Image name
        env:
          NAME: ${{ matrix.image.name }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/automatos-${NAME}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          annotations: |
            org.opencontainers.image.title=automatos-${{ matrix.image.name }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.licenses=Apache-2.0
          # No `latest` until the maintainers choose to publish one. No `edge`
          # either: smoke-images.yml's promote-edge job moves it once this
          # `sha-<short>` has booted on both arches (PRD-262 US-003).
          # A schedule run publishes only `weekly-<yyyymmdd>` (PRD-262 US-011):
          # every other tag is off for it, so a `sha-<short>` is never re-pushed
          # with other packages.
          flavor: |
            latest=false
          tags: |
            type=sha,enable=${{ github.event_name != 'schedule' }}
            type=schedule,pattern=${{ needs.changes.outputs.weekly_tag }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        env:
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          annotation_args=()
          while IFS= read -r annotation; do
            [ -n "$annotation" ] && annotation_args+=(--annotation "$annotation")
          done <<< "$ANNOTATIONS"
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tag_args[@]}" "${annotation_args[@]}" "${sources[@]}"

      - name: Resolve the index digest
        id: index
        run: |
          # A tag the previous step actually pushed.
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign (keyless)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
