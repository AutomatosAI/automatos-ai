name: images

# Builds the platform's container images for linux/amd64 and linux/arm64 and
# publishes them to GHCR as ghcr.io/<owner>/automatos-<image>.
#
# - Only main and `v*` tags publish. Pull requests, and manual runs on any
#   other branch, build both architectures and push them by digest to a
#   throwaway `registry:2` service inside the job (localhost:5000), never to
#   GHCR, so they are measured without publishing. Only publishing runs write
#   the build cache; every run reads it (PRD-262 §9-Q13).
# - A push to main publishes `sha-<short>`; a `v*` tag publishes `X.Y.Z` and
#   `X.Y`. Each image also gets `tree-<12>`, the first 12 characters of its
#   build context's git tree (`git rev-parse HEAD:<context>`), the first time
#   that tree is published and never again (PRD-262 US-036): a main commit with
#   no `sha-<short>` of its own (a [skip ci] merge, or the minutes before this
#   run publishes) can then still pull every image whose directory it did not
#   change, which is what `make up` looks for. This workflow never moves
#   `edge`: smoke-images.yml pulls and boots each main publish on both arches,
#   and its promote-edge job then points `edge` at that `sha-<short>` (PRD-262
#   US-003). An image that cannot boot never reaches `edge`, the tag plain
#   compose and the Helm chart pull.
# - Each architecture builds on its own native runner (no QEMU), pushes by
#   digest and scans that digest with Grype, straight from the registry it was
#   pushed to, so amd64 and arm64 are both scanned, on pull requests as on main.
#   The scan policy (scripts/ci/image_scan_policy.py, PRD-262 US-013) blocks a
#   fixable Critical, or a match on CISA's Known Exploited Vulnerabilities list
#   at any severity, that .grype.yaml does not allowlist with a reason and an
#   expiry. The merge job needs every build job, so on main a failing scan
#   leaves the digest untagged and unsigned. The merge job joins the digests
#   into one multi-arch index and signs it with cosign (keyless, through
#   GitHub OIDC).
# - agent-opt-worker (PRD-262 US-006) builds for amd64 only, on pull requests
#   that touch it and on main. It is measured and scanned like the others and
#   pushed only to the job's registry, never to GHCR: Railway builds it itself.
# - media-render (PRD-262 US-054) builds for amd64 and arm64, on pull requests
#   that touch it and on main, and is pushed only to the job's registry, never
#   published: it carries GPL-3.0 espeak-ng and phonemizer and GPL x264, and
#   Railway builds it itself (§9-Q6). It is too big for the GHA cache, so its
#   cache is a private GHCR ref, ghcr.io/<owner>/automatos-media-render:
#   buildcache-<arch>, which publishing runs write and every run reads (§9-Q13).
#   Keep that package private. Its budget also bars it on disk, as `docker image
#   inspect` reports the image pulled from the job's registry (§8). Its scan is
#   report only (`scan_report_only`) until its first findings are fixed or
#   allowlisted.
# - voice-tts (Auto's server voice, Kokoro and LAME) builds for amd64 and arm64,
#   on pull requests that touch it and on main, and like media-render is pushed
#   only to the job's registry, never published (GPL-3.0 espeak-ng and
#   phonemizer); Railway builds it itself. It keeps the GHA cache.
# - Every build reports its size, its layers (with the Dockerfile instruction
#   and the heaviest paths of each) and its update delta, the MB an existing
#   user downloads to move from `edge` to it, in the step summary and as a
#   `layers-<image>-<arch>` artifact, and checks its size, and its update delta
#   where the image has an update bar (US-016), against
#   .github/image-budgets.json (scripts/ci/image_report.py, PRD-262 US-001).
#   The report job adds the layers the API and the worker share and the app
#   images' first pull.
# - Each API build is pulled back by digest, and every native library in its
#   site-packages must load and `import main` must work, on both arches
#   (scripts/ci/image_site_packages.py, PRD-262 US-020), and botocore must hold
#   the models of the services we call, and only those, with boto3 building a
#   client for each (scripts/ci/image_botocore.py, PRD-262 US-021).
# - The API builds reproducibly (PRD-262 US-022): a fixed SOURCE_DATE_EPOCH and
#   rewrite-timestamp=true, so a layer rebuilt from the same inputs is the same
#   bytes. On a push to main, its two pip layers must be `edge`'s when the lock half
#   each holds and pybuild are (scripts/ci/image_pip_layers.py).
# - The weekly OS rebuild (PRD-262 US-011): every Monday at 05:00 UTC a schedule
#   run rebuilds each image's `no_cache_filters` stages (those whose apt or apk
#   packages ship) without the cache, so Debian and Alpine fixes reach the
#   images without a code change. It publishes `weekly-<yyyymmdd>` and never
#   `sha-<short>`, so a sha tag keeps the packages it was built with, and it
#   writes the cache, so every later `sha-<short>` builds on the fresh layers.
#   smoke-images.yml boots the weekly tag and moves `edge` to it. A manual run
#   with `no_cache` applies the same filters: on a branch it builds, pushes to
#   the job's registry and never publishes; on main it publishes `sha-<short>`,
#   as any manual run there does. Railway builds from source with its own
#   layer cache, so it gets these fixes only once it deploys the published
#   images (PRD-262 D2, held until after WebSummit).
# - The media assets image (PRD-262 US-053): a manual run on main with
#   `media_assets` publishes ghcr.io/<owner>/automatos-media-assets, the Kokoro
#   model files and the music library media-render builds from, and nothing else.
#   The image jobs skip; the run's title says so, and smoke-images skips it too.
# - A version (PRD-279 Waves 1 and 2; docs/deployment-infrastructure/releases.md): a
#   `v*` tag, which only maintainers can create (a repository ruleset). Every step
#   below that only a `v*` tag runs says so in its name or `if:`; a push to main, a pull
#   request, the weekly run and a manual run on a branch do what they did before.
#   Nothing carries a version tag until it has been scanned, signed and its signature
#   checked, and no version is ever replaced:
#   - The changes job reads the version off the tag (scripts/ci/release_version.py),
#     then refuses the run before anything builds (scripts/ci/release_preflight.py) if
#     any published image already has `<image>:<version>`, or if the tagged commit is
#     in neither the default branch nor `release/MAJOR.MINOR`. Beside it, the release page
#     check refuses, before anything builds, whatever the release page would be refused
#     for later (scripts/ci/release_page.py check).
#   - The scan policy runs in `fail` mode whatever POLICY_MODE says, so a failing image
#     fails its build job, and the merge job, which needs every build, publishes
#     nothing.
#   - The merge job publishes each image only under `release-staging-<run>-<attempt>`
#     (no version, and no `sha-<short>`: the tagged commit's main push published that),
#     signs the digest its create step (buildx v0.32+) pushed once the index holds just this run's
#     scanned builds, one per arch (release_digests.py), and checks it at the tag (release_signing.py).
#   - The release-images job, once every merge leg has, tags every image `X.Y.Z`, and
#     `X.Y` unless the tag has a suffix (a candidate, `v0.8.0-rc.1`), by digest, in one
#     step (scripts/ci/release_tags.py). smoke-images never runs on a tag, so `edge`
#     stays put.
#   - The release-chart job, after that, packages charts/automatos with the version and
#     every image's digest (scripts/ci/release_chart.py), renders it and fails on any
#     image named by a tag, pushes it to ghcr.io/<owner>/charts/automatos (never over an
#     existing version), signs it and checks the signature; a chart it could not prove
#     is deleted again.
#   - The release-notes job, after both, creates the version's release page with the
#     notes of PRD-279 §5.4 (scripts/ci/release_page.py): what changed, the database,
#     upgrading, what to install and checking it. A candidate's page is a pre-release.
#     It is the only job with `contents: write`, and it holds nothing else.
#
# - The enterprise web image (PRD-277 US-505): enterprise-frontend, published as
#   ghcr.io/<owner>/automatos-enterprise-frontend beside the local one. Its own name, so
#   the local image's name, tags, build inputs, cache scope and digests are what they
#   were: a name that starts with `frontend-` would also match the merge job's
#   `digests-frontend-*` download and join the local index. Built from the same context
#   with NEXT_PUBLIC_AUTH_EDITION=enterprise and the API and WebSocket addresses empty
#   (its build refuses any other value: it calls the API on the page's own address), and
#   measured, scanned, signed, checked on a tag, tagged and released by the same steps as
#   every other published image. Its server reads BACKEND_INTERNAL_URL and MEDIA_ORIGINS
#   when it starts, so its boot step is its own (frontend/scripts/check-enterprise-image.sh).
#
# Build args match docker-compose.yml, i.e. the local edition: no bundled
# Chromium, and the frontend built for AUTH_EDITION=local against
# http://localhost:8000 (NEXT_PUBLIC_* are inlined at build time, for now).
# The API takes no variant arg: Railway's build installs the same lock (PRD-262 US-027).
# Its one build arg is AUTOMATOS_VERSION, the version it reports (PRD-279 US-303).
# The API reads AUTH_EDITION at runtime; only the frontend fixes its edition
# at build time, and a hosted-edition frontend can't be published generically
# because its Clerk key is per deployment. Railway builds its own images and
# is unaffected.
#
# PRs build only when an image's inputs change (Dockerfiles, dependencies, the
# frontend's public files and build config, this file, the budgets): the
# changes job builds just the images whose inputs the PR touches, on both
# arches. test.yml's prod-image-parity job builds the three Railway-equivalent
# images on amd64 for PRs that touch its PROD_IMAGE_PATHS.
#
# The owner comes from the repository, so a fork publishes to its own
# namespace. New packages are private until an org owner makes them public.
#
# Third-party actions are pinned to a commit; the comment names the release.

# A media-assets run (PRD-262 US-053) is titled so, which is how smoke-images knows
# it published no app image; every other run keeps its default title.
run-name: ${{ inputs.media_assets && 'Publish the media assets image' || '' }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      # PRD-279 US-304: a fix cherry-picked to an older release's patch branch is built and
      # scanned as on main. A merge there publishes nothing: only its patch tag does.
      - "release/**"
    # Exactly the changes job's SHARED_INPUTS plus every image's `inputs`
    # (orchestrator/tests/test_prd262_image_matrix.py holds them equal).
    paths:
      - ".github/workflows/images.yml"
      - ".github/image-budgets.json"
      - ".grype.yaml"
      - "scripts/ci/image_*.py"
      - "orchestrator/Dockerfile"
      - "orchestrator/.dockerignore"
      - "orchestrator/requirements.in"
      - "orchestrator/requirements.lock"
      - "orchestrator/requirements-dev.txt"
      - "orchestrator/requirements-dev.lock"
      - "orchestrator/scripts/split_lock.py"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/next.config.js"
      - "frontend/csp-sources.js"
      - "frontend/csp-policy.mjs"
      - "frontend/enterprise-build.js"
      - "frontend/.npmrc"
      - "frontend/public/**"
      - "frontend/scripts/check-standalone-image.sh"
      - "frontend/scripts/check-enterprise-image.sh"
      - "services/workspace-worker/**"
      - "services/agent-opt-worker/**"
      - "services/media-render/**"
      - "services/voice-tts/**"
  # The weekly OS rebuild (PRD-262 US-011).
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Rebuild the OS-package stages from fresh packages, as the weekly run does (on a branch: never publishes)"
        type: boolean
        default: false
      media_assets:
        description: "Publish only the media assets image, automatos-media-assets (main only; PRD-262 US-053)"
        type: boolean
        default: false

concurrency:
  # A media-assets run has its own group: GitHub keeps one pending run per group,
  # so sharing main's would let it replace a queued publish, or be replaced by one.
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.media_assets && '-media-assets' || '' }}
  # Supersede stale PR builds; never cancel a publish half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The merge job's `if:` repeats this: job-level `if:` can't read `env`.
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
  # Schedule runs, and manual runs with `no_cache`, rebuild each image's
  # `no_cache_filters` stages from fresh packages (PRD-262 US-011).
  NO_CACHE: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}

jobs:
  # Which images this run builds, as the build job's matrix
  # (scripts/ci/image_matrix.py). A PR builds the images whose `inputs` it
  # touches, on both arches, or every image when it touches a SHARED_INPUTS
  # path; a push, a schedule or a manual run builds every image. If the PR's
  # file list can't be read, every image builds: a gap here only costs time.
  # A schedule run also gets its `weekly-<yyyymmdd>` tag here, from the run's
  # created_at (actions: read), which smoke-images.yml reads too.
  changes:
    name: Which images this change builds
    # A media-assets run builds no image here; build, report and merge need this
    # job, so they skip with it.
    if: inputs.media_assets != true
    runs-on: ubuntu-24.04
    # 15, not 5: on a `v*` tag this job also clones the full history (the release page check).
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
      weekly_tag: ${{ steps.pick.outputs.weekly_tag }}
      # PRD-279 US-101: set on a `v*` tag only, empty on every other run.
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout (the picker)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      # PRD-279 US-101, on a `v*` tag only: the version the tag names, before any image
      # builds. A tag that is not vMAJOR.MINOR.PATCH[-suffix], or a version below the
      # chart's own, fails this job, so nothing builds or publishes. Chart.yaml is read
      # at the tagged commit, because this checkout holds scripts/ci only.
      - name: The release version (v* tags only)
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/charts/automatos/Chart.yaml?ref=${GITHUB_SHA}" > "${RUNNER_TEMP}/Chart.yaml"
          python3 scripts/ci/release_version.py --ref "$GITHUB_REF" --chart-yaml "${RUNNER_TEMP}/Chart.yaml" \
            --outputs "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      # PRD-279 FR-6 and §5.5, on a `v*` tag only, before any image builds: no published
      # image has this version yet (read anonymously: the images are public), and the
      # tagged commit is in the default branch or in release/MAJOR.MINOR (GitHub's
      # compare API, with this job's read-only token). Either one failing, or not
      # answering, stops the run. A run whose version tags were never applied can run
      # again; once they exist, the next version is cut instead.
      - name: Release preflight (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 scripts/ci/release_preflight.py --version "$VERSION" --sha "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --default-branch "$DEFAULT_BRANCH" \
            --prefix "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/automatos-" \
            --image api --image frontend --image enterprise-frontend --image workspace-worker \
            --summary "$GITHUB_STEP_SUMMARY"

      # PRD-279 US-301, on a `v*` tag only, before any image builds: everything the release
      # page will say that needs no digest, refused here rather than after the images and
      # the chart are public (scripts/ci/release_page.py check): the upgrade file, the
      # previous release, the history, both sets of migrations, the notes rendered with
      # placeholder digests, and no page yet for the tag. The release-notes job makes the
      # same checks again before it creates the page. It needs every tag and the full
      # history, so the tagged commit is checked out again, whole, beside the picker's
      # sparse checkout, with no credentials kept. This job's token may read contents and
      # nothing more, so it cannot create a release.
      - name: Checkout (the history the release page is written from; v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: release-history

      - name: Release page check (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: release-history
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 scripts/ci/release_page.py check --repo "$GITHUB_REPOSITORY" --version "$VERSION" --sha "$GITHUB_SHA" \
            --image api --image frontend --image enterprise-frontend --image workspace-worker \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Pick the images
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # The images this workflow builds. `inputs` are the on.pull_request
          # paths that change the image. `publish: false` builds, measures and
          # scans an image without ever pushing the image to GHCR, so it has no
          # `edge`.
          # cache_mode: `min` for the API, whose pybuild output `max` would
          # export and never reuse; `max` for the frontend's builder
          # node_modules, and for the worker as before; `min` for
          # agent-opt-worker, whose one stage is all the image.
          # no_cache_filters: the stages whose apt or apk packages ship in the
          # image, which the weekly run rebuilds without the cache (PRD-262
          # US-011; orchestrator/tests/test_prd262_weekly_rebuild.py reads them
          # against each Dockerfile). The API's pybuild is not one: its compilers
          # never ship.
          # source_date_epoch (the API only, PRD-262 US-022): a fixed date, set
          # once (2026-10-19T00:00:00Z), that image_matrix.py passes as the
          # SOURCE_DATE_EPOCH build arg, with rewrite-timestamp=true appended to the
          # build's outputs (matrix.rewrite_timestamp), so a rebuilt layer is the
          # same bytes and a rebuild that changes nothing downloads nothing. Not
          # the lock's commit time: a lock change outside the stable set would
          # re-stamp the stable pip layer. Not on the other images: a constant
          # epoch would clamp the frontend's public/ mtimes, which its ETags read.
          # media-render (PRD-262 US-054) adds three keys the others leave at
          # their defaults: `cache: registry` (a private GHCR buildcache ref, not
          # the GHA cache, which a 1.8 GB image on two arches would evict; `max`,
          # so its builder stages are cached too), `on_disk` (§8 bars it on disk)
          # and `scan_report_only` (its first scans warn, whatever POLICY_MODE
          # says; the wave's last commit drops it).
          # voice-tts (Auto's server voice) is built and scanned like media-render
          # and never published, for the same reason (GPL-3.0 espeak-ng and
          # phonemizer), but keeps the GHA cache: `min`, so the 310 MB model is
          # cached once, in the image's own layer, not again in its fetch stage.
          # version_arg (the API only, PRD-279 US-303): the build arg image_matrix.py
          # sets to BUILD_VERSION, which the API reports; its Dockerfile reads it after
          # the last layer, so it rebuilds nothing and leaves the tree tags as they were.
          IMAGES: |
            [
              {"name": "api", "context": "orchestrator", "target": "production",
               "build_args": [],
               "source_date_epoch": 1792368000,
               "version_arg": "AUTOMATOS_VERSION",
               "cache_mode": "min", "no_cache_filters": ["base"],
               "arches": ["amd64", "arm64"], "publish": true,
               "inputs": ["orchestrator/Dockerfile", "orchestrator/.dockerignore",
                          "orchestrator/requirements.in", "orchestrator/requirements.lock",
                          "orchestrator/requirements-dev.txt", "orchestrator/requirements-dev.lock",
                          "orchestrator/scripts/split_lock.py"]},
              {"name": "frontend", "context": "frontend", "target": "production",
               "build_args": ["NEXT_PUBLIC_AUTH_EDITION=local",
                              "NEXT_PUBLIC_API_URL=http://localhost:8000",
                              "NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws",
                              "NEXT_PUBLIC_MEDIA_ORIGINS=http://localhost:9000"],
               "cache_mode": "max", "no_cache_filters": ["production"],
               "arches": ["amd64", "arm64"], "publish": true,
               "inputs": ["frontend/Dockerfile", "frontend/.dockerignore",
                          "frontend/package.json", "frontend/package-lock.json",
                          "frontend/next.config.js", "frontend/csp-sources.js",
                          "frontend/csp-policy.mjs", "frontend/enterprise-build.js",
                          "frontend/.npmrc", "frontend/public/**",
                          "frontend/scripts/check-standalone-image.sh"]},
              {"name": "enterprise-frontend", "context": "frontend", "target": "production",
               "build_args": ["NEXT_PUBLIC_AUTH_EDITION=enterprise",
                              "NEXT_PUBLIC_API_URL=",
                              "NEXT_PUBLIC_WS_URL="],
               "cache_mode": "max", "no_cache_filters": ["production"],
               "arches": ["amd64", "arm64"], "publish": true,
               "inputs": ["frontend/Dockerfile", "frontend/.dockerignore",
                          "frontend/package.json", "frontend/package-lock.json",
                          "frontend/next.config.js", "frontend/csp-sources.js",
                          "frontend/csp-policy.mjs", "frontend/enterprise-build.js",
                          "frontend/.npmrc", "frontend/public/**",
                          "frontend/scripts/check-standalone-image.sh",
                          "frontend/scripts/check-enterprise-image.sh"]},
              {"name": "workspace-worker", "context": "services/workspace-worker", "target": "",
               "build_args": ["INSTALL_BROWSER=false"],
               "cache_mode": "max", "no_cache_filters": ["production"],
               "arches": ["amd64", "arm64"], "publish": true,
               "inputs": ["services/workspace-worker/**"]},
              {"name": "agent-opt-worker", "context": "services/agent-opt-worker", "target": "production",
               "build_args": [],
               "cache_mode": "min", "no_cache_filters": [],
               "arches": ["amd64"], "publish": false,
               "inputs": ["services/agent-opt-worker/**"]},
              {"name": "media-render", "context": "services/media-render", "target": "production",
               "build_args": [],
               "cache_mode": "max", "cache": "registry", "no_cache_filters": ["runtime"],
               "arches": ["amd64", "arm64"], "publish": false,
               "on_disk": true, "scan_report_only": true,
               "inputs": ["services/media-render/**"]},
              {"name": "voice-tts", "context": "services/voice-tts", "target": "production",
               "build_args": [],
               "cache_mode": "min", "no_cache_filters": ["runtime"],
               "arches": ["amd64", "arm64"], "publish": false,
               "inputs": ["services/voice-tts/**"]}
            ]
          # What every image is built or judged by: a change here builds them all.
          SHARED_INPUTS: |
            [".github/workflows/images.yml", ".github/image-budgets.json", ".grype.yaml",
             "scripts/ci/image_*.py"]
          RUNNERS: '{"amd64": "ubuntu-24.04", "arm64": "ubuntu-24.04-arm"}'
          LOCAL_REGISTRY: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 # 2.8.3
          # PRD-279 US-303: what the API image reports. The tag's version on a `v*` tag
          # (the step above has checked its form), the full commit id on every other run.
          BUILD_VERSION: ${{ steps.release.outputs.version || github.sha }}
        run: |
          set -euo pipefail
          weekly=()
          if [ "$EVENT" = "schedule" ]; then
            created=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            weekly=(--created "$created")
          fi
          pick() {
            python3 scripts/ci/image_matrix.py --images "$IMAGES" --shared-inputs "$SHARED_INPUTS" \
              --runners "$RUNNERS" --owner "$GITHUB_REPOSITORY_OWNER" --publish "$PUBLISH" \
              --no-cache "$NO_CACHE" --local-registry "$LOCAL_REGISTRY" --version "$BUILD_VERSION" \
              "${weekly[@]}" "$@" | tee -a "$GITHUB_OUTPUT"
          }
          if [ "$EVENT" != "pull_request" ]; then pick --every < /dev/null; exit 0; fi
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "::warning::the PR's file list could not be read: every image builds"
            pick --every < /dev/null; exit 0
          fi
          if [ "$(wc -l <<< "$files")" -ge 3000 ]; then pick --every < /dev/null; exit 0; fi
          pick <<< "$files"

  build:
    name: build ${{ matrix.name }} (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    # The throwaway registry PR and branch builds push to (localhost:5000). A
    # build that publishes to GHCR leaves `registry` empty, so none starts.
    services:
      registry:
        image: ${{ matrix.registry }}
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PRD-262 US-013: Grype comes first, so its database download and load (73
      # to 120 s on 16 Oct) overlap the build instead of following it. Pinned to
      # 0.118.0, whose JSON the scan policy reads (`knownExploited` on a match).
      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v0.118.0

      # In the background, outside the checkout (Grype reads a .grype.yaml in its
      # working directory). The scan step waits for db.status.
      - name: Download the Grype database (background)
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          mkdir -p "${RUNNER_TEMP}/grype"
          cd "${RUNNER_TEMP}/grype"
          nohup bash -c '"$GRYPE" db update > db.log 2>&1; echo "$?" > db.status.tmp && mv db.status.tmp db.status' \
            > /dev/null 2>&1 < /dev/null &

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          # GitHub classifies LICENSE as "Other", so the default licence would be
          # NOASSERTION; the repository is Apache-2.0.
          labels: |
            org.opencontainers.image.title=automatos-${{ matrix.name }}
            org.opencontainers.image.licenses=Apache-2.0

      # network=host lets BuildKit's container reach the registry service on
      # localhost:5000.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      # To publish, and to read or write a registry build cache (media-render,
      # PRD-262 US-054), which lives in a private GHCR package.
      - name: Log in to GHCR
        if: matrix.ghcr_login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes by digest: to GHCR when publishing, to the job's registry
      # otherwise. Every run reads the cache; only publishing runs write it, so
      # PR and branch caches (which main can never read) stop crowding main's
      # out of the 10 GB GHA cache. The picker (scripts/ci/image_matrix.py)
      # writes both cache settings: the GHA cache, one scope per image and arch,
      # or media-render's GHCR buildcache ref. On a weekly or `no_cache` run,
      # no-cache-filters rebuilds the image's OS-package stages, and every step
      # after them, from fresh packages; the weekly run's cache-to then hands
      # those layers to the builds that follow.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ matrix.build_args }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true${{ matrix.rewrite_timestamp }}
          provenance: mode=max
          sbom: true
          cache-from: ${{ matrix.cache_from }}
          cache-to: ${{ matrix.cache_to }}
          no-cache-filters: ${{ matrix.no_cache_filters }}

      - name: Export digest
        if: matrix.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: matrix.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # Reads the pushed digest back: compressed size, each layer with its
      # Dockerfile instruction and heaviest paths, and the update delta against
      # the published `edge` (none for an image that is never published).
      - name: Size, layers and update delta
        id: measure
        env:
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EDGE: ${{ matrix.edge }}
          # Only a brand-new, still-private GHCR package needs these; reads are
          # anonymous otherwise.
          REGISTRY_USER: ${{ matrix.publish && github.actor || '' }}
          REGISTRY_TOKEN: ${{ matrix.publish && secrets.GITHUB_TOKEN || '' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/layers"
          python3 scripts/ci/image_report.py measure --name "$NAME" --arch "$ARCH" \
            --image "$IMAGE" --digest "$DIGEST" --edge "$EDGE" \
            --out "${RUNNER_TEMP}/layers/${NAME}-${ARCH}.json" --summary "$GITHUB_STEP_SUMMARY"

      # PRD-262 US-054: an image that is never published has no download a user
      # pays for, so §8 bars media-render on disk. This arch's image is pulled from
      # the job's registry, and the Size `docker image inspect` reports (what
      # media-render.yml's 1.30 GB check reads) joins the report, which the budget
      # step checks against the image's `on_disk_max_mb`.
      - name: On-disk size
        if: matrix.on_disk
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPORT: ${{ runner.temp }}/layers/${{ matrix.name }}-${{ matrix.arch }}.json
        run: |
          docker pull --quiet "${IMAGE}@${DIGEST}"
          size=$(docker image inspect -f '{{.Size}}' "${IMAGE}@${DIGEST}")
          echo "Docker's image store: $(docker info -f '{{.Driver}}')"
          docker image ls --digests "$IMAGE"
          python3 scripts/ci/image_report.py disk --report "$REPORT" --bytes "$size" --summary "$GITHUB_STEP_SUMMARY"
          # The scan reads the registry, not this copy.
          docker image rm "${IMAGE}@${DIGEST}" > /dev/null

      # The size budget, and the update bar where the image has one: a code-only
      # API update is one layer of 6 MB or less (PRD-262 US-016). Report only:
      # .github/image-budgets.json's `mode` is `warn` until PRD-262 US-004 sets
      # the baseline and switches it to `fail`.
      - name: Size and update budgets
        env:
          REPORT: ${{ runner.temp }}/layers/${{ matrix.name }}-${{ matrix.arch }}.json
        run: |
          python3 scripts/ci/image_report.py budget --report "$REPORT" \
            --budgets .github/image-budgets.json --summary "$GITHUB_STEP_SUMMARY"

      # Each image and arch builds in its own job, and a PR's registry ends with
      # it, so the report job reads the layers from here.
      - name: Upload the layer report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layers-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/layers/${{ matrix.name }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

      # Scans this architecture's image on its own runner: Grype picks one
      # platform from a multi-arch index, so scanning the merged index would
      # miss arm64. Every build is scanned, read straight from the registry it
      # pushed to: the job's registry:2 over plain HTTP on a PR or branch, GHCR
      # (with the login above) when publishing. No docker pull or save. It runs
      # outside the checkout, so Grype applies no allowlist: its table shows
      # every row, and the policy step below applies .grype.yaml. A scanner
      # error fails the job; on main the merge job then never runs (PRD-262
      # US-013).
      - name: Vulnerability scan
        working-directory: ${{ runner.temp }}/grype
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          GRYPE_REGISTRY_INSECURE_USE_HTTP: ${{ matrix.registry != '' }}
          GRYPE_DB_AUTO_UPDATE: "false"
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          DB_WAIT_SECONDS: "600"
        run: |
          waited=0
          until [ -f db.status ]; do
            if [ "$waited" -ge "$DB_WAIT_SECONDS" ]; then
              cat db.log
              echo "::error title=Grype database::not downloaded after ${DB_WAIT_SECONDS} s"
              exit 1
            fi
            sleep 5
            waited=$((waited + 5))
          done
          if [ "$(cat db.status)" != "0" ]; then
            cat db.log
            echo "::error title=Grype database::the download failed"
            exit 1
          fi
          echo "The Grype database was ready after ${waited} s of waiting."
          "$GRYPE" "registry:${IMAGE}@${DIGEST}" --platform "linux/${ARCH}" -o table -o json=report.json

      - name: Upload the scan report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/grype/report.json
          if-no-files-found: error
          retention-days: 30

      # The policy reads .grype.yaml, so it needs PyYAML.
      - name: Set up Python (the scan policy)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # PRD-262 US-013 (D1, FR-3): fails on a fixable Critical, or a KEV match of
      # any severity, that no unexpired .grype.yaml entry covers. POLICY_MODE is
      # `report` (warnings only) until the W1 wave's last commit sets `fail`, once
      # every current finding is fixed or allowlisted. An allowlist entry without
      # a reason or an expiry, or one more than 90 days out, fails in either mode.
      # PRD-279 US-102: on a `v*` tag (--ref) the policy runs in `fail` mode whatever
      # POLICY_MODE says, so no version is published from an image it would fail. On
      # every other ref --ref changes nothing.
      - name: Scan policy
        env:
          POLICY_MODE: report
          REPORT: ${{ runner.temp }}/grype/report.json
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
          # PRD-262 US-054: an image scanned here for the first time (IMAGES'
          # `scan_report_only`: media-render) is judged report only, whatever
          # POLICY_MODE says, until each finding it shows is fixed or allowlisted.
          # It can only lower the mode, never raise it, on a `v*` tag too: such an
          # image is never published, so it is in no release.
          SCAN_REPORT_ONLY: ${{ matrix.scan_report_only }}
        run: |
          if [ "$SCAN_REPORT_ONLY" = "true" ]; then POLICY_MODE=report; fi
          python -m pip install --disable-pip-version-check --quiet "pyyaml==6.0.3"
          python scripts/ci/image_scan_policy.py check --report "$REPORT" --allowlist .grype.yaml \
            --mode "$POLICY_MODE" --ref "$GITHUB_REF" --report-only "$SCAN_REPORT_ONLY" \
            --name "$NAME" --arch "$ARCH" --summary "$GITHUB_STEP_SUMMARY"

      # PRD-262 US-014: the API's production stage compiles the stdlib once, as
      # root. In the layer listing above, the layer that RUN made holds stdlib
      # .pyc files and no path under site-packages, whose bytecode comes only
      # from pybuild. After the reports and the scan, so they run first.
      - name: The stdlib bytecode layer
        if: matrix.name == 'api'
        env:
          REPORT: ${{ runner.temp }}/layers/${{ matrix.name }}-${{ matrix.arch }}.json
        run: |
          python3 scripts/ci/image_report.py layer --report "$REPORT" --instruction compileall \
            --under usr/local/lib/python3.11/ --not-under usr/local/lib/python3.11/site-packages/ \
            --suffix .pyc --summary "$GITHUB_STEP_SUMMARY"

      # PRD-262 US-020: pybuild strips the debug sections from site-packages'
      # compiled libraries and deletes its tests/ directories. In the image this
      # job pushed, on this arch, every file the strip touched still loads (an
      # extension module is imported, any other library opened with ctypes), none
      # keeps a .debug_* section, numpy's, SQLAlchemy's and alembic's testing
      # packages stay, and `import main` works (scripts/ci/image_site_packages.py,
      # which lists the failures the image has always had, each with its reason).
      # It pulls the digest, from the job's registry on a pull request, and runs
      # whenever the build pushed one, even after a failed check above, so one red
      # step never hides this one. On main a failure leaves the digest untagged and
      # unsigned, as a failed scan does. test.yml's prod-image-parity runs the same
      # check on the Railway build.
      - name: Every native library in site-packages loads, without debug info
        if: ${{ !cancelled() && matrix.name == 'api' && steps.build.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --quiet "${IMAGE}@${DIGEST}"
          docker run --rm -i --entrypoint python "${IMAGE}@${DIGEST}" - < scripts/ci/image_site_packages.py

      # PRD-262 US-021: pybuild keeps botocore's models for the services we call (s3,
      # s3vectors, bedrock-runtime, sts, sso, sso-oidc) and its top-level files. In the
      # same image, boto3 builds a client for each kept service, the s3 one presigns a
      # GET, and any other service is unknown (scripts/ci/image_botocore.py). Same
      # conditions as the step above; test.yml's prod-image-parity runs it on the
      # Railway build.
      - name: botocore keeps the services we call, and builds a client for each
        if: ${{ !cancelled() && matrix.name == 'api' && steps.build.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --quiet "${IMAGE}@${DIGEST}"
          docker run --rm -i --entrypoint python "${IMAGE}@${DIGEST}" - < scripts/ci/image_botocore.py

      # PRD-262 row #17: pybuild deletes the scipy subpackages no code path loads. In the
      # same image the kept ones import, every path by which the code reaches scipy runs
      # (datasketch's MinHashLSH, graphify's dedup, the code graph's pagerank, the
      # Knowledge Graph's Leiden chain, core.math's Student's t), and none of it loads a
      # deleted subpackage or graphify.extract (scripts/ci/image_scipy.py). Same
      # conditions as the step above; test.yml's prod-image-parity runs it on the Railway
      # build.
      - name: scipy keeps what the code reaches, and it runs
        if: ${{ !cancelled() && matrix.name == 'api' && steps.build.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --quiet "${IMAGE}@${DIGEST}"
          docker run --rm -i --entrypoint python "${IMAGE}@${DIGEST}" - < scripts/ci/image_scipy.py

      # PRD-262 US-019 and the 19 Oct breakdown's rows #13 and #35: the base stage's apt
      # layer installs what the code calls and deletes the rest. In the same image, on
      # this arch, tesseract reads an OCR fixture without ICU and its training tools, which
      # nothing links any more, git's trim leaves its builtins and HTTPS helper working,
      # and fontconfig serves fonts-urw-base35's OpenType faces for Helvetica, Times,
      # Courier, Palatino and Bookman with its Type1 copies gone
      # (scripts/ci/image_system_tools.py). Same conditions as the step above; test.yml's
      # prod-image-parity runs it on the Railway build.
      - name: The system packages the code calls work, and the rest are gone
        if: ${{ !cancelled() && matrix.name == 'api' && steps.build.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --quiet "${IMAGE}@${DIGEST}"
          docker run --rm -i --entrypoint python "${IMAGE}@${DIGEST}" - < scripts/ci/image_system_tools.py

      # PRD-262 rows #11 and #47: the lock pins them, but orchestrator/scripts/split_lock.py
      # leaves them out of the production image: LEFT_OUT, the 12 tree-sitter grammars only
      # graphify.extract imports, and DEVELOPMENT_ONLY, watchfiles, which only the
      # development stage's --reload uses (scripts/ci/image_dists_absent.py reads the
      # image's package metadata). Same conditions as the step above; test.yml's
      # prod-image-parity runs it on the Railway build.
      - name: The lock's left-out and development-only packages are not in the image
        if: ${{ !cancelled() && matrix.name == 'api' && steps.build.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          LEFT_OUT: tree-sitter-bash tree-sitter-elixir tree-sitter-fortran tree-sitter-groovy tree-sitter-json tree-sitter-julia tree-sitter-lua tree-sitter-objc tree-sitter-powershell tree-sitter-scala tree-sitter-verilog tree-sitter-zig watchfiles
        run: |
          docker pull --quiet "${IMAGE}@${DIGEST}"
          read -ra names <<< "$LEFT_OUT"
          docker run --rm -i --entrypoint python "${IMAGE}@${DIGEST}" - "${names[@]}" < scripts/ci/image_dists_absent.py

      # PRD-262 US-022: pybuild installs requirements.lock in two halves, copied as two
      # layers (the stable set, then the rest), and this build is reproducible. On a
      # push to main (not the weekly schedule run), each layer must be the published
      # `edge`'s when the half it holds and pybuild (its stages, the base and uv
      # digests, split_lock.py) are what they were at edge's revision; a half that moved
      # makes a new layer, which the report above counts as the update. A layer that
      # should match and does not is judged by the distributions both install: the same
      # set is a warning (pybuild's apt layer or BuildKit's compression moved the
      # bytes), another set fails (scripts/ci/image_pip_layers.py). edge's three files
      # come from its revision; an edge built before the split has no split_lock.py,
      # and the check says so and passes.
      - name: The pip layers are edge's when their inputs are
        if: ${{ !cancelled() && matrix.name == 'api' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.measure.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/layers/${{ matrix.name }}-${{ matrix.arch }}.json
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          edge_dir="${RUNNER_TEMP}/edge-files"
          revision=$(jq -r '.edge.revision // ""' "$REPORT")
          if [ -n "$revision" ]; then
            for path in orchestrator/Dockerfile orchestrator/requirements.lock orchestrator/scripts/split_lock.py; do
              mkdir -p "$edge_dir/$(dirname "$path")"
              if ! gh api -H "Accept: application/vnd.github.raw+json" \
                  "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${revision}" > "$edge_dir/$path"; then
                echo "$path is not in edge's revision ${revision}"
                rm -f "$edge_dir/$path"
              fi
            done
          fi
          python3 scripts/ci/image_pip_layers.py --report "$REPORT" --edge-dir "$edge_dir" \
            --summary "$GITHUB_STEP_SUMMARY"

      # PRD-262 (US-046 and the cuts after it): the frontend image this job pushed, on this
      # arch, boots with no network, serves /chat, and carries nothing the trimmed build leaves
      # out (frontend/scripts/check-standalone-image.sh lists each check). It pulls the digest,
      # from the job's registry on a pull request, and runs whenever the build pushed one, even
      # after a failed check above, so one red step never hides this one. test.yml's
      # prod-image-parity runs the same script on the SaaS and the local builds, on amd64 only.
      - name: The frontend image serves with no network, without what its build leaves out
        if: ${{ !cancelled() && matrix.name == 'frontend' && steps.build.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --quiet "${IMAGE}@${DIGEST}"
          bash frontend/scripts/check-standalone-image.sh "${IMAGE}@${DIGEST}" /chat

      # PRD-277 US-505, PRD-279 US-402: the enterprise web image this job pushed, on this arch,
      # started as an install starts it. Its server refuses to start without BACKEND_INTERNAL_URL
      # or with a bad MEDIA_ORIGINS; started with both, it passes the local image's checks above
      # (with /sign-in, the page a signed-out request renders), and a page's content security
      # policy names the media origin given when it started (frontend/scripts/
      # check-enterprise-image.sh says what each check proves and what it does not). Same
      # conditions as the step above; on main a failure leaves the digest untagged and unsigned.
      - name: The enterprise web image starts with its run-time settings and stops without them
        if: ${{ !cancelled() && matrix.name == 'enterprise-frontend' && steps.build.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --quiet "${IMAGE}@${DIGEST}"
          bash frontend/scripts/check-enterprise-image.sh "${IMAGE}@${DIGEST}"

      # PRD-262, the worker's trims (rows 16 and 19 of the 19 Oct size breakdown, and
      # the rows each check names): in the image this job pushed, on this arch, the
      # agent toolchain still works. gcc -flto links without lto-dump; git makes,
      # commits, branches, clones and pulls without its server-side binaries, and
      # clones over HTTPS; and (F452) no file keeps a setuid or setgid bit, and
      # setpriv's drop to the worker sets no_new_privs
      # (scripts/ci/image_worker_toolchain.py). It pulls the digest,
      # from the job's registry on a pull request, and runs whenever the build pushed
      # one, even after a failed check above, so one red step never hides this one.
      # On main a failure leaves the digest untagged and unsigned, as a failed scan does.
      - name: The worker's agent toolchain still compiles, clones and runs
        if: ${{ !cancelled() && matrix.name == 'workspace-worker' && steps.build.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --quiet "${IMAGE}@${DIGEST}"
          # As root: the script checks root's paths and drops to the worker as the root start
          # does. The image itself starts as uid 1000 (PRD-280 US-201).
          docker run --rm -i --user 0 --entrypoint python "${IMAGE}@${DIGEST}" - < scripts/ci/image_worker_toolchain.py

      # PRD-262, the worker's Python layer (rows 27, 40 and 47, and the rows each check
      # names): every library the stable layer's strip touched still loads, as the
      # worker user, with no debug sections left, and no tests directory is left;
      # psycopg2, built against Debian's libpq, connects to the compose stack's
      # Postgres image (trust auth on a throwaway network, so no password) and runs a
      # parameterised query; the distributions the cuts removed are gone
      # (scripts/ci/image_worker_site_packages.py). Same conditions as the step above.
      - name: The worker's site-packages load after the strip, and psycopg2 reaches Postgres
        if: ${{ !cancelled() && matrix.name == 'workspace-worker' && steps.build.outcome == 'success' }}
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          # docker-compose.yml's database image, the one the worker writes task status to.
          POSTGRES_IMAGE: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        run: |
          docker pull --quiet "${IMAGE}@${DIGEST}"
          docker network create worker-probe > /dev/null
          docker run -d --name worker-probe-db --network worker-probe \
            -e POSTGRES_HOST_AUTH_METHOD=trust "$POSTGRES_IMAGE" > /dev/null
          docker run --rm -i --user 1000 --network worker-probe \
            -e PROBE_DATABASE_URL=postgresql://postgres@worker-probe-db:5432/postgres \
            --entrypoint python "${IMAGE}@${DIGEST}" - < scripts/ci/image_worker_site_packages.py

  # Across the build jobs: the layers the API and the worker share, and what the
  # app images cost to pull together, per arch. An image this run did not build
  # counts as its current `edge`. PRD-262 US-058's shared-layer check reads it.
  report:
    name: image report
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      shared_layers_amd64: ${{ steps.report.outputs.shared_layers_amd64 }}
      shared_layers_arm64: ${{ steps.report.outputs.shared_layers_arm64 }}
      first_pull_bytes_amd64: ${{ steps.report.outputs.first_pull_bytes_amd64 }}
      first_pull_bytes_arm64: ${{ steps.report.outputs.first_pull_bytes_arm64 }}
    steps:
      - name: Checkout (the report script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Download the layer reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/layers
          pattern: layers-*
          merge-multiple: true

      - name: Shared layers and first pull
        id: report
        run: |
          python3 scripts/ci/image_report.py report --dir "${RUNNER_TEMP}/layers" \
            --edge-prefix "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/automatos-" \
            --out "${RUNNER_TEMP}/image-report.json" \
            --summary "$GITHUB_STEP_SUMMARY" --outputs "$GITHUB_OUTPUT"

      - name: Upload the image report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-report
          path: ${{ runner.temp }}/image-report.json
          if-no-files-found: error
          retention-days: 30

  merge:
    name: publish ${{ matrix.image.name }}
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [changes, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # cosign keyless signing exchanges the job's OIDC token for a certificate.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # The description is set on the multi-arch index, where GHCR reads it.
        # `context` names the build context whose tree tags the image (tree-<12>).
        image:
          - name: api
            context: orchestrator
            description: Automatos AI backend API (orchestrator), built without the graph-clustering extras. The edition is set at runtime by AUTH_EDITION. For now, run it with the repository's docker compose, which supplies the wait-migrate-seed entrypoint.
          - name: frontend
            context: frontend
            description: Automatos AI web app, local edition. The API address is currently fixed at build time to http://localhost:8000; a runtime setting is coming.
          - name: enterprise-frontend
            context: frontend
            description: Automatos AI web app, enterprise edition. People sign in with their organisation's identity provider, and the web app calls the API on its own address, so serve both on one host. The server reads BACKEND_INTERNAL_URL (required) and MEDIA_ORIGINS when it starts.
          - name: workspace-worker
            context: services/workspace-worker
            description: Automatos AI workspace worker (Code Canvas runtime), built without Chromium.

    steps:
      # The context's git tree (tree-<12>, last step) and the tool that names it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Image name
        env:
          NAME: ${{ matrix.image.name }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/automatos-${NAME}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image.name }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          annotations: |
            org.opencontainers.image.title=automatos-${{ matrix.image.name }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.licenses=Apache-2.0
          # No `latest` until the maintainers choose to publish one. No `edge`
          # either: smoke-images.yml's promote-edge job moves it once this
          # `sha-<short>` has booted on both arches (PRD-262 US-003).
          # A schedule run publishes only `weekly-<yyyymmdd>` (PRD-262 US-011): every other
          # tag is off for it, so a `sha-<short>` is never re-pushed with other packages.
          # A `v*` tag (PRD-279 US-101) publishes the index only under release-staging-<run id>-
          # <attempt>, not a version and no `sha-<short>` (its main push made that): the release-images
          # job adds the version tags once every image is signed and checked. Every other run
          # pushes what it did before.
          flavor: |
            latest=false
          tags: |
            type=sha,enable=${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/v') }}
            type=schedule,pattern=${{ needs.changes.outputs.weekly_tag }}
            type=raw,value=release-staging-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        env:
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          docker buildx version | python3 "${GITHUB_WORKSPACE}/scripts/ci/release_digests.py" buildx
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          annotation_args=()
          while IFS= read -r annotation; do
            [ -n "$annotation" ] && annotation_args+=(--annotation "$annotation")
          done <<< "$ANNOTATIONS"
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create --metadata-file "${RUNNER_TEMP}/index-metadata.json" "${tag_args[@]}" "${annotation_args[@]}" "${sources[@]}"

      - name: The index digest, from the create step
        id: index
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/release_digests.py index --metadata "${RUNNER_TEMP}/index-metadata.json" --matrix "$MATRIX" \
            --built "${RUNNER_TEMP}/digests" --image "$IMAGE" --outputs "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign (keyless)
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # PRD-279 US-103, on a `v*` tag only: the signature just made must check against
      # this repository's images.yml at the tag that ran, with the certificate's
      # identity, issuer, repository, ref, commit and workflow name pinned exactly
      # (scripts/ci/release_signing.py). A failed check fails the job, so the chart is
      # not published.
      - name: Verify the signature (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          python3 scripts/ci/release_signing.py verify --image "${IMAGE}@${DIGEST}" \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --sha "$GITHUB_SHA"

      # PRD-279 US-201, on a `v*` tag only: the signed index digest, for the
      # release-chart job to write into the chart's default values.
      - name: Record the digest for the chart (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NAME: ${{ matrix.image.name }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/release-digest"
          printf '%s\n' "$DIGEST" > "${RUNNER_TEMP}/release-digest/${NAME}"

      - name: Upload the digest for the chart (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digest-${{ matrix.image.name }}
          path: ${{ runner.temp }}/release-digest/${{ matrix.image.name }}
          if-no-files-found: error
          retention-days: 30

      # PRD-262 US-036: tree-<12> of the image's build context, which `make up`
      # pulls for a commit with no sha-<short> of its own (scripts/stack_images.py
      # names the tag the same way). Like sha-<short>, it is never re-pushed: a
      # schedule run skips this step, and a tree already published keeps the digest
      # it has, with the revision of the commit that first built it. One source and
      # no annotations, so imagetools pushes the signed index's bytes unchanged, as
      # promote-edge does. A registry that cannot be read pushes nothing.
      - name: Tag the context's tree (tree-<12>, once per tree)
        if: github.event_name != 'schedule'
        env:
          CONTEXT: ${{ matrix.image.context }}
          DIGEST: ${{ steps.index.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(python3 scripts/stack_images.py tree-tag --context "$CONTEXT")
          status=0
          python3 scripts/stack_images.py published "${IMAGE}:${tag}" || status=$?
          case "$status" in
            0) echo "${IMAGE}:${tag} was already published: a tree tag is never re-pushed" >> "$GITHUB_STEP_SUMMARY" ;;
            1) docker buildx imagetools create -t "${IMAGE}:${tag}" "${IMAGE}@${DIGEST}"
               echo "Published ${IMAGE}:${tag}" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::warning title=tree tag::could not tell whether ${IMAGE}:${tag} is published, so it was not pushed" ;;
          esac

  # PRD-279 US-101, on a `v*` tag only, once every merge leg has published its image
  # under the staging tag, signed it and checked the signature: one step puts the
  # version tags on every image, by digest (scripts/ci/release_tags.py). It reads every
  # image's tags before it writes any, refuses a version that points elsewhere, and
  # finishes a set a stopped run of this job began (re-run the failed jobs).
  # `X.Y.Z` always, `X.Y` for a full release only; imagetools adds a tag without
  # writing a new manifest, so each tag is the very digest that was signed.
  release-images:
    name: tag the images with the version (v* tags only)
    needs: [changes, merge]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - name: Checkout (the release tools)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Download the signed digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release-digests
          pattern: release-digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The images the merge job publishes (a test holds the lists equal).
      - name: Tag every image with the version
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/release_tags.py --digests "${RUNNER_TEMP}/release-digests" \
            --prefix "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/automatos-" --version "$VERSION" \
            --image api --image frontend --image enterprise-frontend --image workspace-worker \
            --summary "$GITHUB_STEP_SUMMARY"

  # PRD-279 Wave 2 (US-201, US-202), on a `v*` tag only, once every image is signed,
  # checked and tagged with the version. charts/automatos is copied, each image's
  # repository and signed digest written into the copy's values (scripts/ci/
  # release_chart.py), and the copy packaged with the tag's version as its `version`
  # and `appVersion`; the chart in the repository keeps `appVersion: "edge"`. The
  # package is rendered with only existingSecret set and must name every image by
  # digest. It is pushed to ghcr.io/<owner>/charts/automatos as an OCI artifact, never
  # over a version that exists (GHCR would overwrite a tag, so this job refuses), and
  # signed and checked as the images are. `helm push` tags the chart with its version,
  # so it is visible before it is signed: when signing or the check fails, the job
  # deletes the version it pushed (GitHub's packages API, the built-in token) and fails.
  # A new package is private until an org owner makes it public
  # (docs/deployment-infrastructure/releases.md).
  release-chart:
    name: publish the chart (v* tags only)
    needs: [changes, release-images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # cosign keyless signing exchanges the job's OIDC token for a certificate.
      id-token: write
    # The release page names the chart by this digest (PRD-279 US-301).
    outputs:
      digest: ${{ steps.chart.outputs.digest }}
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      HELM_VERSION: v4.3.0
      # https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      # cosign-installer v4.1.3's default, checked against the hash the action carries.
      COSIGN_VERSION: v3.1.4
    steps:
      - name: Checkout (the chart and the release tools)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            charts
            scripts

      - name: Set up Python (the release tools read YAML)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Helm (pinned, checksum checked)
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/helm.tar.gz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "${RUNNER_TEMP}" linux-amd64/helm
          sudo mv "${RUNNER_TEMP}/linux-amd64/helm" /usr/local/bin/helm
          helm version

      - name: Chart names
        run: |
          {
            echo "CHART_REGISTRY=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
            echo "CHART=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/automatos"
            echo "PACKAGE=${RUNNER_TEMP}/dist/automatos-${VERSION}.tgz"
          } >> "$GITHUB_ENV"

      - name: Download the image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release-digests
          pattern: release-digest-*
          merge-multiple: true

      - name: Package the chart with every image's digest
        run: |
          python -m pip install --disable-pip-version-check --quiet "pyyaml==6.0.3"
          python scripts/ci/release_chart.py prepare --chart charts/automatos --out "${RUNNER_TEMP}/chart" \
            --digests "${RUNNER_TEMP}/release-digests" --prefix "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/automatos-" \
            --version "$VERSION" --images "${RUNNER_TEMP}/images.json" \
            --render-values "${RUNNER_TEMP}/render-values" --summary "$GITHUB_STEP_SUMMARY"
          helm package "${RUNNER_TEMP}/chart/automatos" --version "$VERSION" --app-version "$VERSION" \
            --destination "${RUNNER_TEMP}/dist"

      # US-201: an install of the packaged chart runs exactly the published images, in
      # every published edition. One render per edition (local, the chart's default, and
      # enterprise, PRD-277 US-505), each with existingSecret and the values file
      # release_chart.py wrote for that edition (the least it renders with, made-up
      # values); check-rendered fails when an edition was not rendered, or its render
      # names an image by a tag or runs any image but that edition's published ones.
      - name: Render the packaged chart; fail on any image named by a tag
        run: |
          mkdir -p "${RUNNER_TEMP}/rendered"
          for values in "${RUNNER_TEMP}/render-values"/*.yaml; do
            helm template automatos "$PACKAGE" --set existingSecret=ci --values "$values" \
              > "${RUNNER_TEMP}/rendered/$(basename "$values")"
          done
          python scripts/ci/release_chart.py check-rendered --rendered "${RUNNER_TEMP}/rendered" \
            --images "${RUNNER_TEMP}/images.json" --version "$VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # US-202: a published version is never overwritten. GHCR moves a tag that is
      # pushed again, so the job reads the registry first and pushes only when the
      # version is not there; a registry it cannot read pushes nothing. Runs of one tag
      # never overlap (the workflow's concurrency group is per ref).
      - name: Refuse a version that is already published
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          python scripts/stack_images.py published "${CHART}:${VERSION}" || status=$?
          case "$status" in
            1) echo "${CHART}:${VERSION} is not published yet" ;;
            0) echo "::error title=Chart version exists::${CHART}:${VERSION} is already published, and a version is never overwritten: cut a new tag"
               exit 1 ;;
            *) echo "::error title=Chart version unknown::could not tell whether ${CHART}:${VERSION} is published, so nothing was pushed"
               exit 1 ;;
          esac

      - name: Push the chart
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin <<< "$REGISTRY_TOKEN"
          helm push "$PACKAGE" "$CHART_REGISTRY" > "${RUNNER_TEMP}/helm-push.log"

      - name: The chart's digest, from the push
        id: chart
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/release_digests.py chart --push-log "${RUNNER_TEMP}/helm-push.log" --chart "$CHART" --version "$VERSION" --package "$PACKAGE" --outputs "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the chart (keyless)
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "${CHART}@${DIGEST}"

      # US-202: the chart's signature is checked as each image's is (US-103).
      - name: Verify the chart's signature
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          python scripts/ci/release_signing.py verify --image "${CHART}@${DIGEST}" \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --sha "$GITHUB_SHA"
          {
            echo "Published \`${CHART}:${VERSION}\` (\`${DIGEST}\`), signed by images.yml at \`${GITHUB_REF}\`."
            echo
            echo '```bash'
            echo "helm install automatos ${CHART_REGISTRY}/automatos --version ${VERSION} --set existingSecret=<your Secret>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # US-202: a chart that was pushed but not proven (the digest unread, signing or
      # the check failed) does not stay published under the version. GitHub lets the
      # built-in token delete a version of a package the repository's workflow
      # published (the repository holds its admin role); if GitHub refuses, the step
      # names what a maintainer must delete by hand. The job fails either way.
      - name: Remove the chart version it could not prove
        if: failure() && steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          python scripts/ci/release_chart.py remove --owner "$GITHUB_REPOSITORY_OWNER" \
            --owner-type "$OWNER_TYPE" --tag "$VERSION"

  # PRD-279 US-301, on a `v*` tag only, once every image is signed, checked and tagged with
  # the version and the chart is published, signed and checked: the release page, with the
  # notes of §5.4 (scripts/ci/release_page.py; the Markdown is release_notes.py's, the
  # history release_history.py's). It is the one job that may write the repository's
  # contents, which creating a release needs, and it holds nothing else: no packages, no
  # OIDC token, so it cannot sign. Commit text reaches it only as git's output, read by
  # the script as data and shown inside code spans; nothing from a tag, a commit or a file
  # reaches the shell. A release page that exists is never changed: the job fails instead.
  # The full history is fetched, so the previous release's tag and files can be read. The
  # changes job has already made every one of these checks that needs no digest, before
  # any image was built; this job makes them again (`release_page.py publish`).
  release-notes:
    name: create the release page (v* tags only)
    needs: [changes, release-images, release-chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      CHART_DIGEST: ${{ needs.release-chart.outputs.digest }}
    steps:
      - name: Checkout (every tag and the history between releases)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download the signed digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release-digests
          pattern: release-digest-*
          merge-multiple: true

      # The images the merge job publishes (a test holds the lists equal).
      - name: Write the notes and create the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/release_page.py publish --repo "$GITHUB_REPOSITORY" --version "$VERSION" --sha "$GITHUB_SHA" \
            --digests "${RUNNER_TEMP}/release-digests" --chart-digest "$CHART_DIGEST" \
            --image api --image frontend --image enterprise-frontend --image workspace-worker \
            --notes "${RUNNER_TEMP}/release-notes.md" --summary "$GITHUB_STEP_SUMMARY"

  # PRD-262 US-053: the media assets image, ghcr.io/<owner>/automatos-media-assets.
  # media-render's build is to copy the Kokoro model and voices and the music tracks
  # from it, pinned as its own stage (`FROM …automatos-media-assets:<tag>@sha256:…
  # AS assets-image`, FR-9, picked by its MEDIA_ASSETS build arg), instead of fetching
  # them from GitHub releases and ende.app on every build. PR builds never push to
  # GHCR, so this job publishes it, and only on a manual run on main with
  # `media_assets`.
  # - scripts/ci/media_assets.py fetches every file services/media-render/kokoro/
  #   assets.json and music/manifest.json name and checks each sha256 before the
  #   build; after the push it reads the image back, per platform, and checks every
  #   file again, and only then is the image signed.
  # - Until Gerard picks the D4 model by ear (US-050), every candidate is in it: the
  #   fp32 model media-render runs today, the v1.1 release's fp16 and the v1.0
  #   release's fp16, with the voices file and the music tracks.
  # - Its licence label is the stage step's expression, `Apache-2.0 AND CC-BY-4.0`
  #   (the Kokoro weights; the CC BY tracks), not the Apache-2.0 the image jobs stamp.
  #   /NOTICE carries the Kokoro notice and every track's attribution line. It holds
  #   data only, no GPL code, so publishing it is separate from §9-Q6.
  # - FROM scratch, one layer per file, timestamps at SOURCE_DATE_EPOCH=0: a file that
  #   did not change keeps its layer digest when the image is published again.
  # - A new GHCR package is private. An org owner makes it public once (PRD-262 §10),
  #   so Railway and self-hosters' `--profile media` builds pull it with no login; the
  #   last step reports whether an anonymous pull works yet.
  media-assets:
    name: publish media-assets
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.media_assets == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # cosign keyless signing exchanges the job's OIDC token for a certificate.
      id-token: write
    env:
      DESCRIPTION: Data only, the Kokoro voice model files and the music library that Automatos media-render builds from. Licences and attributions are in /NOTICE.
    steps:
      - name: Checkout (the tool and the lists)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Cone mode keeps the root files, so LICENSE comes too.
          sparse-checkout: |
            scripts/ci
            services/media-render

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/automatos-media-assets" >> "$GITHUB_ENV"

      - name: Fetch every file and check its sha256
        id: stage
        run: |
          python3 scripts/ci/media_assets.py stage --out "${RUNNER_TEMP}/media-assets" \
            --outputs "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action adds the revision, source and created labels every image
      # carries; the title, description and licences are this image's own.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=automatos-media-assets
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=${{ steps.stage.outputs.licences }}
          annotations: |
            org.opencontainers.image.title=automatos-media-assets
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=${{ steps.stage.outputs.licences }}
          flavor: |
            latest=false
          tags: |
            type=sha

      # Data only, so both platforms build on this runner with no emulation and share
      # every layer.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: ${{ runner.temp }}/media-assets
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: false

      # What was published, not what was staged: each platform's files, exported from
      # the registry by digest, against the same lists.
      - name: Check the published files again
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for arch in amd64 arm64; do
            dest="${RUNNER_TEMP}/published-${arch}"
            printf 'FROM %s@%s\n' "$IMAGE" "$DIGEST" \
              | docker buildx build --platform "linux/${arch}" --provenance=false --sbom=false \
                  --output "type=local,dest=${dest}" -
            python3 scripts/ci/media_assets.py verify --dir "$dest" --summary "$GITHUB_STEP_SUMMARY"
            rm -rf "$dest"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The line media-render's Dockerfile pins (FR-9: name:tag@sha256), and whether
      # the package is public yet. Report only: the first publish is always private.
      - name: Pin line and anonymous pull
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          {
            echo "Published \`${tag}@${DIGEST}\`. media-render's Dockerfile pins it as its own stage, and its MEDIA_ASSETS default becomes image:"
            echo
            echo '```dockerfile'
            echo "FROM ${tag}@${DIGEST} AS assets-image"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          repository="${IMAGE#ghcr.io/}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repository}:pull" | jq -r '.token // empty') || token=""
          if [ -n "$token" ] && curl -fsS -o /dev/null -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json" "https://ghcr.io/v2/${repository}/manifests/${DIGEST}"; then
            echo "An anonymous pull of the digest works: the package is public." >> "$GITHUB_STEP_SUMMARY"
          else
            message="${IMAGE} is private, so Railway's media-render build and --profile media builds cannot pull it. An org owner makes it public once (PRD-262 §10): https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/automatos-media-assets/settings"
            echo "::warning title=media-assets is private::${message}"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
