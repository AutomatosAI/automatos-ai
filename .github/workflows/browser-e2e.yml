name: browser-e2e

# PRD-261 A-00 — the browser lane: Playwright on Chromium and WebKit against the
# local edition. Frontend tests elsewhere are vitest on jsdom; this lane proves
# what only a real browser shows (module loading, import maps, real rendering).
#
# How it runs:
# - The backend boots the way smoke-fresh-clone.yml does (postgres, redis, minio,
#   backend through docker compose, no external credentials), so the app has a
#   real local workspace.
# - The frontend is built and served on the runner from its standalone output,
#   the same build every image ships (PRD-261 A-04a: the theme host has no build
#   flag; `npm run build` generates the theme-sdk shims in its prebuild step).
#   The page origin is http://localhost:3000, the backend's CORS default.
# - Playwright lives in its own package (e2e/browser/package.json, exact pins and
#   its own committed lockfile, installed with npm ci), so frontend/package-lock.json
#   never changes for it.
#
# It watches only the paths below (the app shell, the theme host and every folder
# PRD-261 Phase A touches (PA-6), the boot substrate and itself). A change to the
# rest of the backend or to other pages can break it without running it. See
# e2e/browser/README.md. PRD-261 A-17b widened it to what counted as Play then (the
# hooks, the chat store and plain-line stay on it) and to the chat code the Play
# specs read (lib/chat, components/widgets), so a change there runs them. PRD-261
# A-19f4 (W-A8): builtin Play's folders left core with it, and their entries left
# this list; Play lives only in the Design Kit, and this lane installs its package
# (the `package` job, below). PRD-261 B-03h added the web app's host file, which the
# kit's CLI reads (frontend/app/automatos-host.json). Theme voice added the host's voice and AI label code
# (lib/voice, components/voice, lib/ai-label, components/ai-label): Play 1.2.0's message box holds core's voice
# button, and the Play specs check it and the host's AI label (and its copy in the host's own layer).
#
# workflow_dispatch works only once this file is on main: GitHub dispatches only
# workflows that exist on the default branch. Before that, the lane runs on a
# pull_request whose HEAD commit has no [skip ci].
#
# PRD-261 B-03h: a dispatch can name another kit commit (`kit_ref`, empty for KIT_REF below) and
# another kit theme (`kit_theme`, its folder in the kit, themes/play by default): the `package` job
# packs that theme from that commit, and the kit's own CLI installs it in the local edition for
# specs/installed-theme.spec.ts. A pull request or a push has no inputs, so it takes KIT_REF and
# Play. The inputs reach a shell only through a step's env:, never as an expression inside run:
# (orchestrator/tests/test_prd261_browser_lane_inputs.py holds this file to that).
#
# PRD-261 A-17a: the `package` job builds Play as the Design Kit packs it (the kit repository at
# the commit KIT_REF pins, below), and this job installs that package in the local edition
# (the @package specs). The kit is public since D2 (PA-10), so its checkout needs no secret.
# PRD-261 B-03h: the browser job also checks the kit out at the same ref and installs it (its
# lockfile, no install scripts) for the kit's CLI, which installs the package in the @installed
# spec as a theme author would. It does both after the main specs, so a kit problem there skips
# only the @installed spec.
#
# NON-REQUIRED at introduction; making it a required check is the repo admin's call.

on:
  workflow_dispatch:
    inputs:
      kit_ref:
        description: "Design Kit commit, branch or tag to pack the theme from (empty: the workflow's KIT_REF)"
        type: string
        required: false
        default: ""
      kit_theme:
        description: "Design Kit theme to pack and install, as its folder in the kit"
        type: string
        required: false
        default: themes/play
  push:
    branches:
      - main
    paths:
      - "frontend/app/layout.tsx"
      - "frontend/app/page.tsx"
      - "frontend/app/not-found.tsx"
      - "frontend/app/agents/**"
      - "frontend/app/assignments/**"
      - "frontend/app/chat/**"
      - "frontend/app/command-center/**"
      - "frontend/app/deliverables/**"
      - "frontend/app/documents/**"
      - "frontend/app/looks/**"
      - "frontend/app/missions/**"
      - "frontend/app/playbooks/**"
      - "frontend/app/safe-mode/**"
      - "frontend/app/x/**"
      - "frontend/app/api/themes/**"
      - "frontend/app/admin/themes/**"
      - "frontend/app/automatos-host.json/**"
      - "frontend/components/providers.tsx"
      - "frontend/components/workspace-provider.tsx"
      - "frontend/components/layout/**"
      - "frontend/components/theme-host/**"
      - "frontend/components/settings/themes/**"
      - "frontend/components/marketplace/themes/**"
      - "frontend/components/admin/themes/**"
      - "frontend/components/ui/theme-toggle.tsx"
      - "frontend/components/shared/**"
      - "frontend/lib/theme-host/**"
      - "frontend/lib/theme-sdk/**"
      - "frontend/lib/voice/**"
      - "frontend/components/voice/**"
      - "frontend/lib/ai-label/**"
      - "frontend/components/ai-label/**"
      - "frontend/lib/look-kit/**"
      - "frontend/lib/chat/**"
      - "frontend/lib/text/plain-line.ts"
      - "frontend/lib/ui-style.ts"
      - "frontend/lib/api-client.ts"
      - "frontend/lib/auth-edition.ts"
      - "frontend/packages/theme-sdk/**"
      - "frontend/contexts/ui-style-context.tsx"
      - "frontend/components/widgets/**"
      - "frontend/stores/fresh-draft-store.ts"
      - "frontend/hooks/use-*.ts"
      - "frontend/scripts/theme-sdk/**"
      - "frontend/next.config.js"
      - "frontend/middleware.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "orchestrator/api/themes_*.py"
      - "orchestrator/api/marketplace_themes*.py"
      - "orchestrator/api/admin_themes.py"
      - "orchestrator/services/themes/**"
      - "orchestrator/core/models/themes.py"
      - "orchestrator/core/auth/step_up.py"
      - "orchestrator/alembic/versions/prd261_*.py"
