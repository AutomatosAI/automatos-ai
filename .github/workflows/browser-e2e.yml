name: browser-e2e

# PRD-261 A-00 — the browser lane: Playwright on Chromium and WebKit against the
# local edition. Frontend tests elsewhere are vitest on jsdom; this lane proves
# what only a real browser shows (module loading, import maps, real rendering).
#
# How it runs:
# - The backend boots the way smoke-fresh-clone.yml does (postgres, redis, minio,
#   backend through docker compose, no external credentials), so the app has a
#   real local workspace.
# - The frontend is built and served on the runner from its standalone output,
#   never from its container image: an image could take a build flag only
#   through a Dockerfile ARG, and Railway passes service variables to declared
#   ARGs. The page origin is http://localhost:3000, the backend's CORS default.
# - Playwright lives in its own package (e2e/browser/package.json, exact pins, no
#   lockfile), so frontend/package-lock.json never changes for it.
#
# It watches only the paths below (the app shell, the theme host, the boot
# substrate and itself). A change to the rest of the backend or to other pages
# can break it without running it. See e2e/browser/README.md.
#
# workflow_dispatch works only once this file is on main: GitHub dispatches only
# workflows that exist on the default branch. Before that, the lane runs on a
# pull_request whose HEAD commit has no [skip ci].
#
# NON-REQUIRED at introduction; making it a required check is the repo admin's call.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/app/layout.tsx"
      - "frontend/app/agents/**"
      - "frontend/components/providers.tsx"
      - "frontend/components/workspace-provider.tsx"
      - "frontend/components/layout/**"
      - "frontend/components/theme-host/**"
      - "frontend/lib/theme-host/**"
      - "frontend/lib/looks/prepaint.ts"
      - "frontend/lib/ui-style.ts"
      - "frontend/lib/auth-edition.ts"
      - "frontend/contexts/ui-style-context.tsx"
      - "frontend/hooks/use-studio-theme.ts"
      - "frontend/hooks/use-mobile.ts"
      - "frontend/scripts/theme-sdk/**"
      - "frontend/next.config.js"
      - "frontend/middleware.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "docker-compose.yml"
      - "orchestrator/docker-entrypoint.sh"
      - "orchestrator/Dockerfile"
      - "envs/api.defaults"
      - "e2e/browser/**"
      - ".github/workflows/browser-e2e.yml"
  # No branches filter: a stacked pull request runs the lane too.
  pull_request:
    paths:
      - "frontend/app/layout.tsx"
      - "frontend/app/agents/**"
      - "frontend/components/providers.tsx"
      - "frontend/components/workspace-provider.tsx"
      - "frontend/components/layout/**"
      - "frontend/components/theme-host/**"
      - "frontend/lib/theme-host/**"
      - "frontend/lib/looks/prepaint.ts"
      - "frontend/lib/ui-style.ts"
      - "frontend/lib/auth-edition.ts"
      - "frontend/contexts/ui-style-context.tsx"
      - "frontend/hooks/use-studio-theme.ts"
      - "frontend/hooks/use-mobile.ts"
      - "frontend/scripts/theme-sdk/**"
      - "frontend/next.config.js"
      - "frontend/middleware.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "docker-compose.yml"
      - "orchestrator/docker-entrypoint.sh"
      - "orchestrator/Dockerfile"
      - "envs/api.defaults"
      - "e2e/browser/**"
      - ".github/workflows/browser-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Browser e2e — ${{ matrix.build }} build (non-required)
    # Pinned, not -latest: the browsers' system packages are installed for this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # The build every image ships: the theme-host spike flag off.
          - build: default
            spike_flag: "0"
            grep: "@smoke|@off"
            browsers: "chromium webkit"
            project_flags: "--project=chromium --project=webkit"
          # The theme-host spike on (PRD-261 A-01). Only this lane ever builds with '1'.
          # Firefox runs the @record specs only (playwright.config.ts gives it grep /@record/).
          - build: spike
            spike_flag: "1"
            grep: "@smoke|@spike|@record"
            browsers: "chromium webkit firefox"
            project_flags: "--project=chromium --project=webkit --project=firefox"

    # Job level, not step level: docker-compose.yml interpolates its `:?` variables
    # on every subcommand (up, logs and down alike). Throwaway values for an
    # ephemeral stack, the same ones smoke-fresh-clone.yml uses; no external
    # credential is set. DEFAULT_WORKSPACE_ID is the local edition's required workspace.
    env:
      POSTGRES_PASSWORD: smoke_pg_pw
      REDIS_PASSWORD: smoke_redis_pw
      API_KEY: smoke_api_key
      AUTH_EDITION: local
      REQUIRE_AUTH: "false"
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start the local backend (postgres, redis, minio, backend)
        run: docker compose up -d --build postgres redis minio backend

      - name: Wait for the backend to be ready
        run: bash e2e/browser/scripts/wait-for-url.sh http://localhost:8000/health/ready 300

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The same install as test.yml's frontend-ci (the lockfile is reconciled, not enforced).
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # The React the App Router renders with (Next's vendored copy) and the Next version,
      # for the specs that compare the live page against this install.
      - name: Record the React and Next versions of this install
        working-directory: frontend
        run: |
          echo "EXPECTED_REACT_VERSION=$(node -p "require('next/dist/compiled/react').version")" >> "$GITHUB_ENV"
          echo "NEXT_VERSION=$(node -p "require('next/package.json').version")" >> "$GITHUB_ENV"

      # The theme-sdk shims, generated from the React this install vendors, right before the
      # build that serves them (PRD-261 A-01). Never committed; the default build has none.
      - name: Generate theme-sdk shims
        if: matrix.build == 'spike'
        working-directory: frontend
        run: node scripts/theme-sdk/generate-shims.js

      - name: Build the frontend (local edition)
        working-directory: frontend
        env:
          NEXT_PUBLIC_AUTH_EDITION: local
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          NEXT_PUBLIC_MEDIA_ORIGINS: http://localhost:9000
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=6144
          AUTOMATOS_THEME_HOST_SPIKE: ${{ matrix.spike_flag }}
        run: npm run build

      # Staged the way frontend/Dockerfile's production stage lays it out.
      - name: Stage the standalone server
        working-directory: frontend
        run: cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static

      - name: Start the frontend (standalone server on :3000)
        working-directory: frontend
        run: |
          PORT=3000 HOSTNAME=0.0.0.0 NODE_ENV=production \
            nohup node .next/standalone/server.js > "$RUNNER_TEMP/frontend-server.log" 2>&1 &

      - name: Wait for the frontend
        run: bash e2e/browser/scripts/wait-for-url.sh http://localhost:3000/agents 120

      # Exact pins, no committed lockfile yet. The install writes one here so the default job can
      # upload what it resolved; the next wave commits that file and switches this step to npm ci.
      - name: Install Playwright (isolated package, exact pins)
        working-directory: e2e/browser
        run: npm install --no-audit --no-fund

      - name: Upload the resolved e2e lockfile
        if: matrix.build == 'default'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-lockfile
          path: e2e/browser/package-lock.json
          if-no-files-found: error

      - name: Install the browsers and their system packages
        working-directory: e2e/browser
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: Type-check the specs
        working-directory: e2e/browser
        run: npx tsc -p tsconfig.json

      # The hello theme against @types/react 19 and the spike SDK's types (PRD-261 A-01).
      - name: Type-check the hello theme
        working-directory: e2e/browser
        run: npx tsc -p fixtures/hello-theme/tsconfig.json

      # EXPECTED_REACT_VERSION and NEXT_VERSION come from $GITHUB_ENV (set above).
      - name: Run the browser specs
        working-directory: e2e/browser
        env:
          E2E_APP_URL: http://localhost:3000
          RECORD_DIR: records
        run: npx playwright test --grep "${{ matrix.grep }}" ${{ matrix.project_flags }}

      # The theme-host record (React version, import-map integrity support), pass or fail.
      - name: Summarise the theme-host record
        if: always() && matrix.build == 'spike'
        working-directory: e2e/browser
        run: node scripts/summarise-records.mjs records >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the theme-host record
        if: always() && matrix.build == 'spike'
        uses: actions/upload-artifact@v4
        with:
          name: theme-host-record
          path: e2e/browser/records
          if-no-files-found: ignore

      # The folder may not exist when the job failed before Playwright ran.
      - name: Collect server logs
        if: failure()
        run: |
          mkdir -p e2e/browser/test-results
          docker compose logs --tail 300 backend > e2e/browser/test-results/backend.log || true
          cp "$RUNNER_TEMP/frontend-server.log" e2e/browser/test-results/ || true

      - name: Upload the Playwright report, traces and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ matrix.build }}-report
          path: |
            e2e/browser/playwright-report
            e2e/browser/test-results
          retention-days: 7
          if-no-files-found: ignore

      # `|| true`: a cleanup hiccup never turns a passing job red.
      - name: Stop the local backend
        if: always()
        run: docker compose down -v || true
