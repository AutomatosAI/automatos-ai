      - "orchestrator/Dockerfile"
      - "envs/api.defaults"
      - "e2e/browser/**"
      - ".github/workflows/browser-e2e.yml"
  # No branches filter: a stacked pull request runs the lane too.
  pull_request:
    paths:
      - "frontend/app/layout.tsx"
      - "frontend/app/page.tsx"
      - "frontend/app/not-found.tsx"
      - "frontend/app/agents/**"
      - "frontend/app/assignments/**"
      - "frontend/app/chat/**"
      - "frontend/app/command-center/**"
      - "frontend/app/deliverables/**"
      - "frontend/app/documents/**"
      - "frontend/app/looks/**"
      - "frontend/app/missions/**"
      - "frontend/app/playbooks/**"
      - "frontend/app/safe-mode/**"
      - "frontend/app/x/**"
      - "frontend/app/api/themes/**"
      - "frontend/app/admin/themes/**"
      - "frontend/app/automatos-host.json/**"
      - "frontend/components/providers.tsx"
      - "frontend/components/workspace-provider.tsx"
      - "frontend/components/layout/**"
      - "frontend/components/theme-host/**"
      - "frontend/components/settings/themes/**"
      - "frontend/components/marketplace/themes/**"
      - "frontend/components/admin/themes/**"
      - "frontend/components/ui/theme-toggle.tsx"
      - "frontend/components/shared/**"
      - "frontend/lib/theme-host/**"
      - "frontend/lib/theme-sdk/**"
      - "frontend/lib/voice/**"
      - "frontend/components/voice/**"
      - "frontend/lib/ai-label/**"
      - "frontend/components/ai-label/**"
      - "frontend/lib/look-kit/**"
      - "frontend/lib/chat/**"
      - "frontend/lib/text/plain-line.ts"
      - "frontend/lib/ui-style.ts"
      - "frontend/lib/api-client.ts"
      - "frontend/lib/auth-edition.ts"
      - "frontend/packages/theme-sdk/**"
      - "frontend/contexts/ui-style-context.tsx"
      - "frontend/components/widgets/**"
      - "frontend/stores/fresh-draft-store.ts"
      - "frontend/hooks/use-*.ts"
      - "frontend/scripts/theme-sdk/**"
      - "frontend/next.config.js"
      - "frontend/middleware.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "orchestrator/api/themes_*.py"
      - "orchestrator/api/marketplace_themes*.py"
      - "orchestrator/api/admin_themes.py"
      - "orchestrator/services/themes/**"
      - "orchestrator/core/models/themes.py"
      - "orchestrator/core/auth/step_up.py"
      - "orchestrator/alembic/versions/prd261_*.py"
      - "orchestrator/tests/fixtures/themes/**"
      - "docker-compose.yml"
      - "orchestrator/docker-entrypoint.sh"
      - "orchestrator/Dockerfile"
