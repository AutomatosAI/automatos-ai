      - "frontend/packages/theme-sdk/**"
      - "frontend/contexts/ui-style-context.tsx"
      - "frontend/hooks/use-studio-theme.ts"
      - "frontend/hooks/use-mobile.ts"
      - "frontend/hooks/use-global-search.ts"
      - "frontend/hooks/use-installed-themes.ts"
      - "frontend/scripts/theme-sdk/**"
      - "frontend/next.config.js"
      - "frontend/middleware.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "orchestrator/api/themes_*.py"
      - "orchestrator/api/marketplace_themes*.py"
      - "orchestrator/api/admin_themes.py"
      - "orchestrator/services/themes/**"
      - "orchestrator/core/models/themes.py"
      - "orchestrator/core/auth/step_up.py"
      - "orchestrator/alembic/versions/prd261_*.py"
      - "orchestrator/tests/fixtures/themes/**"
      - "docker-compose.yml"
      - "orchestrator/docker-entrypoint.sh"
      - "orchestrator/Dockerfile"
      - "envs/api.defaults"
      - "e2e/browser/**"
      - ".github/workflows/browser-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# PRD-261 A-17a: the Design Kit commit the lane packs Play from. W-K2's merge on the kit's main
# (Play packed as automatos/play 1.0.0; kit CI run 39375088068 built it). Move it with the kit,
# in the same pull request as the Play change it brings (the mirror rule,
# docs/frontend-architecture/play-theme.md). npm is pinned to the kit's own version (its kit.yml).
env:
  KIT_REPOSITORY: AutomatosAI/automatos-play
  KIT_REF: 2aacd0a4721062d61c625a8b1178cfe5aadf6ab4
  KIT_NPM_VERSION: 11.21.1
  KIT_PLAY_WORKSPACE: themes/play
  PLAY_PACKAGE: automatos.play-1.0.0.autotheme
  PLAY_PACKAGE_ARTIFACT: play-package

jobs:
  # PRD-261 A-17a: Play's .autotheme, built and packed with the kit's own scripts from its
  # committed lockfile. No install script runs (--ignore-scripts); Play's build fetches Auto's
  # clips from core at the commit its mascot.lock.json pins, checking each one's sha256.
  package:
    name: Pack Play from the Design Kit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the Design Kit at its pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.KIT_REPOSITORY }}
          ref: ${{ env.KIT_REF }}
          path: kit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kit/package-lock.json

      - name: Pin npm to the kit's version
        run: npm install -g "npm@${KIT_NPM_VERSION}"

      - name: Install the kit (its lockfile, no install scripts)
        working-directory: kit
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Play
        working-directory: kit
        run: npm run build --workspace="$KIT_PLAY_WORKSPACE"

      - name: Pack Play
        working-directory: kit
        run: npm run pack --workspace="$KIT_PLAY_WORKSPACE"

      # Fails when the pack wrote no package under the expected name.
      - name: Record the package's size and sha256
        working-directory: kit/${{ env.KIT_PLAY_WORKSPACE }}/out
        run: |
          {
            echo "### Play from the Design Kit (${KIT_REPOSITORY}@${KIT_REF})"
            echo
            echo '```'
            ls -l "$PLAY_PACKAGE"
            sha256sum "$PLAY_PACKAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Play package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PLAY_PACKAGE_ARTIFACT }}
          path: kit/${{ env.KIT_PLAY_WORKSPACE }}/out/${{ env.PLAY_PACKAGE }}
          if-no-files-found: error
          retention-days: 7

  browser-e2e:
    name: Browser e2e (non-required)
    needs: package
    # The lane runs when the package job failed too: every other spec still reports, and the
    # @package specs fail on the missing package (specs/installed-play.spec.ts).
    if: ${{ !cancelled() }}
    # Pinned, not -latest: the browsers' system packages are installed for this image.
    runs-on: ubuntu-24.04
    # PRD-261 A-17b: 60, up from 45, for the Play parity specs (twice each, one test at a time).
    timeout-minutes: 60

    # Job level, not step level: docker-compose.yml interpolates its `:?` variables
    # on every subcommand (up, logs and down alike). Throwaway values for an
    # ephemeral stack, the same ones smoke-fresh-clone.yml uses; no external
    # credential is set. DEFAULT_WORKSPACE_ID is the local edition's required workspace.
    env:
      POSTGRES_PASSWORD: smoke_pg_pw
      REDIS_PASSWORD: smoke_redis_pw
      API_KEY: smoke_api_key
      AUTH_EDITION: local
      REQUIRE_AUTH: "false"
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the local backend (postgres, redis, minio, backend)
        run: docker compose up -d --build postgres redis minio backend

      - name: Wait for the backend to be ready
        run: bash e2e/browser/scripts/wait-for-url.sh http://localhost:8000/health/ready 300

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/browser/package-lock.json

      # The same install as test.yml's frontend-ci (the lockfile is reconciled, not enforced).
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # The React the App Router renders with (Next's vendored copy) and the Next version,
      # for the specs that compare the live page against this install.
      - name: Record the React and Next versions of this install
        working-directory: frontend
        run: |
          echo "EXPECTED_REACT_VERSION=$(node -p "require('next/dist/compiled/react').version")" >> "$GITHUB_ENV"
          echo "NEXT_VERSION=$(node -p "require('next/package.json').version")" >> "$GITHUB_ENV"

      # `npm run build` runs `prebuild` first, which generates the theme-sdk shims from the React
      # this install vendors (PRD-261 PA-3), as every image build does.
      - name: Build the frontend (local edition)
        working-directory: frontend
        env:
          NEXT_PUBLIC_AUTH_EDITION: local
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          NEXT_PUBLIC_MEDIA_ORIGINS: http://localhost:9000
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      # Staged the way frontend/Dockerfile's production stage lays it out.
      - name: Stage the standalone server
        working-directory: frontend
        run: cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static

      - name: Start the frontend (standalone server on :3000)
        working-directory: frontend
        run: |
          PORT=3000 HOSTNAME=0.0.0.0 NODE_ENV=production \
            nohup node .next/standalone/server.js > "$RUNNER_TEMP/frontend-server.log" 2>&1 &

      - name: Wait for the frontend
        run: bash e2e/browser/scripts/wait-for-url.sh http://localhost:3000/agents 120

      # Exact pins and the committed lockfile (PRD-261 A-04a: the one #1143's run resolved,
      # every package from registry.npmjs.org with its integrity hash).
      - name: Install Playwright (isolated package, npm ci)
        working-directory: e2e/browser
        run: npm ci --no-audit --no-fund

      # Firefox runs the @record specs only (playwright.config.ts gives it grep /@record/).
      - name: Install the browsers and their system packages
        working-directory: e2e/browser
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Type-check the specs
        working-directory: e2e/browser
        run: npx tsc -p tsconfig.json

      # The hello theme against @types/react 19 and the test SDK's types (PRD-261 A-01).
      - name: Type-check the hello theme
        working-directory: e2e/browser
        run: npx tsc -p fixtures/hello-theme/tsconfig.json

      # PRD-261 A-07d (PA-6): the .autotheme packages the install specs upload, built with the
      # backend's own fixture builder (bare python3, no orchestrator dependencies). The specs read
      # the folder from E2E_THEME_PACKAGES: hello (A-07d), hello-clip (A-08b), hello-throws (A-04c).
      - name: Build the test theme packages
        run: |
          mkdir -p "$RUNNER_TEMP/theme-packages"
          for variant in hello hello-clip hello-throws; do
            python3 orchestrator/tests/fixtures/themes/build.py --variant "$variant" \
              --out "$RUNNER_TEMP/theme-packages/$variant.autotheme"
          done
          echo "E2E_THEME_PACKAGES=$RUNNER_TEMP/theme-packages" >> "$GITHUB_ENV"

      # PRD-261 A-17a: the package job's Play package. When that job failed there is nothing to
      # download, and the @package specs fail on the missing file.
      - name: Download the Play package from the Design Kit
        if: needs.package.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PLAY_PACKAGE_ARTIFACT }}
          path: ${{ runner.temp }}/kit-package

      # EXPECTED_REACT_VERSION and NEXT_VERSION come from $GITHUB_ENV (set above).
      - name: Run the browser specs
        id: specs
        working-directory: e2e/browser
        env:
          E2E_APP_URL: http://localhost:3000
          RECORD_DIR: records
        run: npx playwright test --grep "@smoke|@off|@host|@record" --project=chromium --project=webkit --project=firefox

      # PRD-261 A-17a: the installed Play package, after the other specs and one test at a time.
      # Its specs store the member's theme choice on the lane's one backend, which every other
      # spec's tab reads, so they never run beside them. Their own output folders keep the run
      # above's report and traces. They run when the specs above failed too.
      # PRD-261 A-17b: the Play parity specs (@parity, specs/play-parity/) run here too: each runs
      # under builtin Play and under the installed package, and stores the choice the same way.
      - name: Run the installed Play package and Play parity specs
        if: ${{ !cancelled() && steps.specs.outcome != 'skipped' }}
        working-directory: e2e/browser
        env:
          E2E_APP_URL: http://localhost:3000
          E2E_KIT_PACKAGE: ${{ runner.temp }}/kit-package/${{ env.PLAY_PACKAGE }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-package
        run: npx playwright test --grep "@package|@parity" --project=chromium --project=webkit --workers=1 --output=test-results-package

      # The theme-host record (React version, import-map integrity support), pass or fail.
      - name: Summarise the theme-host record
        if: always()
        working-directory: e2e/browser
        run: node scripts/summarise-records.mjs records >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the theme-host record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-host-record
          path: e2e/browser/records
          if-no-files-found: ignore

      # The folder may not exist when the job failed before Playwright ran.
      - name: Collect server logs
        if: failure()
        run: |
          mkdir -p e2e/browser/test-results
          docker compose logs --tail 300 backend > e2e/browser/test-results/backend.log || true
          cp "$RUNNER_TEMP/frontend-server.log" e2e/browser/test-results/ || true

      - name: Upload the Playwright report, traces and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-e2e-report
          path: |
            e2e/browser/playwright-report
            e2e/browser/test-results
            e2e/browser/playwright-report-package
            e2e/browser/test-results-package
          retention-days: 7
          if-no-files-found: ignore

      # `|| true`: a cleanup hiccup never turns a passing job red.
      - name: Stop the local backend
        if: always()
        run: docker compose down -v || true
