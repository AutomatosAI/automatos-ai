      - "e2e/browser/**"
      - ".github/workflows/browser-e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# PRD-261 A-17a: the Design Kit commit the lane packs Play from. PRD-261 A-20b (PB-17): W-K7's
# merge on the kit's main (AutomatosAI/automatos-design-kit#18: the kit vendored at core after A-19 and
# A-20), which holds W-K8's merge (#15: the kit CLI's `automatos-theme install`, which the lane
# installs the theme with) and W-K6's (#14: Play's tests on the kit's harness, every path core's
# test ledger names for them). Theme voice: since then, kit #36's merge (SDK 1.2.0's voice area,
# Play 1.2.0 with the host's voice button in its message box and its own phone layout from 360 px,
# HUD 1.1.0), which holds #18 and every kit commit between them; then kit #37's merge (Automatos's theme-signing
# key in keys/theme-signing.json, the same bytes as orchestrator/services/themes/data/signing-keys.json); then
# kit #40's merge (HUD 1.1.1 and Play 1.2.1 polish: Play's hello on an empty chat only, a made-up product in its look
# preview, HUD's transcript fade); then kit #58's merge (Theme SDK 1.3.0's proactive area vendored by #52; Play 1.3.0
# by #57 with the brief, the pinned suggestion line and approvals; HUD 1.2.0; the first-paint checks of #56).
# Play's own files there are automatos/play 1.3.0 (released at the kit's tag play-v1.3.0 by theme-publish.yml;
# 1.1.0 is play-v1.1.0). Move it with the kit, in the same pull request as the kit change it brings, and only
# forward in kit history (PB-17; Play's own rules are in the kit's themes/play/README.md). npm is
# pinned to the kit's own version (its kit.yml).
env:
  KIT_REPOSITORY: AutomatosAI/automatos-design-kit
  KIT_REF: 3d6268e26a137d2fe42a85103262794968c6b791
  KIT_NPM_VERSION: 11.21.1
  KIT_PLAY_WORKSPACE: themes/play
  PLAY_PACKAGE: automatos.play-1.3.0.autotheme
  KIT_PACKAGE_ARTIFACT: kit-theme-package
  # The package job's name (jobs.package.name, below), which the lane waits on, and how long it
  # waits: the package job's own 15-minute timeout and a few minutes to be picked up.
  KIT_PACKAGE_JOB: Pack the theme from the Design Kit
  KIT_PACKAGE_WAIT_SECONDS: "1200"

jobs:
  # PRD-261 A-17a: Play's .autotheme, built and packed with the kit's own scripts from its
  # committed lockfile. No install script runs (--ignore-scripts), and the build fetches nothing:
  # since 1.1.0 Auto's clips are committed in the kit with the rest of Play (PB-4).
  # It runs beside browser-e2e, not before it: the lane waits for it only just before it downloads
  # the package, so the kit's build overlaps the lane's docker and frontend builds.
  # PRD-261 B-03h: a dispatch's kit_theme from its kit_ref instead, packed the same way.
  package:
    name: Pack the theme from the Design Kit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the Design Kit at its pinned commit (or the dispatch's kit_ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.KIT_REPOSITORY }}
          ref: ${{ inputs.kit_ref || env.KIT_REF }}
          path: kit
          persist-credentials: false

      # PRD-261 A-19f4: the core files the kit must agree with, read from this commit.
      - name: Check out core's test ledger and signing files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: core
          persist-credentials: false
          sparse-checkout: |
            frontend/lib/__tests__/fixtures/a19-test-ledger.json
            orchestrator/tests/fixtures/themes/signing-vector.json
            orchestrator/services/themes/data/signing-keys.json
          sparse-checkout-cone-mode: false

      # PRD-261 A-19f4: every kitPath core's test ledger names (the tests W-A8 moved out of core)
      # exists in the kit at KIT_REF, and the kit signs with the vector and keys core verifies
      # against: its tests/fixtures/signing-vector.json and keys/theme-signing.json are core's
      # files byte for byte.
      - name: Check the kit holds core's moved tests and signing files
        shell: python3 {0}
        run: |
          import json, pathlib, sys
          core, kit = pathlib.Path("core"), pathlib.Path("kit")
          rows = json.loads((core / "frontend/lib/__tests__/fixtures/a19-test-ledger.json").read_text())
          kit_paths = [row["kitPath"] for row in rows if row["kitPath"]]
          problems = [f"ledger kitPath missing in the kit: {path}" for path in kit_paths if not (kit / path).is_file()]
          pairs = {
              "orchestrator/tests/fixtures/themes/signing-vector.json": "tests/fixtures/signing-vector.json",
              "orchestrator/services/themes/data/signing-keys.json": "keys/theme-signing.json",
          }
          for core_path, kit_path in pairs.items():
              if (core / core_path).read_bytes() != (kit / kit_path).read_bytes():
                  problems.append(f"{kit_path} in the kit differs from core's {core_path}")
          print(f"{len(kit_paths)} ledger kitPaths, {len(pairs)} signing files checked")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kit/package-lock.json

      - name: Pin npm to the kit's version
        run: npm install -g "npm@${KIT_NPM_VERSION}"

      - name: Install the kit (its lockfile, no install scripts)
        working-directory: kit
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the theme
        working-directory: kit
        env:
          KIT_THEME: ${{ inputs.kit_theme || env.KIT_PLAY_WORKSPACE }}
        run: npm run build --workspace="$KIT_THEME"

      - name: Pack the theme
        working-directory: kit
        env:
          KIT_THEME: ${{ inputs.kit_theme || env.KIT_PLAY_WORKSPACE }}
        run: npm run pack --workspace="$KIT_THEME"

      # Fails unless the pack wrote exactly one package (for Play, under the name PLAY_PACKAGE).
      - name: Record the package's size and sha256
        working-directory: kit
        env:
          KIT_THEME: ${{ inputs.kit_theme || env.KIT_PLAY_WORKSPACE }}
        run: |
          shopt -s nullglob
          packages=("$KIT_THEME"/out/*.autotheme)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::the pack wrote ${#packages[@]} packages in ${KIT_THEME}/out, not one"
            exit 1
          fi
          if [ "$KIT_THEME" = "$KIT_PLAY_WORKSPACE" ] && [ "${packages[0]}" != "${KIT_THEME}/out/${PLAY_PACKAGE}" ]; then
            echo "::error::Play packed ${packages[0]}, not ${PLAY_PACKAGE}"
            exit 1
          fi
          {
            echo "### ${KIT_THEME} from the Design Kit (${KIT_REPOSITORY}@$(git rev-parse HEAD))"
            echo
            echo '```'
            ls -l "${packages[0]}"
            sha256sum "${packages[0]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.KIT_PACKAGE_ARTIFACT }}
          path: kit/${{ inputs.kit_theme || env.KIT_PLAY_WORKSPACE }}/out/*.autotheme
          if-no-files-found: error
          retention-days: 7

  browser-e2e:
    name: Browser e2e (non-required)
    # No `needs: package`: the lane starts at once and waits for the package job only before it
    # downloads the package (scripts/wait-for-job.sh), so a slow kit build delays only that step.
    # When the package job failed or the wait timed out, every other spec still reports, and the
    # @installed and @package specs fail on the missing package (specs/installed-play.spec.ts).
    # When the kit's checkout or install for its CLI fails, the job fails on that step, the
    # @installed spec is skipped and the @package specs still run.
    # actions: read is for that wait (the run's jobs); the job needs nothing else.
    permissions:
      actions: read
      contents: read
    # Pinned, not -latest: the browsers' system packages are installed for this image.
    runs-on: ubuntu-24.04
    # PRD-261 A-17b: 60, up from 45, for the Play parity specs, one test at a time. A-19f4 (W-A8):
    # they run once each now, against the installed package only, with the Play specs moved into
    # the package step beside them (looks-server, the layer model, Play's pages and route).
    timeout-minutes: 60

    # Job level, not step level: docker-compose.yml interpolates its `:?` variables
    # on every subcommand (up, logs and down alike). Throwaway values for an
    # ephemeral stack, the same ones smoke-fresh-clone.yml uses; no external
    # credential is set. DEFAULT_WORKSPACE_ID is the local edition's required workspace.
    env:
      POSTGRES_PASSWORD: smoke_pg_pw
      REDIS_PASSWORD: smoke_redis_pw
      API_KEY: smoke_api_key
      AUTH_EDITION: local
      REQUIRE_AUTH: "false"
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the local backend (postgres, redis, minio, backend)
        run: docker compose up -d --build postgres redis minio backend

      - name: Wait for the backend to be ready
        run: bash e2e/browser/scripts/wait-for-url.sh http://localhost:8000/health/ready 300

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/browser/package-lock.json

      # The same install as test.yml's frontend-ci (the lockfile is reconciled, not enforced).
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # The React the App Router renders with (Next's vendored copy) and the Next version,
      # for the specs that compare the live page against this install.
      - name: Record the React and Next versions of this install
        working-directory: frontend
        run: |
          echo "EXPECTED_REACT_VERSION=$(node -p "require('next/dist/compiled/react').version")" >> "$GITHUB_ENV"
          echo "NEXT_VERSION=$(node -p "require('next/package.json').version")" >> "$GITHUB_ENV"

      # `npm run build` runs `prebuild` first, which generates the theme-sdk shims from the React
      # this install vendors (PRD-261 PA-3), as every image build does.
      - name: Build the frontend (local edition)
        working-directory: frontend
        env:
          NEXT_PUBLIC_AUTH_EDITION: local
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
          NEXT_PUBLIC_MEDIA_ORIGINS: http://localhost:9000
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      # Staged the way frontend/Dockerfile's production stage lays it out.
      - name: Stage the standalone server
        working-directory: frontend
        run: cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static

      - name: Start the frontend (standalone server on :3000)
        working-directory: frontend
        run: |
          PORT=3000 HOSTNAME=0.0.0.0 NODE_ENV=production \
            nohup node .next/standalone/server.js > "$RUNNER_TEMP/frontend-server.log" 2>&1 &

      - name: Wait for the frontend
        run: bash e2e/browser/scripts/wait-for-url.sh http://localhost:3000/agents 120

      # Exact pins and the committed lockfile (PRD-261 A-04a: the one #1143's run resolved,
      # every package from registry.npmjs.org with its integrity hash).
      - name: Install Playwright (isolated package, npm ci)
        working-directory: e2e/browser
        run: npm ci --no-audit --no-fund

      # Firefox runs the @record specs only (playwright.config.ts gives it grep /@record/).
      - name: Install the browsers and their system packages
        working-directory: e2e/browser
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Type-check the specs
        working-directory: e2e/browser
        run: npx tsc -p tsconfig.json

      # The hello theme against @types/react 19 and the test SDK's types (PRD-261 A-01).
      - name: Type-check the hello theme
        working-directory: e2e/browser
        run: npx tsc -p fixtures/hello-theme/tsconfig.json

      # PRD-261 A-07d (PA-6): the .autotheme packages the install specs upload, built with the
      # backend's own fixture builder (bare python3, no orchestrator dependencies). The specs read
      # the folder from E2E_THEME_PACKAGES: hello (A-07d), hello-clip (A-08b), hello-throws (A-04c).
      - name: Build the test theme packages
        run: |
          mkdir -p "$RUNNER_TEMP/theme-packages"
          for variant in hello hello-clip hello-throws; do
            python3 orchestrator/tests/fixtures/themes/build.py --variant "$variant" \
              --out "$RUNNER_TEMP/theme-packages/$variant.autotheme"
          done
          echo "E2E_THEME_PACKAGES=$RUNNER_TEMP/theme-packages" >> "$GITHUB_ENV"

      # PRD-261 A-17a: the package job's package (Play's, unless a dispatch named another kit
      # theme), once that job has finished. When it failed, or did not finish in time, there is
      # nothing to download, and the @installed and @package specs fail on the missing file. The
      # wait itself never fails the lane.
      - name: Wait for the package job
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(bash e2e/browser/scripts/wait-for-job.sh "$KIT_PACKAGE_JOB" "$KIT_PACKAGE_WAIT_SECONDS")" || conclusion=unfinished
          echo "The package job: ${conclusion}"
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"

      - name: Download the package from the Design Kit
        if: steps.package.outputs.conclusion == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.KIT_PACKAGE_ARTIFACT }}
          path: ${{ runner.temp }}/kit-package

      # EXPECTED_REACT_VERSION and NEXT_VERSION come from $GITHUB_ENV (set above).
      - name: Run the browser specs
        id: specs
        working-directory: e2e/browser
        env:
          E2E_APP_URL: http://localhost:3000
          RECORD_DIR: records
        run: npx playwright test --grep "@smoke|@off|@host|@record" --project=chromium --project=webkit --project=firefox

      # PRD-261 B-03h: the kit, for its CLI, at the ref the package job packs from, installed as the
      # package job installs it (npm at the kit's version, its lockfile, no install scripts); nothing
      # is built here. After the specs above, so a kit checkout or install that fails (a registry
      # hiccup, a dispatch's kit_ref) fails the job on its own step and skips only the @installed
      # spec; the @package specs still run. The install moves npm to the kit's version for the steps
      # after it.
      - name: Check out the Design Kit for its CLI
        id: kit_checkout
        if: ${{ !cancelled() && steps.specs.outcome != 'skipped' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.KIT_REPOSITORY }}
          ref: ${{ inputs.kit_ref || env.KIT_REF }}
          path: kit
          persist-credentials: false

      - name: Install the Design Kit for its CLI (its lockfile, no install scripts)
        id: kit_cli
        if: ${{ !cancelled() && steps.kit_checkout.outcome == 'success' }}
        working-directory: kit
        run: |
          npm install -g "npm@${KIT_NPM_VERSION}"
          npm ci --ignore-scripts --no-audit --no-fund

      # PRD-261 B-03h: the run's package installed by the kit's own CLI, `automatos-theme install
      # <file> --to http://localhost:3000 --choose` (the web app's URL, resolved through its
      # /automatos-host.json), then every page and route its theme.json declares
      # (specs/installed-theme.spec.ts). It stores the member's choice on the lane's one backend, so
      # it runs one test at a time, after the specs above, with its own output folders.
      - name: Run the installed kit theme spec (installed by the kit's CLI)
        if: ${{ !cancelled() && steps.kit_cli.outcome == 'success' }}
        working-directory: e2e/browser
        env:
          E2E_APP_URL: http://localhost:3000
          E2E_KIT_CLI: ${{ github.workspace }}/kit/packages/theme-cli/src/cli.ts
          E2E_KIT_PACKAGE_DIR: ${{ runner.temp }}/kit-package
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-installed
        run: npx playwright test --grep "@installed" --project=chromium --project=webkit --workers=1 --output=test-results-installed

      # PRD-261 A-17a: the installed Play package, after the other specs and one test at a time.
      # Its specs store the member's theme choice on the lane's one backend, which every other
      # spec's tab reads, so they never run beside them. Their own output folders keep the run
      # above's report and traces. They run when the specs above failed too.
      # PRD-261 A-17b: the Play parity specs (@parity, specs/play-parity/) run here too, and store
      # the choice the same way. A-19f4 (W-A8): against the installed package only, once each.
      # PRD-261 B-03h: a dispatch that names another kit theme packs no Play, so this step and the
      # preview shots' upload run only when the run's theme is Play.
      - name: Run the installed Play package and Play parity specs
        if: ${{ !cancelled() && steps.specs.outcome != 'skipped' && (inputs.kit_theme || env.KIT_PLAY_WORKSPACE) == env.KIT_PLAY_WORKSPACE }}
        working-directory: e2e/browser
        env:
          E2E_APP_URL: http://localhost:3000
          E2E_KIT_PACKAGE: ${{ runner.temp }}/kit-package/${{ env.PLAY_PACKAGE }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-package
        run: npx playwright test --grep "@package|@parity" --project=chromium --project=webkit --workers=1 --output=test-results-package

      # PRD-261 C-06q1 (PB-24, PB-26): installed Play's preview shots, which
      # specs/play-previews.spec.ts saves in the step above (each preset's /chat frame, and the
      # default preset's /deliverables and /looks), for the owner to pick from. They are never
      # committed here: the kit commits the picked files into themes/play/assets/previews/ (C-06q2).
      # Uploaded when the specs failed too, so the shots that were saved can still be seen; a run
      # that saved none fails here.
      - name: Upload Play's preview shots
        if: ${{ !cancelled() && (inputs.kit_theme || env.KIT_PLAY_WORKSPACE) == env.KIT_PLAY_WORKSPACE }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-previews
          path: e2e/browser/previews
          if-no-files-found: error

      # The theme-host record (React version, import-map integrity support), pass or fail.
      - name: Summarise the theme-host record
        if: always()
        working-directory: e2e/browser
        run: node scripts/summarise-records.mjs records >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the theme-host record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-host-record
          path: e2e/browser/records
          if-no-files-found: ignore

      # The folder may not exist when the job failed before Playwright ran.
      - name: Collect server logs
        if: failure()
        run: |
          mkdir -p e2e/browser/test-results
          docker compose logs --tail 300 backend > e2e/browser/test-results/backend.log || true
          cp "$RUNNER_TEMP/frontend-server.log" e2e/browser/test-results/ || true

      - name: Upload the Playwright report, traces and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-e2e-report
          path: |
            e2e/browser/playwright-report
            e2e/browser/test-results
            e2e/browser/playwright-report-installed
            e2e/browser/test-results-installed
            e2e/browser/playwright-report-package
            e2e/browser/test-results-package
          retention-days: 7
          if-no-files-found: ignore

      # `|| true`: a cleanup hiccup never turns a passing job red.
      - name: Stop the local backend
        if: always()
        run: docker compose down -v || true
