name: Checkout line endings

# Issue #818: Git for Windows defaults to core.autocrlf=true, and a CRLF
# checkout crash-loops the backend and the workspace-worker. This lane sets that
# default before actions/checkout (which copies the global git config into its
# own HOME, so the setting applies), then fails if any file the containers run
# has CRLF in the working tree. Linux reproduces the conversion cheaply; the
# Windows leg checks the same thing with Git for Windows itself.
#
# It runs only when a pinned file kind, .gitattributes or this lane changes.

on:
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - "**.sh"
      - "**.py"
      - "**/Dockerfile*"
      - "**/Makefile"
      - "**.yml"
      - "**.yaml"
      - ".env.example"
      - "envs/**"
  pull_request:
    branches: [main]
    paths:
      - ".gitattributes"
      - "**.sh"
      - "**.py"
      - "**/Dockerfile*"
      - "**/Makefile"
      - "**.yml"
      - "**.yaml"
      - ".env.example"
      - "envs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-style-checkout:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Enable Windows Git defaults before checkout
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing test dependencies
        run: python -m pip install pytest==7.4.3 pytest-asyncio==0.21.1
      - name: Check runtime file line endings
        working-directory: orchestrator
        run: >-
          python -m pytest -q
          tests/test_repo_line_endings.py
          tests/test_checkout_line_endings.py
          tests/test_818_runtime_files_stay_lf_on_a_windows_checkout.py
