name: smoke-images

# PRD-262 US-003: a lane that boots what we publish, the way a self-hoster runs it,
# so the first-run promise is a measured number.
#
# - smoke-images: after images.yml publishes on main (workflow_run), and by hand with
#   a tag, on amd64 and arm64, starting from an empty Docker cache. It runs today's
#   published path: `docker compose -f docker-compose.yml -f docker-compose.images.yml`
#   with AUTOMATOS_IMAGE_TAG=sha-<7>, pulled (timed, bytes counted) and then started
#   with `up -d --no-build`. It records the pull, the fresh boot and two warm restarts
#   (container start to /health 200), the first run from the pull's start to :3000 200,
#   and asserts that nothing was built: each app container runs a
#   ghcr.io/automatosai/automatos-* image whose RepoDigests holds the index digest its
#   tag resolves to on GHCR, no tag is local-*, and no compose-built image exists. The
#   images must carry their commit's org.opencontainers.image.revision, and the backend,
#   booted from the production stage for the first time in CI, must run without
#   --reload and with the production command's worker count. PRD-262 US-036 and US-037
#   switch this job to `make up` on a clean checkout, and PRD-262 US-056 (W9) adds a
#   rollback step: the previous main run's API image, with AUTOMATOS_SKIP_MIGRATIONS=true,
#   against the schema the new image migrated, must answer /health/ready 200.
# - promote-edge: once smoke-images passes on both arches for a main publish, it points
#   `edge` at that `sha-<7>` (`docker buildx imagetools create`, which keeps the signed
#   digest). images.yml no longer moves `edge`, so an image that cannot boot never
#   reaches it. A manual run never promotes; re-run a failed main run instead.
# - The weekly OS rebuild (PRD-262 US-011): images.yml's Monday schedule run publishes
#   `weekly-<yyyymmdd>` instead of `sha-<7>`. smoke-images boots that tag, worked out
#   from the run's created_at as images.yml does, and promote-edge moves `edge` to it
#   only after it boots, so OS fixes reach `edge` the same way code does.
# - smoke-images-pr: on pull requests that touch compose, the Makefile, envs/ or an
#   image input (images.yml's pull_request paths, plus the backend's entrypoint and
#   healthcheck and this lane's own files), it builds the three amd64 images in the job
#   with images.yml's GHA cache (read only), build args and labels, tags them with the
#   GHCR names and `pr-<7>`, and boots them the same way. It measures the boot; the pull
#   numbers (bytes, seconds, nothing built) come from the main runs alone. Before the
#   boot, it checks that the api image installs no package the code never imports
#   (PRD-262 US-015).
# - Both jobs, before the warm restarts: a document uploaded to the backend goes into
#   MinIO through the image's pruned botocore, and the host fetches it back by its
#   presigned URL (scripts/ci/smoke_document_presign.py, PRD-262 US-021).
#
# Report only until PRD-262 US-004 sets the bars: no time or size fails a job. A boot
# that never answers 200, an image built instead of pulled, a missing or wrong revision
# label, or a backend with --reload or the wrong worker count fails it from day one.
#
# workflow_run and workflow_dispatch work only once this file is on main. Actions are
# pinned to a commit; the comment names the release. NON-REQUIRED at introduction.

on:
  workflow_run:
    workflows:
      - images
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Published tag to pull and boot, e.g. sha-1bc4c07 or edge (a manual run never moves edge)"
        required: true
        type: string
  pull_request:
    branches:
      - main
    # images.yml's pull_request paths (orchestrator/tests/test_prd262_smoke_images.py
    # holds them in), plus compose, the Makefile, envs/, the backend's entrypoint and
    # healthcheck, and this lane's script, tools and workflow.
    paths:
      - ".github/workflows/smoke-images.yml"
      - ".github/workflows/images.yml"
      - ".github/image-budgets.json"
      - ".grype.yaml"
      - "scripts/ci/image_*.py"
      - "scripts/ci/smoke-fresh-clone.sh"
      - "scripts/ci/smoke-loopback-ports.sh"
      - "scripts/ci/smoke_boot.py"
      - "scripts/ci/smoke_report.py"
      - "scripts/ci/smoke_images.py"
      - "scripts/ci/smoke_images_report.py"
      - "scripts/ci/smoke_worker_restart.py"
      - "scripts/ci/smoke_document_presign.py"
      - "docker-compose*.yml"
      - "Makefile"
      - "envs/**"
      - "orchestrator/Dockerfile"
      - "orchestrator/.dockerignore"
      - "orchestrator/requirements.txt"
      - "orchestrator/requirements-dev.txt"
      - "orchestrator/docker-entrypoint.sh"
      - "orchestrator/docker-healthcheck.sh"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/next.config.js"
      - "frontend/csp-sources.js"
      - "frontend/.npmrc"
      - "frontend/public/**"
      - "services/workspace-worker/**"
      - "services/agent-opt-worker/**"

# A newer push to a pull request cancels its older run. Main and manual runs are
# measurements, so they finish; a re-run of one commit waits for the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke-images:
    name: smoke-images (${{ matrix.arch }}) — pull and boot the published images (non-required)
    # Only a successful images.yml run that published from this repository's main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.target.outputs.tag }}

    steps:
      # The commit the images were built from, so compose and the images agree.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # A schedule-triggered images run published `weekly-<yyyymmdd>` of its created_at.
      - name: The tag to boot
        id: target
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ inputs.tag }}
          TRIGGER: ${{ github.event.workflow_run.event }}
          CREATED: ${{ github.event.workflow_run.created_at }}
        run: |
          python3 scripts/ci/smoke_images.py target --event "$EVENT" --sha "$SHA" --tag "$TAG" \
            --trigger "$TRIGGER" --created "$CREATED" --outputs "$GITHUB_OUTPUT"

      # The same throwaway local-only secrets as smoke-fresh-clone.yml; no external
      # SaaS credential is set.
      - name: Pull and boot the published images
        env:
          POSTGRES_PASSWORD: smoke_pg_pw
          REDIS_PASSWORD: smoke_redis_pw
          API_KEY: smoke_api_key
          AUTH_EDITION: local
          REQUIRE_AUTH: "false"
          DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"
          SMOKE_IMAGES: pull
          AUTOMATOS_IMAGE_TAG: ${{ steps.target.outputs.tag }}
          SMOKE_EXPECT_REVISION: ${{ steps.target.outputs.revision }}
          SMOKE_OUT_DIR: ${{ runner.temp }}/smoke-images
        run: bash scripts/ci/smoke-fresh-clone.sh

      # The pull, boot and check records, the reports and the stack's logs, pass or
      # fail: PRD-262 US-004 takes its five-run medians from them.
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-images-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke-images/
          if-no-files-found: warn
          retention-days: 30

  promote-edge:
    name: promote-edge — move edge to the sha that booted on both arches
    needs: smoke-images
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One at a time; promote_edge.py never moves edge back to an older commit.
    concurrency:
      group: promote-edge
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (the promote tool)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The images images.yml's merge job publishes (a test holds the lists equal).
      - name: Move edge
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ needs.smoke-images.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/promote_edge.py --sha "$SHA" --tag "$TAG" --repo "$REPO" \
            --prefix "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/automatos-" \
            --image api --image frontend --image workspace-worker --summary "$GITHUB_STEP_SUMMARY"

  smoke-images-pr:
    name: smoke-images (pull request, amd64) — boot the images built in this job (non-required)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pr-<7> of the commit checked out and built (GITHUB_SHA), which is also the
      # revision metadata-action stamps on the images.
      - name: The tag to boot
        id: target
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: python3 scripts/ci/smoke_images.py target --event "$EVENT" --sha "$SHA" --outputs "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The three builds repeat images.yml's IMAGES (context, target, build args) and
      # labels, and read its amd64 GHA cache without writing it (PRD-262 §9-Q13).
      # orchestrator/tests/test_prd262_smoke_images.py holds them equal. `load` puts
      # each image in the runner's Docker under the name docker-compose.images.yml uses.
      - name: Metadata (api)
        id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/automatosai/automatos-api
          labels: |
            org.opencontainers.image.title=automatos-api
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build api (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: orchestrator
          target: production
          platforms: linux/amd64
          build-args: |
            INSTALL_GRAPH_EXTRAS=false
          labels: ${{ steps.meta-api.outputs.labels }}
          tags: ghcr.io/automatosai/automatos-api:${{ steps.target.outputs.tag }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=api-amd64

      # PRD-262 US-015 and US-018: the GHCR build (no [leiden] extra) installs no
      # package the code never imports, scikit-learn included. test.yml's
      # prod-image-parity checks the Railway build, which keeps scikit-learn until
      # US-027.
      - name: The api image has no package the code never imports
        env:
          IMAGE: ghcr.io/automatosai/automatos-api:${{ steps.target.outputs.tag }}
          REMOVED: nltk passlib python-jose ecdsa rsa pgvector scikit-learn futureagi gotenberg-client
        run: |
          read -ra names <<< "$REMOVED"
          docker run --rm -i --entrypoint python "$IMAGE" - "${names[@]}" < scripts/ci/image_dists_absent.py

      - name: Metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/automatosai/automatos-frontend
          labels: |
            org.opencontainers.image.title=automatos-frontend
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build frontend (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: production
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_AUTH_EDITION=local
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
            NEXT_PUBLIC_MEDIA_ORIGINS=http://localhost:9000
          labels: ${{ steps.meta-frontend.outputs.labels }}
          tags: ghcr.io/automatosai/automatos-frontend:${{ steps.target.outputs.tag }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=frontend-amd64

      - name: Metadata (workspace-worker)
        id: meta-workspace-worker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/automatosai/automatos-workspace-worker
          labels: |
            org.opencontainers.image.title=automatos-workspace-worker
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build workspace-worker (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/workspace-worker
          platforms: linux/amd64
          build-args: |
            INSTALL_BROWSER=false
          labels: ${{ steps.meta-workspace-worker.outputs.labels }}
          tags: ghcr.io/automatosai/automatos-workspace-worker:${{ steps.target.outputs.tag }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=workspace-worker-amd64

      # The images are in the runner's Docker now; the builder's copy of their layers
      # only takes disk the stack needs.
      - name: Free the build cache
        run: docker buildx prune --all --force

      - name: Boot the images built in this job
        env:
          POSTGRES_PASSWORD: smoke_pg_pw
          REDIS_PASSWORD: smoke_redis_pw
          API_KEY: smoke_api_key
          AUTH_EDITION: local
          REQUIRE_AUTH: "false"
          DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"
          SMOKE_IMAGES: prebuilt
          AUTOMATOS_IMAGE_TAG: ${{ steps.target.outputs.tag }}
          SMOKE_EXPECT_REVISION: ${{ steps.target.outputs.revision }}
          SMOKE_OUT_DIR: ${{ runner.temp }}/smoke-images
        run: bash scripts/ci/smoke-fresh-clone.sh

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-images-pr
          path: ${{ runner.temp }}/smoke-images/
          if-no-files-found: warn
          retention-days: 30
