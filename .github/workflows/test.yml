name: test

# PRD-142 Wave 2 (W2-S3) — the Test Net's enforcement gate.
#
# Runs the orchestrator pytest suite against a real Postgres service so
# DB-touching tests connect instead of hanging. (W2-S2 traced a pre-existing
# hang in test_82c_wiring to psycopg2.connect blocking forever when no
# Postgres is present — see that test's decompose path.) A per-test timeout
# is the safety net: any future hang fails fast instead of burning the whole
# job.
#
# Triggers on push to ANY branch so a red suite surfaces on the feature
# branch — before a PR is opened — not only at PR time. The pull_request
# trigger is kept so the gate also evaluates the merged result. Concurrency
# cancels superseded runs on the same ref so rapid pushes don't queue.
#
# Introduced NON-REQUIRED on purpose. The net is expected to surface
# pre-existing gaps that Wave 2 (WS-G golden journeys, WS-H untested
# primitives, WS-I regressions) will close. Flipping this to a required
# check in branch protection is a deliberate follow-up, made once the suite
# is green — that flip is the repo admin's call, not this workflow's.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Hold the job until Postgres can actually accept connections.
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Wire config.get_database_url() at the ephemeral service above. These
      # are throwaway CI credentials for a container that lives only for the
      # job — not secrets, and never reused.
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development
      # PRD-175: run the suite in the local edition so the anonymous dev-fallback
      # is on (REQUIRE_AUTH=false). Without it, saas-default requires Clerk creds
      # and every unauthenticated endpoint test 401s.
      AUTH_EDITION: local
      # AUTH_EDITION=local's boot guard (config.validate_auth_edition) requires
      # DEFAULT_WORKSPACE_ID — the single local workspace the anonymous session
      # resolves to. init_test_db.py seeds a workspaces row with this exact id so
      # the anonymous-fallback resolution finds a real workspace. Fixed throwaway
      # UUID for the ephemeral CI DB.
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      # weasyprint (libpango/libcairo) and python-magic (libmagic) crash on
      # *import*, not at install, when their C libraries are missing — which
      # would break pytest collection before a single test runs. Install the
      # shared libs the dependency set needs at import time.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev libmagic1 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialise test database schema
        run: python scripts/init_test_db.py

      # The required gate stays pinned to `tests` explicitly. PRD-182 W12-S2
      # widened pytest.ini `testpaths` (so `--collect-only` shows the module
      # trees), but the green gate must keep running exactly what it ran before
      # — the mock/unit suite — so the passing set is unchanged. The orphaned
      # trees run in the separate `orchestrator-module-tests` job below.
      #
      # PRD-182 W12-S4 (F092): coverage is MEASURED here, on the suite that
      # actually runs, via pytest-cov + .coveragerc, and written to coverage.xml.
      # Collecting coverage cannot change a test's pass/fail, so it is safe to add
      # to the required job.
      - name: Run test net (with coverage)
        run: |
          pytest tests \
            --timeout=60 \
            --timeout-method=thread \
            -o faulthandler_timeout=90 \
            -p no:cacheprovider \
            --cov \
            --cov-config=.coveragerc \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            -v

      # The ratchet. CI is ephemeral, so the floor only ENFORCES once it is
      # committed: while .coverage-baseline holds the SEED token this step prints
      # the MEASURED percentage and passes (so "CI reports a coverage number" is
      # true from day one). To ARM the ratchet, read the number this step prints,
      # then commit it into orchestrator/.coverage-baseline (replacing SEED) —
      # from then on a drop below it fails the build. Ratchet the committed number
      # up toward the 80% doctrine as coverage improves.
      - name: Coverage ratchet (measured baseline)
        run: python scripts/check_coverage_baseline.py

  # PRD-160 S5 — NL2SQL regression eval. NON-REQUIRED (same posture as the test
  # net). Self-contained: it seeds an in-memory SQLite DB, so it needs no
  # Postgres service. The always-on checks prove every golden SQL executes and
  # passes the S2 validator; the generation-accuracy eval (no-regression vs
  # baseline.json) runs only when RUN_NL2SQL_EVAL=1 with an LLM configured.
  nl2sql-eval:
    name: NL2SQL eval (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself uses SQLite, not these. Flip RUN_NL2SQL_EVAL on (with an
      # embedding/LLM provider) to run the full generation-accuracy eval.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development
      # PRD-175: run the suite in the local edition so the anonymous dev-fallback
      # is on (REQUIRE_AUTH=false). Without it, saas-default requires Clerk creds
      # and every unauthenticated endpoint test 401s.
      AUTH_EDITION: local
      # AUTH_EDITION=local's boot guard requires DEFAULT_WORKSPACE_ID; set it so
      # any config.validate_auth_edition() reached during the eval passes. The
      # eval is SQLite-only and never resolves this workspace, but the flag must
      # be internally consistent with AUTH_EDITION=local (mirrors the test job).
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev libmagic1 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NL2SQL eval
        run: |
          pytest tests/nl2sql_eval \
            --timeout=120 \
            --timeout-method=thread \
            -p no:cacheprovider \
            -v

  # PRD-177 S6 — operating-graph uplift eval. NON-REQUIRED (same posture as the
  # test net). The moat business gate: measures learned-edge tool-selection
  # accuracy vs BM25 + embedding baselines, PER TENANT, and prints the uplift.
  # Pure Python stdlib + the bundled eval_set fixture — no Postgres, no LLM, no
  # embedding provider. A sub-threshold number is a valid, honest outcome and
  # NEVER fails the job (the number is the deliverable); TOOL_ROUTING_GRAPH is
  # only flipped on once this clears the gate against PRODUCTION per-tenant
  # telemetry, not the bundled fixture.
  operating-graph-uplift-eval:
    name: Operating-graph uplift eval (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself reads only the jsonl fixture and stdlib.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the uplift harness self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_prd177_uplift_eval.py -q -p no:cacheprovider

      # A sub-threshold uplift is a BUSINESS signal, not a CI failure — the
      # number is the deliverable. The harness already exits 0 on a low uplift
      # (evals/operating_graph_uplift.main returns 0 always); continue-on-error
      # is belt-and-braces so this informational emit can never redden the job.
      # The self-tests step above stays the real gate.
      - name: Emit the per-tenant uplift number (informational)
        continue-on-error: true
        run: |
          python -m evals.operating_graph_uplift --json

  # PRD-185 S10 — the first memory quality number: recall@5 / MRR + a
  # with-vs-without task-lift of the memory retriever over a labelled workspace
  # gold-set. NON-REQUIRED, same posture as the uplift eval above — the number is
  # the deliverable, a sub-threshold recall is an honest outcome, not a CI
  # failure. The real gate is this harness run against a LIVE workspace snapshot
  # with the production retriever injected (--corpus + retriever_factory).
  memory-recall-eval:
    name: Memory-recall eval (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself reads only the jsonl fixtures and stdlib.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the memory-recall harness self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_p2w0_memory_recall.py -q -p no:cacheprovider

      # A sub-threshold recall is a BUSINESS signal, not a CI failure — the
      # number is the deliverable. The harness already exits 0 on a low recall
      # (evals/memory_recall.main returns 0 always); continue-on-error is
      # belt-and-braces so this informational emit can never redden the job.
      # The self-tests step above stays the real gate.
      - name: Emit the per-tenant memory-recall number (informational)
        continue-on-error: true
        run: |
          python -m evals.memory_recall --json

  # PRD-198 S1 — the Graphiti-vs-baseline A/B gate. NON-REQUIRED, exit-0:
  # prints the honest verdict — PENDING until the S10 memory baseline is
  # frozen (docs/runbooks/S10-MEMORY-BASELINE-FREEZE.md) and a graphiti
  # treatment run exists (S2-gated); uplift-vs-margin after. Pure stdlib +
  # committed artifacts — no Postgres, no LLM, no graph store. The gate can
  # NEVER read green ahead of the measurement (the PRD's whole discipline).
  graphiti-gate:
    name: Graphiti-vs-baseline gate (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the gate self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_prd198_graphiti_gate.py -q -p no:cacheprovider

      - name: Emit the gate verdict (informational)
        continue-on-error: true
        run: |
          python -m evals.graphiti_vs_baseline

  # PRD-188 S5 (P2-07) — the RAG quality number: document-level recall@5 / MRR
  # per retrieval variant (dense proxy, BM25, hybrid RRF) over a labelled
  # workspace gold-set, including the Internal-Audit-v1 phrasing-sensitivity
  # slice (natural vs keyword pairs). NON-REQUIRED, same posture as the memory
  # eval above — the number is the deliverable, a sub-threshold recall is an
  # honest outcome, not a CI failure. The real verdict is the --live lever grid
  # (rerank / hybrid / query-enhancement toggled) against a provisioned
  # workspace snapshot.
  retrieval-recall-eval:
    name: Retrieval-recall eval (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself reads only the jsonl fixtures and stdlib.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the retrieval-recall harness self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_p2w1_retrieval_recall.py -q -p no:cacheprovider

      # A sub-threshold recall is a BUSINESS signal, not a CI failure — the
      # number is the deliverable. The harness already exits 0 on a low recall
      # (evals/retrieval_recall.main returns 0 always); continue-on-error is
      # belt-and-braces so this informational emit can never redden the job.
      # The self-tests step above stays the real gate.
      - name: Emit the per-variant retrieval-recall number (informational)
        continue-on-error: true
        run: |
          python -m evals.retrieval_recall --json

  # PRD-176 F010 / PRD-209 S2 — the reliability bar: a fresh database reaches
  # exactly ONE head via the SUPPORTED fresh-clone path. NON-REQUIRED (same
  # posture as the test net) until the owner flips branch protection (Q2).
  #
  # Two gates:
  #   1. single-head invariant — asserts `alembic heads` returns exactly one
  #      revision. The 12-head forest was collapsed by prior merge revisions
  #      (PRD-176/203/204/230 …), so this is the permanent regression guard
  #      against a new divergent head. It needs no database.
  #   2. fresh-clone boot path (PRD-209 S2) — the approved shape is merge-to-one-
  #      head (done) + a stamped initdb, NOT a full-forest squash (deleting
  #      revision files would strand Railway prod). So this gate reproduces what
  #      a fresh compose volume actually does: load init_complete_schema.sql
  #      (which CREATEs the schema AND stamps alembic_version at the head), then
  #      run `alembic upgrade heads` — a no-op at head. A pure from-base replay
  #      is NOT the compose path and is deliberately not tested here (it crashes
  #      on tables that are ALTER-ed but never CREATE-d in the historical forest).
  #      Both gates are HARD (no continue-on-error) as of PRD-209 US-004.
  alembic-from-zero:
    name: Alembic from-zero — exactly one head (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # pgvector, not stock postgres — the schema declares vector columns, so a
      # from-zero replay needs the extension available.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: alembic_zero_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d alembic_zero_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/alembic_zero_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: alembic_zero_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev libmagic1 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Gate 1 — the single-head invariant (Step 1, green now, no DB needed).
      - name: Assert exactly one Alembic head
        run: |
          HEADS="$(alembic heads 2>/dev/null | grep -c '(head)')"
          echo "alembic head count: ${HEADS}"
          alembic heads
          if [ "${HEADS}" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found ${HEADS}. A new divergent head was introduced — add a merge revision."
            exit 1
          fi

      # Enable pgvector so the from-zero replay's vector columns resolve.
      - name: Enable pgvector extension
        env:
          PGPASSWORD: test
        run: |
          psql -h 127.0.0.1 -U test -d alembic_zero_db -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # Gate 2 — the SUPPORTED fresh-clone boot path (PRD-209 S2): load the
      # initdb SQL (schema + alembic_version stamp), then `alembic upgrade heads`
      # must be a no-op at head. This is exactly what a fresh compose volume does.
      # HARD (no continue-on-error) as of PRD-209 US-004 — a broken fresh path
      # (bad stamp, forest that no longer replays cleanly) now fails this lane.
      - name: Fresh-clone boot path — initdb SQL + stamp, then upgrade heads
        env:
          PGPASSWORD: test
        run: |
          echo "Loading init_complete_schema.sql into the empty pgvector DB (schema + stamp)..."
          psql -h 127.0.0.1 -U test -d alembic_zero_db -v ON_ERROR_STOP=1 \
            -f core/database/init_complete_schema.sql
          echo "Verifying the initdb stamp equals the single alembic head..."
          STAMP="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc 'SELECT version_num FROM alembic_version;')"
          HEAD="$(alembic heads 2>/dev/null | awk 'NR==1{print $1}')"
          echo "initdb stamp=[${STAMP}] alembic head=[${HEAD}]"
          if [ "${STAMP}" != "${HEAD}" ]; then
            echo "::error::initdb stamp '${STAMP}' != alembic head '${HEAD}' — init_complete_schema.sql stamp drifted from the head."
            exit 1
          fi
          echo "Running 'alembic upgrade heads' — must be a no-op at head..."
          alembic upgrade heads
          echo "Fresh-clone boot path succeeded: initdb + stamp + upgrade reaches the single head with no forest replay."

  # PRD-209 S4 (F051 / deployability J4) — the schema-drift net for the "four
  # writers of schema truth" (init_complete_schema.sql, the Alembic migration
  # forest, create_all-at-boot, and inline ALTERs inside migrations). No lane
  # caught July's ALTER-ed-but-never-CREATE-d table, which crashed a from-base
  # replay with `relation "..." does not exist` (the very failure the from-zero
  # lane above sidesteps by booting via init-SQL+stamp instead of a replay).
  #
  # This lane runs scripts/ci/schema_drift_check.py — a PURE, static parse (no
  # database, no Base.metadata import, no live Alembic) asserting that every table
  # a migration ALTERs / add_columns / indexes / foreign-keys is also CREATE-d by
  # some migration or by init_complete_schema.sql. Green today (the known
  # create_all-only orphans are a documented baseline in the script); RED on the
  # NEXT new orphan. Stdlib only — no pip install, no Postgres service, so it is
  # fast and cannot flake. The pure diff core and the planted-divergence fixtures
  # live in orchestrator/tests/test_prd209_schema_drift.py (run by the required
  # orchestrator-tests lane, so a new orphan also reddens that suite).
  #
  # NON-REQUIRED at introduction (the workflow's established posture); flipping it
  # to a required check once green is the repo admin's call (PRD-209 Q2).
  schema-drift:
    name: Schema-drift check (four writers) (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # HARD gate — red on a table ALTER-ed by a migration but CREATE-d by no
      # migration and not by init_complete_schema.sql (beyond the baseline).
      - name: Schema-drift check (ALTER-ed-but-never-CREATE-d tables)
        run: python scripts/ci/schema_drift_check.py

  # PRD-182 W12-S1 (F034) + S3 (F044) — the frontend CI lane. 148k lines of TS
  # were entirely ungated: `next.config.js` sets `ignoreBuildErrors:true` /
  # `ignoreDuringBuilds:true`, so `next build` never type-checks or lints, and
  # no job ran vitest. This lane closes that, BASELINED so it does not block on
  # the ~hundreds of pre-existing errors:
  #   * vitest  — HARD gate (the suite is green today: 17 files / 90 tests).
  #   * tsc     — baselined gate: fails only if the error count REGRESSES above
  #               .tsc-baseline.json (measured floor). `ignoreBuildErrors` stays
  #               true for deploy; this is the separate enforcement lane.
  #   * eslint  — reports (non-blocking): 208 pre-existing problems surface in
  #               the log without failing the lane.
  #   * route-contract (S3) — HARD gate on a NEW frontend call to a backend path
  #               absent from route-manifest.json (35 pre-existing drifts are
  #               baselined in scripts/route-contract-baseline.json).
  #
  # NON-REQUIRED at introduction (the workflow's established posture); flip to a
  # required check in branch protection once it has run green — that flip is the
  # repo admin's call (see S5 / F057 in the PRD).
  #
  # Install uses `npm install`, not `npm ci`: the committed package-lock.json is
  # out of sync with package.json today (missing entries), which makes `npm ci`
  # fail on install. `npm install` reconciles the lockfile so the lane can run.
  frontend-ci:
    name: Frontend CI (tsc baselined, vitest, eslint, route-contract) (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # HARD gate — the real enforcement win. Must stay green.
      - name: Vitest
        run: npm run test

      # Baselined gate — fails only on a regression above the recorded floor.
      - name: TypeScript (tsc --noEmit, baselined)
        run: node scripts/tsc-baseline-check.js

      # Report-only — surfaces the pre-existing lint problems without blocking.
      - name: ESLint (report only)
        continue-on-error: true
        run: npx eslint . --ext .ts,.tsx

      # HARD gate — fails on a NEW frontend call to a non-existent backend path.
      - name: Frontend route-contract (consumes route-manifest.json)
        run: node scripts/check-route-contract.js

  # PRD-182 W12-S2 (F056) — the two orphaned backend test trees. The required
  # `orchestrator-tests` job only ever ran `tests/`; `modules/*/tests` (81 fns)
  # and `integrations/*/tests` (34 fns) were never collected. This job runs them
  # against the same Postgres service the required job uses. Some module tests
  # need services this job does not stand up (Redis, pgvector, the benchmark
  # stack), so it is introduced NON-REQUIRED — the workflow's standard posture —
  # and reports the true state; flip it required once green. `--collect-only`
  # (via the widened pytest.ini testpaths) now shows these trees regardless.
  orchestrator-module-tests:
    name: Orchestrator module + integration tests (F056) (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development
      AUTH_EDITION: local
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev libmagic1 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialise test database schema
        run: python scripts/init_test_db.py

      # Prove the trees are now collected (S2 acceptance) — visible in the log
      # even if a later runtime failure occurs.
      - name: Collect the previously-orphaned trees
        run: |
          pytest modules integrations \
            --collect-only -q -p no:cacheprovider | tail -40

      - name: Run module + integration tests
        run: |
          pytest modules integrations \
            --timeout=120 \
            --timeout-method=thread \
            -o faulthandler_timeout=150 \
            -p no:cacheprovider \
            -v
