name: test

# PRD-142 Wave 2 (W2-S3) — the Test Net's enforcement gate.
#
# Runs the orchestrator pytest suite against a real Postgres service so
# DB-touching tests connect instead of hanging. (W2-S2 traced a pre-existing
# hang in test_82c_wiring to psycopg2.connect blocking forever when no
# Postgres is present — see that test's decompose path.) A per-test timeout
# is the safety net: any future hang fails fast instead of burning the whole
# job.
#
# Triggers on push to ANY branch so a red suite surfaces on the feature
# branch — before a PR is opened — not only at PR time. The pull_request
# trigger is kept so the gate also evaluates the merged result. Concurrency
# cancels superseded runs on the same ref so rapid pushes don't queue.
#
# Introduced NON-REQUIRED on purpose. The net is expected to surface
# pre-existing gaps that Wave 2 (WS-G golden journeys, WS-H untested
# primitives, WS-I regressions) will close. Flipping this to a required
# check in branch protection is a deliberate follow-up, made once the suite
# is green — that flip is the repo admin's call, not this workflow's.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - studio

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Hold the job until Postgres can actually accept connections.
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Wire config.get_database_url() at the ephemeral service above. These
      # are throwaway CI credentials for a container that lives only for the
      # job — not secrets, and never reused.
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development
      # PRD-175: run the suite in the local edition so the anonymous dev-fallback
      # is on (REQUIRE_AUTH=false). Without it, saas-default requires Clerk creds
      # and every unauthenticated endpoint test 401s.
      AUTH_EDITION: local
      # AUTH_EDITION=local's boot guard (config.validate_auth_edition) requires
      # DEFAULT_WORKSPACE_ID — the single local workspace the anonymous session
      # resolves to. init_test_db.py seeds a workspaces row with this exact id so
      # the anonymous-fallback resolution finds a real workspace. Fixed throwaway
      # UUID for the ephemeral CI DB.
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      # weasyprint (libpango/libcairo) and python-magic (libmagic) crash on
      # *import*, not at install, when their C libraries are missing — which
      # would break pytest collection before a single test runs. Install the
      # shared libs the dependency set needs at import time.
      - name: Install system libraries
        run: |
          # The runner image carries third-party apt sources (Google Chrome,
          # Microsoft); a stale index there ("Hash Sum mismatch", 2026-09-09) makes
          # apt-get update exit 100 and bash -e kills the step before a single
          # test runs. The packages below come from Ubuntu's own archive, so a
          # partial update is fine — install fails loudly if THAT index is stale.
          sudo apt-get update || echo "::warning::apt-get update reported errors (a third-party index?) — continuing with the indexes that did refresh"
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev libmagic1 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # PRD-140 hierarchy audit (F147): every mutating platform action is
      # hierarchy-gated or allow-listed with its reason. A new unlisted
      # mutator fails the job here.
      - name: Hierarchy gate audit
        run: python scripts/check_hierarchy_gate.py

      - name: Initialise test database schema
        run: python scripts/init_test_db.py

      # The required gate stays pinned to `tests` explicitly. PRD-182 W12-S2
      # widened pytest.ini `testpaths` (so `--collect-only` shows the module
      # trees), but the green gate must keep running exactly what it ran before
      # — the mock/unit suite — so the passing set is unchanged. The orphaned
      # trees run in the separate `orchestrator-module-tests` job below.
      #
      # PRD-182 W12-S4 (F092): coverage is MEASURED here, on the suite that
      # actually runs, via pytest-cov + .coveragerc, and written to coverage.xml.
      # Collecting coverage cannot change a test's pass/fail, so it is safe to add
      # to the required job.
      - name: Run test net (with coverage)
        run: |
          pytest tests \
            --timeout=60 \
            --timeout-method=thread \
            -o faulthandler_timeout=90 \
            -p no:cacheprovider \
            --cov \
            --cov-config=.coveragerc \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            -v

      # The ratchet. CI is ephemeral, so the floor only ENFORCES once it is
      # committed: while .coverage-baseline holds the SEED token this step prints
      # the MEASURED percentage and passes (so "CI reports a coverage number" is
      # true from day one). To ARM the ratchet, read the number this step prints,
      # then commit it into orchestrator/.coverage-baseline (replacing SEED) —
      # from then on a drop below it fails the build. Ratchet the committed number
      # up toward the 80% doctrine as coverage improves.
      - name: Coverage ratchet (measured baseline)
        run: python scripts/check_coverage_baseline.py

  # PRD-160 S5 — NL2SQL regression eval. NON-REQUIRED (same posture as the test
  # net). Self-contained: it seeds an in-memory SQLite DB, so it needs no
  # Postgres service. The always-on checks prove every golden SQL executes and
  # passes the S2 validator; the generation-accuracy eval (no-regression vs
  # baseline.json) runs only when RUN_NL2SQL_EVAL=1 with an LLM configured.
  nl2sql-eval:
    name: NL2SQL eval (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself uses SQLite, not these. Flip RUN_NL2SQL_EVAL on (with an
      # embedding/LLM provider) to run the full generation-accuracy eval.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development
      # PRD-175: run the suite in the local edition so the anonymous dev-fallback
      # is on (REQUIRE_AUTH=false). Without it, saas-default requires Clerk creds
      # and every unauthenticated endpoint test 401s.
      AUTH_EDITION: local
      # AUTH_EDITION=local's boot guard requires DEFAULT_WORKSPACE_ID; set it so
      # any config.validate_auth_edition() reached during the eval passes. The
      # eval is SQLite-only and never resolves this workspace, but the flag must
      # be internally consistent with AUTH_EDITION=local (mirrors the test job).
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install system libraries
        run: |
          # The runner image carries third-party apt sources (Google Chrome,
          # Microsoft); a stale index there ("Hash Sum mismatch", 2026-09-09) makes
          # apt-get update exit 100 and bash -e kills the step before a single
          # test runs. The packages below come from Ubuntu's own archive, so a
          # partial update is fine — install fails loudly if THAT index is stale.
          sudo apt-get update || echo "::warning::apt-get update reported errors (a third-party index?) — continuing with the indexes that did refresh"
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev libmagic1 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NL2SQL eval
        run: |
          pytest tests/nl2sql_eval \
            --timeout=120 \
            --timeout-method=thread \
            -p no:cacheprovider \
            -v

  # PRD-177 S6 — operating-graph uplift eval. NON-REQUIRED (same posture as the
  # test net). The moat business gate: measures learned-edge tool-selection
  # accuracy vs BM25 + embedding baselines, PER TENANT, and prints the uplift.
  # Pure Python stdlib + the bundled eval_set fixture — no Postgres, no LLM, no
  # embedding provider. A sub-threshold number is a valid, honest outcome and
  # NEVER fails the job (the number is the deliverable); TOOL_ROUTING_GRAPH is
  # only flipped on once this clears the gate against PRODUCTION per-tenant
  # telemetry, not the bundled fixture.
  operating-graph-uplift-eval:
    name: Operating-graph uplift eval (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself reads only the jsonl fixture and stdlib.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the uplift harness self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_prd177_uplift_eval.py -q -p no:cacheprovider

      # A sub-threshold uplift is a BUSINESS signal, not a CI failure — the
      # number is the deliverable. The harness already exits 0 on a low uplift
      # (evals/operating_graph_uplift.main returns 0 always); continue-on-error
      # is belt-and-braces so this informational emit can never redden the job.
      # The self-tests step above stays the real gate.
      - name: Emit the per-tenant uplift number (informational)
        continue-on-error: true
        run: |
          python -m evals.operating_graph_uplift --json

  # PRD-185 S10 — the first memory quality number: recall@5 / MRR + a
  # with-vs-without task-lift of the memory retriever over a labelled workspace
  # gold-set. NON-REQUIRED, same posture as the uplift eval above — the number is
  # the deliverable, a sub-threshold recall is an honest outcome, not a CI
  # failure. The real gate is this harness run against a LIVE workspace snapshot
  # with the production retriever injected (--corpus + retriever_factory).
  memory-recall-eval:
    name: Memory-recall eval (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself reads only the jsonl fixtures and stdlib.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the memory-recall harness self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_p2w0_memory_recall.py -q -p no:cacheprovider

      # A sub-threshold recall is a BUSINESS signal, not a CI failure — the
      # number is the deliverable. The harness already exits 0 on a low recall
      # (evals/memory_recall.main returns 0 always); continue-on-error is
      # belt-and-braces so this informational emit can never redden the job.
      # The self-tests step above stays the real gate.
      - name: Emit the per-tenant memory-recall number (informational)
        continue-on-error: true
        run: |
          python -m evals.memory_recall --json

  # PRD-198 S1 — the Graphiti-vs-baseline A/B gate. NON-REQUIRED, exit-0:
  # prints the honest verdict — PENDING until the S10 memory baseline is
  # frozen (docs/runbooks/S10-MEMORY-BASELINE-FREEZE.md) and a graphiti
  # treatment run exists (S2-gated); uplift-vs-margin after. Pure stdlib +
  # committed artifacts — no Postgres, no LLM, no graph store. The gate can
  # NEVER read green ahead of the measurement (the PRD's whole discipline).
  graphiti-gate:
    name: Graphiti-vs-baseline gate (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the gate self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_prd198_graphiti_gate.py -q -p no:cacheprovider

      - name: Emit the gate verdict (informational)
        continue-on-error: true
        run: |
          python -m evals.graphiti_vs_baseline

  # PRD-188 S5 (P2-07) — the RAG quality number: document-level recall@5 / MRR
  # per retrieval variant (dense proxy, BM25, hybrid RRF) over a labelled
  # workspace gold-set, including the Internal-Audit-v1 phrasing-sensitivity
  # slice (natural vs keyword pairs). NON-REQUIRED, same posture as the memory
  # eval above — the number is the deliverable, a sub-threshold recall is an
  # honest outcome, not a CI failure. The real verdict is the --live lever grid
  # (rerank / hybrid / query-enhancement toggled) against a provisioned
  # workspace snapshot.
  retrieval-recall-eval:
    name: Retrieval-recall eval (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself reads only the jsonl fixtures and stdlib.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the retrieval-recall harness self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_p2w1_retrieval_recall.py -q -p no:cacheprovider

      # A sub-threshold recall is a BUSINESS signal, not a CI failure — the
      # number is the deliverable. The harness already exits 0 on a low recall
      # (evals/retrieval_recall.main returns 0 always); continue-on-error is
      # belt-and-braces so this informational emit can never redden the job.
      # The self-tests step above stays the real gate.
      - name: Emit the per-variant retrieval-recall number (informational)
        continue-on-error: true
        run: |
          python -m evals.retrieval_recall --json

  # PRD-176 F010 / PRD-209 S2 — the reliability bar: a fresh database reaches
  # exactly ONE head via the SUPPORTED fresh-clone path. NON-REQUIRED (same
  # posture as the test net) until the owner flips branch protection (Q2).
  #
  # Two gates:
  #   1. single-head invariant — asserts `alembic heads` returns exactly one
  #      revision. The 12-head forest was collapsed by prior merge revisions
  #      (PRD-176/203/204/230 …), so this is the permanent regression guard
  #      against a new divergent head. It needs no database.
  #   2. fresh-clone boot path (PRD-209 S2) — the approved shape is merge-to-one-
  #      head (done) + a stamped initdb, NOT a full-forest squash (deleting
  #      revision files would strand Railway prod). So this gate reproduces what
  #      a fresh compose volume actually does: load init_complete_schema.sql
  #      (which CREATEs the schema AND stamps alembic_version at the head), then
  #      run `alembic upgrade heads` — a no-op at head. A pure from-base replay
  #      is NOT the compose path and is deliberately not tested here (it crashes
  #      on tables that are ALTER-ed but never CREATE-d in the historical forest).
  #      Both gates are HARD (no continue-on-error) as of PRD-209 US-004.
  alembic-from-zero:
    name: Alembic from-zero — exactly one head (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # pgvector, not stock postgres — the schema declares vector columns, so a
      # from-zero replay needs the extension available.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: alembic_zero_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d alembic_zero_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/alembic_zero_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: alembic_zero_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install system libraries
        run: |
          # The runner image carries third-party apt sources (Google Chrome,
          # Microsoft); a stale index there ("Hash Sum mismatch", 2026-09-09) makes
          # apt-get update exit 100 and bash -e kills the step before a single
          # test runs. The packages below come from Ubuntu's own archive, so a
          # partial update is fine — install fails loudly if THAT index is stale.
          sudo apt-get update || echo "::warning::apt-get update reported errors (a third-party index?) — continuing with the indexes that did refresh"
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev libmagic1 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Gate 1 — the single-head invariant (Step 1, green now, no DB needed).
      - name: Assert exactly one Alembic head
        run: |
          HEADS="$(alembic heads 2>/dev/null | grep -c '(head)')"
          echo "alembic head count: ${HEADS}"
          alembic heads
          if [ "${HEADS}" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found ${HEADS}. A new divergent head was introduced — add a merge revision."
            exit 1
          fi

      # Enable pgvector so the from-zero replay's vector columns resolve.
      - name: Enable pgvector extension
        env:
          PGPASSWORD: test
        run: |
          psql -h 127.0.0.1 -U test -d alembic_zero_db -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # Gate 2 — the SUPPORTED fresh-clone boot path (PRD-209 S2, revised
      # 2026-08-29): scripts/init_fresh_db.py builds the CI-proven schema
      # (create_all + raw-DDL extras) on the empty DB and stamps heads; then
      # `alembic upgrade heads` must be a no-op, and the tables the live local
      # test found MISSING from the old snapshot must exist. The old
      # init_complete_schema.sql was a stale hand-maintained copy (fresh DBs
      # got 107 of prod's ~152 tables); it is deleted — the 41 orphan-root
      # revisions make a from-empty forest replay impossible until the lineage
      # is repaired (recorded follow-on in the PRD addendum).
      # HARD (no continue-on-error) as of PRD-209 US-004.
      - name: Fresh-clone boot path — init_fresh_db (create_all + stamp), then upgrade heads
        env:
          PGPASSWORD: test
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/alembic_zero_db
        run: |
          echo "Building the fresh schema via scripts/init_fresh_db (CI-proven path)..."
          python -m scripts.init_fresh_db
          echo "Verifying the stamp equals the single alembic head..."
          STAMP="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc 'SELECT version_num FROM alembic_version;')"
          HEAD="$(alembic heads 2>/dev/null | awk 'NR==1{print $1}')"
          echo "stamp=[${STAMP}] alembic head=[${HEAD}]"
          if [ "${STAMP}" != "${HEAD}" ]; then
            echo "::error::stamp '${STAMP}' != alembic head '${HEAD}' — init_fresh_db stamped somewhere other than the head."
            exit 1
          fi
          echo "Running 'alembic upgrade heads' — must be a no-op at head..."
          alembic upgrade heads
          echo "Asserting the tables the stale snapshot was missing exist on the fresh path..."
          for t in notifications personas channel_connections marketplace_widgets workspaces document_chunks codegraph_projects; do
            FOUND="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc "SELECT to_regclass('${t}');" | tr -d ' ')"
            if [ -z "${FOUND}" ]; then
              echo "::error::fresh schema is missing table '${t}' — the create_all path regressed."
              exit 1
            fi
          done
          echo "Asserting what orphan-root ORDERING used to lose on a fresh path (PRD-233 live-test finding)..."
          # prd82a (a root) adds agent_reports.orchestration_task_id before agent_reports exists in the
          # replay; prd133b (another root) builds v_workspace_outputs on it. The generator's
          # model-column reconciliation + idempotent raw-SQL re-run passes must leave both present.
          for chk in "v_workspace_outputs" ; do
            FOUND="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc "SELECT to_regclass('${chk}');" | tr -d ' ')"
            if [ -z "${FOUND}" ]; then
              echo "::error::fresh schema is missing '${chk}' — the idempotent raw-SQL (views) pass regressed."
              exit 1
            fi
          done
          COL="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc "SELECT column_name FROM information_schema.columns WHERE table_name='agent_reports' AND column_name='orchestration_task_id';" | tr -d ' ')"
          if [ -z "${COL}" ]; then
            echo "::error::fresh schema is missing agent_reports.orchestration_task_id — the model-column reconciliation pass regressed."
            exit 1
          fi
          ROWS="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc 'SELECT count(*) FROM v_workspace_outputs;' | tr -d ' ')"
          echo "v_workspace_outputs answers (rows=${ROWS})"
          echo "Fresh-clone boot path succeeded: complete schema + stamp + no-op upgrade."

  # Prod-image parity (2026-08-30, after #650 shipped the local edition's
  # Dockerfile defaults to production — Clerk outage, #668). Railway builds the
  # three Dockerfiles with NO build args (railway.json: DOCKERFILE, target
  # production), so this lane builds exactly that and checks what got baked:
  # the frontend's edition literal, the backend's graph extras, the worker's
  # browser. Non-required like the other lanes; the required flip is the repo
  # admin's call.
  prod-image-parity:
    name: Prod images built with default args carry production behaviour (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Frontend — edition baked with no args must be saas
        run: |
          docker build --target production -t parity-fe frontend/
          # lib/auth-edition.ts compiles to `"local"===<INLINED>.trim().toLowerCase()?"local":"saas"`
          # (Next folds the `|| ''` away), so the baked edition is the literal on the right.
          LOCAL=$(docker run --rm parity-fe sh -c 'grep -rlF "\"local\"===\"local\".trim()" .next 2>/dev/null | wc -l')
          SAAS=$(docker run --rm parity-fe sh -c 'grep -rlF "\"local\"===\"saas\".trim()" .next 2>/dev/null | wc -l')
          echo "chunks with local literal: $LOCAL; with saas literal: $SAAS"
          if [ "$LOCAL" != "0" ] || [ "$SAAS" = "0" ]; then
            echo "::error::the production frontend image bakes the LOCAL edition — check ARG NEXT_PUBLIC_AUTH_EDITION in frontend/Dockerfile"
            exit 1
          fi
      - name: Backend — graph extras present with no args
        run: |
          docker build --target production -t parity-be orchestrator/
          docker run --rm parity-be python -c "import graspologic, graphify.cluster; print('leiden extras present')"
      - name: Worker — headless browser present with no args
        run: |
          docker build -t parity-wk services/workspace-worker/
          # --entrypoint: the worker image's entrypoint.sh execs the worker itself
          # (ignoring CMD) and dies on Redis — we only want to look inside the image.
          docker run --rm --entrypoint sh parity-wk -c 'ls /opt/playwright-browsers | grep -q chromium && echo "chromium present"'

  # PRD-251 Wave 1, S1.1a/b (US-101, US-102): the media-render image (D3). It
  # builds the service exactly as Railway will (no build args, the default last
  # stage), runs the service's own suite INSIDE the image (the real check, mix
  # and Kokoro among it), proves the boot assertion and /health, then renders the
  # 3-second fixture bundle through the API with the internal token, timed, and
  # asserts the MP4 with ffprobe and its loudness with ebur128. The runner only
  # builds, runs and asserts. A required job for the PRD-251 Wave 1 gate
  # (scripts/ralph/acceptance-prd251w1.sh).
  media-render:
    name: media-render — image builds and renders the fixture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: media-render:ci
      TEST_IMAGE: media-render:test
    steps:
      - uses: actions/checkout@v4
      # US-104 (S1.1c): the local edition runs the renderer as the optional
      # compose profile `media`, and the backend's SOCIALS_RENDER_URL points at it.
      # Throwaway values for the three `:?`-required secrets; nothing starts.
      - name: Compose — the media profile runs media-render; the default stack does not
        env:
          POSTGRES_PASSWORD: ci
          REDIS_PASSWORD: ci
          API_KEY: ci
        run: |
          docker compose version
          docker compose --profile media config > "$RUNNER_TEMP/compose-media.yml"
          media=$(docker compose --profile media config --services)
          plain=$(docker compose config --services)
          echo "services with --profile media:"; echo "$media" | sed 's/^/  /'
          echo "$media" | grep -qx media-render || { echo "::error::docker compose --profile media config has no media-render service"; exit 1; }
          if echo "$plain" | grep -qx media-render; then echo "::error::media-render starts without the media profile"; exit 1; fi
          grep -qE 'SOCIALS_RENDER_URL: *"?http://media-render:8090' "$RUNNER_TEMP/compose-media.yml" \
            || { echo "::error::the backend's SOCIALS_RENDER_URL does not point at media-render"; exit 1; }
          sed -n '/^  media-render:/,/^  [a-z]/p' "$RUNNER_TEMP/compose-media.yml" | head -60
          echo "docker compose --profile media config includes media-render; the default profile does not: PASS"
      - name: Build the image (default target, as Railway builds it)
        run: |
          start=$(date +%s)
          docker build -t "$IMAGE" services/media-render/
          echo "image build: $(( $(date +%s) - start )) s"
          docker image ls "$IMAGE"
      - name: The versions baked into the image
        run: docker run --rm --entrypoint cat "$IMAGE" /opt/media-render/versions.json
      # US-112 (S1.6): the music library. The build fetched every track named in
      # services/media-render/music/manifest.json, checked its sha256 and analysed
      # it; the manifest it wrote must carry every committed track as committed,
      # with cue windows, and Deep House 003 must list the break the Markets
      # reference cut on (34.0-35.8 s). Then the same build from a manifest whose
      # first sha256 is wrong must FAIL: no audio is committed, so the hash is
      # what pins the bytes (the layers before the music step come from cache).
      - name: The music library — every track hash-checked and analysed; a bad hash fails the image build
        run: |
          out="$RUNNER_TEMP/music"
          mkdir -p "$out"
          docker run --rm --entrypoint cat "$IMAGE" /opt/media-render/music/manifest.json > "$out/manifest.json"
          python3 services/media-render/ci/assert_music.py --source services/media-render/music/manifest.json \
            --built "$out/manifest.json" --break deep-house-003:34.0-35.8
          bad="$RUNNER_TEMP/media-render-bad-hash"
          rm -rf "$bad"
          cp -r services/media-render "$bad"
          python3 -c 'import hashlib, json, sys; p = sys.argv[1]; d = json.load(open(p)); d["tracks"][0]["sha256"] = hashlib.sha256(b"not the track").hexdigest(); json.dump(d, open(p, "w"), indent=1); print("changed the sha256 of", d["tracks"][0]["id"])' "$bad/music/manifest.json"
          set +e
          start=$(date +%s)
          docker build --progress=plain -t media-render:bad-hash "$bad" > "$out/bad-hash-build.log" 2>&1
          code=$?
          set -e
          echo "the build with a wrong sha256 exited $code after $(( $(date +%s) - start )) s"
          grep -n "sha256 mismatch" "$out/bad-hash-build.log" | head -n 3 || true
          if [ "$code" -eq 0 ]; then echo "::error::the image built with a wrong sha256 in music/manifest.json"; exit 1; fi
          if ! grep -q "sha256 mismatch" "$out/bad-hash-build.log"; then
            tail -n 60 "$out/bad-hash-build.log"
            echo "::error::the build failed, but not on the music hash"
            exit 1
          fi
          echo "a music manifest with a wrong sha256 fails the image build: PASS"
      - name: The service's own suite, inside the image
        run: |
          docker build --target test -t "$TEST_IMAGE" services/media-render/
          docker run --rm --shm-size=1g -e LOG_RELAY_ENABLED=false --entrypoint python "$TEST_IMAGE" -m pytest -v
      - name: Boot assertion — a 160-character espeak data path stops the container
        run: |
          long="/opt/$(printf 'e%.0s' $(seq 1 160))"
          set +e
          timeout 120 docker run --rm -e LOG_RELAY_ENABLED=false -e MEDIA_RENDER_ESPEAK_DATA_PATH="$long" "$IMAGE" > boot.log 2>&1
          code=$?
          set -e
          cat boot.log
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "::error::the container did not refuse a ${#long}-character espeak data path (exit $code)"
            exit 1
          fi
          grep -q 'espeak-ng data path is 165 characters' boot.log
          echo "the default command refused to boot with a ${#long}-character path (exit $code): PASS"
      - name: The container boots and /health answers without a token
        run: |
          docker run -d --name media-render-health -e LOG_RELAY_ENABLED=false -p 127.0.0.1:8090:8090 "$IMAGE"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/health; then ok=1; echo; break; fi
            sleep 2
          done
          docker logs media-render-health
          docker rm -f media-render-health > /dev/null
          if [ -z "$ok" ]; then echo "::error::/health never answered"; exit 1; fi
      - name: The API renders the fixture bundle (POST /render, poll, fetch the MP4), timed
        env:
          TOKEN: ci-render-token
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          docker run --rm -e LOG_RELAY_ENABLED=false "$IMAGE" fixture-bundle > "$out/bundle.json"
          docker run -d --name media-render-api --shm-size=1g -e LOG_RELAY_ENABLED=false \
            -e SOCIALS_RENDER_TOKEN="$TOKEN" -p 127.0.0.1:8090:8090 "$IMAGE"
          up=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/health > /dev/null; then up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then docker logs media-render-api; echo "::error::the API never answered /health"; exit 1; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8090/render)
          echo "POST /render without the token answered $code"
          if [ "$code" != 401 ]; then echo "::error::the render API is open without its token"; exit 1; fi
          start=$(date +%s)
          code=$(curl -sS -o "$out/accepted.json" -w '%{http_code}' --max-time 600 \
            -H "X-Internal-Token: $TOKEN" -H 'Content-Type: application/json' \
            --data-binary @"$out/bundle.json" http://127.0.0.1:8090/render)
          echo "POST /render answered $code after $(( $(date +%s) - start )) s (staged, spoken, mixed, checked)"
          cat "$out/accepted.json"; echo
          if [ "$code" != 202 ]; then docker logs media-render-api; echo "::error::POST /render answered $code"; exit 1; fi
          id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "$out/accepted.json")
          status=""
          for i in $(seq 1 300); do
            curl -sS -H "X-Internal-Token: $TOKEN" "http://127.0.0.1:8090/render/$id" > "$out/job.json"
            status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$out/job.json")
            case "$status" in done|failed|rejected) break ;; esac
            sleep 2
          done
          echo "render $id: $status, $(( $(date +%s) - start )) s from POST to finished"
          if [ "$status" != done ]; then cat "$out/job.json"; docker logs media-render-api; exit 1; fi
          curl -sS -f -H "X-Internal-Token: $TOKEN" -o "$out/fixture.mp4" \
            "http://127.0.0.1:8090/render/$id/output/render.mp4"
          ls -l "$out/fixture.mp4"
          docker logs media-render-api 2>&1 | tail -n 40
          docker rm -f media-render-api > /dev/null
      - name: Assert the MP4 (ffprobe), the Kokoro line and the loudness (ebur128)
        run: |
          out="$RUNNER_TEMP/out"
          docker run --rm -v "$out:/out" --entrypoint ffprobe "$IMAGE" \
            -v error -show_streams -show_format -of json /out/fixture.mp4 > "$out/probe.json"
          docker run --rm -v "$out:/out" --entrypoint ffmpeg "$IMAGE" -hide_banner -nostats \
            -i /out/fixture.mp4 -map 0:a:0 -af ebur128=peak=true -f null - 2> "$out/ebur128.log"
          sed -n '/Summary:/,$p' "$out/ebur128.log"
          python3 services/media-render/ci/assert_output.py "$out/probe.json" \
            --video-codec h264 --width 1080 --height 1920 --fps 30 \
            --audio-codec aac --duration 3.0 --tolerance 0.1 \
            --job "$out/job.json" --min-line-seconds 0.5 \
            --ebur128 "$out/ebur128.log" --lufs -14 --lufs-tolerance 1
      - name: The render job's report (check, mix, timings)
        if: always()
        run: cat "$RUNNER_TEMP/out/job.json" 2>/dev/null || echo "no job report"
      - name: Keep the rendered fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-render-fixture
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 7
      # US-111 (S1.5): the fixture script, four Kokoro lines each in its own
      # script window (services/media-render/fixtures/script). Its first line is
      # the fixture's own (2.09 s) in a 1.9 s window, so the render must speed it
      # up into the window (media_render/fit.py). The MP4 is probed, its audio is
      # decoded by the image's ffmpeg, and every script window must carry speech
      # well above the quiet between the lines (ci/assert_script_windows.py).
      - name: The fixture script renders with Kokoro speech in every script window (a line longer than its window is fitted)
        env:
          TOKEN: ci-render-token
        run: |
          out="$RUNNER_TEMP/script"
          mkdir -p "$out"
          docker run --rm -e LOG_RELAY_ENABLED=false "$IMAGE" fixture-bundle script > "$out/bundle.json"
          docker run -d --name media-render-script --shm-size=1g -e LOG_RELAY_ENABLED=false \
            -e SOCIALS_RENDER_TOKEN="$TOKEN" -p 127.0.0.1:8092:8090 "$IMAGE"
          up=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8092/health > /dev/null; then up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then docker logs media-render-script; echo "::error::the API never answered /health"; exit 1; fi
          set +e
          python3 services/media-render/ci/render_bundle.py --url http://127.0.0.1:8092 --token "$TOKEN" \
            --bundle "$out/bundle.json" --out "$out" --output render.mp4 --save-as script.mp4
          code=$?
          set -e
          docker logs media-render-script 2>&1 | tail -n 40
          docker rm -f media-render-script > /dev/null
          if [ "$code" != 0 ]; then echo "::error::the fixture script did not render"; exit 1; fi
          docker run --rm -v "$out:/out:ro" --entrypoint ffprobe "$IMAGE" \
            -v error -show_streams -show_format -of json /out/script.mp4 > "$out/probe.json"
          python3 services/media-render/ci/assert_output.py "$out/probe.json" \
            --video-codec h264 --width 1080 --height 1920 --fps 30 \
            --audio-codec aac --duration 9.0 --tolerance 0.1 \
            --job "$out/job.json" --min-line-seconds 0.5
          docker run --rm -v "$out:/out:ro" --entrypoint ffmpeg "$IMAGE" -v error \
            -i /out/script.mp4 -map 0:a:0 -ac 1 -ar 16000 -f s16le - > "$out/script.pcm"
          python3 services/media-render/ci/assert_script_windows.py --job "$out/job.json" \
            --pcm "$out/script.pcm" --rate 16000 --duration 9.0 --expect-fitted l01 --max-tempo 1.25
      - name: Keep the rendered fixture script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-render-fixture-script
          path: ${{ runner.temp }}/script
          if-no-files-found: ignore
          retention-days: 7
      # US-112 (S1.6): a video with library music. The fixture script's
      # composition with three Kokoro lines over Deep House 003 from 32.0 s (its
      # bass-out break lands at 2.0-3.9 s): the bed ducked under the voice, the
      # mix normalised in two passes. The rendered MP4's integrated loudness must
      # be -14 ± 1 LUFS (ebur128), and the job report must name the track with the
      # CC BY credit line the post's copy carries.
      - name: A video with library music renders at -14 ± 1 LUFS, and its report carries the CC BY credit line
        env:
          TOKEN: ci-render-token
        run: |
          out="$RUNNER_TEMP/music-render"
          mkdir -p "$out"
          docker run --rm -e LOG_RELAY_ENABLED=false "$IMAGE" fixture-bundle music > "$out/bundle.json"
          docker run -d --name media-render-music --shm-size=1g -e LOG_RELAY_ENABLED=false \
            -e SOCIALS_RENDER_TOKEN="$TOKEN" -p 127.0.0.1:8093:8090 "$IMAGE"
          up=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8093/health > /dev/null; then up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then docker logs media-render-music; echo "::error::the API never answered /health"; exit 1; fi
          set +e
          python3 services/media-render/ci/render_bundle.py --url http://127.0.0.1:8093 --token "$TOKEN" \
            --bundle "$out/bundle.json" --out "$out" --output render.mp4 --save-as music.mp4
          code=$?
          set -e
          docker logs media-render-music 2>&1 | tail -n 40
          docker rm -f media-render-music > /dev/null
          if [ "$code" != 0 ]; then echo "::error::the music fixture did not render"; exit 1; fi
          docker run --rm -v "$out:/out:ro" --entrypoint ffprobe "$IMAGE" \
            -v error -show_streams -show_format -of json /out/music.mp4 > "$out/probe.json"
          docker run --rm -v "$out:/out:ro" --entrypoint ffmpeg "$IMAGE" -hide_banner -nostats \
            -i /out/music.mp4 -map 0:a:0 -af ebur128=peak=true -f null - 2> "$out/ebur128.log"
          sed -n '/Summary:/,$p' "$out/ebur128.log"
          python3 services/media-render/ci/assert_output.py "$out/probe.json" \
            --video-codec h264 --width 1080 --height 1920 --fps 30 \
            --audio-codec aac --duration 9.0 --tolerance 0.1 \
            --job "$out/job.json" --min-line-seconds 0.5 \
            --ebur128 "$out/ebur128.log" --lufs -14 --lufs-tolerance 1
          python3 services/media-render/ci/assert_music.py --job "$out/job.json" --track deep-house-003 \
            --credit 'Music: "Deep House 003" by Sascha Ende (ende.app), licensed CC BY 4.0.'
      - name: Keep the rendered video with music
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-render-fixture-music
          path: ${{ runner.temp }}/music-render
          if-no-files-found: ignore
          retention-days: 7
      # US-106 (S1.2b): the four reference videos, seeded as templates. Each one's
      # bundle is built by the orchestrator's own seed loader and bundle builder
      # (standard library only, the runner's python3) from its sample data (the
      # reference's copy), a Studio Dark brand kit and a drawn logo, with every
      # footage slot empty. media-render checks the FULL composition (`hyperframes
      # check`: a 202 means 0 errors) and renders a preview: snapshot frames at the
      # template's key moments, small, and a short reel. The pixel probe renders
      # a probed moment again with the brand kit's primary colour swapped and reads
      # the pixel back (scripts/ci/social_template_previews.py).
      # US-107 (S1.2c): the seven image templates (the automatos-social families, a
      # fact card and a carousel) render for real at every size they declare: the
      # full check, then one full-size PNG per still (a carousel's slides), each
      # read back and measured; the probe swaps the primary under the brand stripe.
      # US-108 (S1.3): the Title card renders again with a brand kit carrying an
      # uploaded woff2 (scripts/ci/ci_block_font.py, every glyph a solid block)
      # named in heading_font, and an uploaded logo mark: the headline's accent
      # words must fill their box as solid blocks do, and in the kit's own
      # heading font they must not.
      # US-113 (S1.7): the Infographic, whose sample chart is a fixture report's
      # binding, renders again bound to more fixture reports by the orchestrator's
      # own parser and binder (core/report_tables.py, core/chart_binding.py): a
      # line, a number grid, and a stress table (labels cut, the widest figures)
      # as a bar, a line and a grid, at every size, each with 0 check errors (the
      # axis labels fit), every figure on the chart the report's own cell.
      - name: The seeded templates pass the check; videos preview, images render as PNGs at every size; the pixel follows the brand kit; the headline takes the uploaded heading font
        env:
          TOKEN: ci-render-token
        run: |
          out="$RUNNER_TEMP/templates"
          mkdir -p "$out"
          docker run -d --name media-render-templates --shm-size=1g -e LOG_RELAY_ENABLED=false \
            -e SOCIALS_RENDER_TOKEN="$TOKEN" -p 127.0.0.1:8091:8090 "$IMAGE"
          up=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8091/health > /dev/null; then up=1; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then docker logs media-render-templates; echo "::error::the API never answered /health"; exit 1; fi
          python3 --version
          start=$(date +%s)
          set +e
          PYTHONPATH=orchestrator python3 scripts/ci/social_template_previews.py \
            --url http://127.0.0.1:8091 --token "$TOKEN" --out "$out"
          code=$?
          set -e
          echo "the seeded templates: $(( $(date +%s) - start )) s"
          docker logs media-render-templates 2>&1 | tail -n 80
          docker rm -f media-render-templates > /dev/null
          if [ "$code" != 0 ]; then echo "::error::a seeded template failed its check, its preview or render, or the pixel probe"; fi
          exit $code
      - name: Keep the seeded templates' previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-render-template-previews
          path: ${{ runner.temp }}/templates
          if-no-files-found: ignore
          retention-days: 7

  # PRD-209 S4 (F051 / deployability J4) — the schema-drift net for the "four
  # writers of schema truth" (init_complete_schema.sql, the Alembic migration
  # forest, create_all-at-boot, and inline ALTERs inside migrations). No lane
  # caught July's ALTER-ed-but-never-CREATE-d table, which crashed a from-base
  # replay with `relation "..." does not exist` (the very failure the from-zero
  # lane above sidesteps by booting via init-SQL+stamp instead of a replay).
  #
  # This lane runs scripts/ci/schema_drift_check.py — a PURE, static parse (no
  # database, no Base.metadata import, no live Alembic) asserting that every table
  # a migration ALTERs / add_columns / indexes / foreign-keys is also CREATE-d by
  # some migration or by init_complete_schema.sql. Green today (the known
  # create_all-only orphans are a documented baseline in the script); RED on the
  # NEXT new orphan. Stdlib only — no pip install, no Postgres service, so it is
  # fast and cannot flake. The pure diff core and the planted-divergence fixtures
  # live in orchestrator/tests/test_prd209_schema_drift.py (run by the required
  # pytest suite, so a new orphan also reddens that suite).
  #
  # NON-REQUIRED at introduction (the workflow's established posture); flipping it
  # to a required check once green is the repo admin's call (PRD-209 Q2).
  schema-drift:
    name: Schema-drift check (four writers) (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # HARD gate — red on a table ALTER-ed by a migration but CREATE-d by no
      # migration and not by init_complete_schema.sql (beyond the baseline).
      - name: Schema-drift check (ALTER-ed-but-never-CREATE-d tables)
        run: python scripts/ci/schema_drift_check.py

  # PRD-182 W12-S1 (F034) + S3 (F044) — the frontend CI lane. 148k lines of TS
  # were entirely ungated: `next.config.js` sets `ignoreBuildErrors:true` /
  # `ignoreDuringBuilds:true`, so `next build` never type-checks or lints, and
  # no job ran vitest. This lane closes that, BASELINED so it does not block on
  # the ~hundreds of pre-existing errors:
  #   * vitest  — HARD gate (the suite is green today: 17 files / 90 tests).
  #   * tsc     — baselined gate: fails only if the error count REGRESSES above
  #               .tsc-baseline.json (measured floor). `ignoreBuildErrors` stays
  #               true for deploy; this is the separate enforcement lane.
  #   * eslint  — reports (non-blocking): 208 pre-existing problems surface in
  #               the log without failing the lane.
  #   * route-contract (S3) — HARD gate on a NEW frontend call to a backend path
  #               absent from route-manifest.json (35 pre-existing drifts are
  #               baselined in scripts/route-contract-baseline.json).
  #
  # NON-REQUIRED at introduction (the workflow's established posture); flip to a
  # required check in branch protection once it has run green — that flip is the
  # repo admin's call (see S5 / F057 in the PRD).
  #
  # Install uses `npm install`, not `npm ci`: the committed package-lock.json is
  # out of sync with package.json today (missing entries), which makes `npm ci`
  # fail on install. `npm install` reconciles the lockfile so the lane can run.
  frontend-ci:
    name: Frontend CI (tsc baselined, vitest, eslint, route-contract) (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # HARD gate — the real enforcement win. Must stay green.
      - name: Vitest
        run: npm run test

      # Baselined gate — fails only on a regression above the recorded floor.
      - name: TypeScript (tsc --noEmit, baselined)
        run: node scripts/tsc-baseline-check.js

      # Report-only — surfaces the pre-existing lint problems without blocking.
      - name: ESLint (report only)
        continue-on-error: true
        run: npx eslint . --ext .ts,.tsx

      # HARD gate — fails on a NEW frontend call to a non-existent backend path.
      - name: Frontend route-contract (consumes route-manifest.json)
        run: node scripts/check-route-contract.js

  # PRD-182 W12-S2 (F056) — the two orphaned backend test trees. The required
  # `orchestrator-tests` job only ever ran `tests/`; `modules/*/tests` (81 fns)
  # and `integrations/*/tests` (34 fns) were never collected. This job runs them
  # against the same Postgres service the required job uses. Some module tests
  # need services this job does not stand up (Redis, pgvector, the benchmark
  # stack), so it is introduced NON-REQUIRED — the workflow's standard posture —
  # and reports the true state; flip it required once green. `--collect-only`
  # (via the widened pytest.ini testpaths) now shows these trees regardless.
  orchestrator-module-tests:
    name: Orchestrator module + integration tests (F056) (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development
      AUTH_EDITION: local
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install system libraries
        run: |
          # The runner image carries third-party apt sources (Google Chrome,
          # Microsoft); a stale index there ("Hash Sum mismatch", 2026-09-09) makes
          # apt-get update exit 100 and bash -e kills the step before a single
          # test runs. The packages below come from Ubuntu's own archive, so a
          # partial update is fine — install fails loudly if THAT index is stale.
          sudo apt-get update || echo "::warning::apt-get update reported errors (a third-party index?) — continuing with the indexes that did refresh"
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev libmagic1 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialise test database schema
        run: python scripts/init_test_db.py

      # Prove the trees are now collected (S2 acceptance) — visible in the log
      # even if a later runtime failure occurs.
      - name: Collect the previously-orphaned trees
        run: |
          pytest modules integrations \
            --collect-only -q -p no:cacheprovider | tail -40

      - name: Run module + integration tests
        run: |
          pytest modules integrations \
            --timeout=120 \
            --timeout-method=thread \
            -o faulthandler_timeout=150 \
            -p no:cacheprovider \
            -v

  # PRD-234 S1b — the CLI host, driven end to end against a fake `claude` that
  # behaves like the interactive CLI (hooks over the settings file, a transcript
  # where Claude Code writes it, refuses -p/--bare). Stdlib + pytest; no services.
  cli-host-tests:
    name: CLI host (PRD-234) — fake-claude end to end (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/cli-host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run the CLI host suite
        run: pytest -q tests

  # PRD-247: the simulation harness's own unit tests (tests/sim/tests). Pure
  # standard library, no database, no platform — parsers, pack validation,
  # scoring, the answerer and the plist builder. --noconftest keeps the root
  # tests/conftest.py (python-dotenv, Railway .env) out of it.
  sim-units:
    name: sim harness units (stdlib)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest==8.3.4
      - name: Run sim unit tests
        run: python -m pytest tests/sim/tests --noconftest --import-mode=importlib -q -p no:cacheprovider
