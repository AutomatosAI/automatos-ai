name: test

# PRD-142 Wave 2 (W2-S3) — the Test Net's enforcement gate.
#
# Runs the orchestrator pytest suite against a real Postgres service so
# DB-touching tests connect instead of hanging. (W2-S2 traced a pre-existing
# hang in test_82c_wiring to psycopg2.connect blocking forever when no
# Postgres is present — see that test's decompose path.) A per-test timeout
# is the safety net: any future hang fails fast instead of burning the whole
# job.
#
# Triggers on pull_request (the merged result) and on push to main only. A
# push to every branch ran the whole net twice per PR commit (the push run and
# the PR run sit on different refs, so neither cancelled the other), and with
# the account's 20 concurrent jobs PRs queued 30-45 minutes before a job
# started. A branch gets the net by opening a (draft) PR; the Ralph runner
# opens one right after seeding a wave. workflow_dispatch runs it by hand.
# Concurrency cancels superseded runs on the same ref so rapid pushes don't queue.
#
# The path-gated lanes (the backend test shards, the image build, the frontend,
# the CLI host, the sim units) run on a PR only when it touches what they read —
# the `changes` job decides — and always on main.
#
# Introduced NON-REQUIRED on purpose. The net is expected to surface
# pre-existing gaps that Wave 2 (WS-G golden journeys, WS-H untested
# primitives, WS-I regressions) will close. Flipping this to a required
# check in branch protection is a deliberate follow-up, made once the suite
# is green — that flip is the repo admin's call, not this workflow's.

on:
  push:
    branches:
      - main
  # Any base branch, so a PR stacked on another PR (a Ralph wave) is checked too.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which path-gated lanes this run needs. On a PR it lists the PR's files
  # (renames count by both names) and matches each lane's paths; on push to main
  # and on a manual run every lane runs. If the file list can't be read, or the
  # API truncates it (3000 files), every lane runs: a gap here only costs time.
  #
  # Gerard, 8 Oct ("it's getting so so slow to pass a PR"): the backend suite is a
  # lane too. scripts/ci/backend_test_plan.py reads the PR's files: anything
  # outside frontend/, docs/, graphify-out/, e2e/, .github/ (not this file) and a
  # top-level *.md runs every test, in BACKEND_SHARDS parallel shards; a PR inside
  # them runs, in one shard, only the test files that name what it touched; a PR
  # no test reads runs none. The backend's non-required lanes follow the full scope.
  changes:
    name: Which lanes this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prod_images: ${{ steps.match.outputs.prod_images }}
      frontend: ${{ steps.match.outputs.frontend }}
      cli_host: ${{ steps.match.outputs.cli_host }}
      sim: ${{ steps.match.outputs.sim }}
      backend_mode: ${{ steps.match.outputs.backend_mode }}
      backend_keywords: ${{ steps.match.outputs.backend_keywords }}
      backend_shards: ${{ steps.match.outputs.backend_shards }}
      backend_shard_count: ${{ steps.match.outputs.backend_shard_count }}
    steps:
      # The planner and the test files it searches; nothing else is needed here.
      - name: Checkout (the test files and the planner)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            orchestrator/tests
            scripts/ci

      - id: match
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BACKEND_SHARDS: 4
          # What the three default-args builds bake: Dockerfiles, dependency
          # manifests, the frontend edition literal, the worker image.
          PROD_IMAGE_PATHS: >-
            ^frontend/(Dockerfile|\.dockerignore|package(-lock)?\.json|next\.config\.[a-z]+|lib/auth-edition\.ts)$|^orchestrator/(Dockerfile|\.dockerignore|requirements[^/]*\.txt|pyproject\.toml)$|^services/workspace-worker/|^\.github/workflows/test\.yml$
          # The frontend lane also reads the committed route manifest (route-contract).
          FRONTEND_PATHS: ^frontend/|^orchestrator/reports/route-manifest\.json$|^\.github/workflows/test\.yml$
          CLI_HOST_PATHS: ^services/cli-host/|^\.github/workflows/test\.yml$
          SIM_PATHS: ^tests/sim/|^\.github/workflows/test\.yml$
        run: |
          set -euo pipefail
          full_backend() {
            echo "backend_mode=full"
            echo "backend_keywords="
            echo "backend_shards=[$(seq -s, 0 $((BACKEND_SHARDS - 1)))]"
            echo "backend_shard_count=$BACKEND_SHARDS"
          }
          all() {
            { printf '%s=true\n' prod_images frontend cli_host sim; full_backend; } | tee -a "$GITHUB_OUTPUT"
            echo "every lane runs: $1"
          }
          if [ "$EVENT" != "pull_request" ]; then all "$EVENT"; exit 0; fi
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)'); then
            all "the PR's file list could not be read"; exit 0
          fi
          if [ "$(wc -l <<< "$files")" -ge 3000 ]; then all "the PR lists 3000+ files"; exit 0; fi
          # A here-string, not a pipe: under pipefail grep -q closing a pipe early reads as no match.
          lane() { if grep -qE "$2" <<< "$files"; then echo "$1=true"; else echo "$1=false"; fi; }
          {
            lane prod_images "$PROD_IMAGE_PATHS"
            lane frontend "$FRONTEND_PATHS"
            lane cli_host "$CLI_HOST_PATHS"
            lane sim "$SIM_PATHS"
          } | tee -a "$GITHUB_OUTPUT"
          scope=$(python3 scripts/ci/backend_test_plan.py scope <<< "$files")
          echo "backend scope: $scope"
          mode=$(jq -r .mode <<< "$scope")
          if [ "$mode" = full ]; then
            full_backend | tee -a "$GITHUB_OUTPUT"
          else
            # One shard: a selection is a few dozen files. `none` keeps a valid
            # matrix; the shard job's `if` skips it.
            printf 'backend_mode=%s\nbackend_keywords=%s\nbackend_shards=[0]\nbackend_shard_count=1\n' \
              "$mode" "$(jq -r '.keywords | join(",")' <<< "$scope")" | tee -a "$GITHUB_OUTPUT"
          fi

  # The backend suite (tests/), one shard per matrix entry, each with its own
  # Postgres and MinIO so no two shards share state. scripts/ci/backend_test_plan.py
  # gives every test file to exactly one shard, balanced by the seconds recorded in
  # scripts/ci/backend_test_durations.json: the shards together run every test the
  # single job ran (14,181 in 24-28 min against a 30-min timeout, 7 Oct). The
  # required check is the `orchestrator-tests` job below, which reads their result.
  orchestrator-tests-shard:
    name: orchestrator-tests shard ${{ matrix.shard }}/${{ needs.changes.outputs.backend_shard_count }} (${{ needs.changes.outputs.backend_mode }})
    needs: changes
    if: needs.changes.outputs.backend_mode == 'full' || needs.changes.outputs.backend_mode == 'select'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.backend_shards) }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Hold the job until Postgres can actually accept connections.
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Wire config.get_database_url() at the ephemeral service above. These
      # are throwaway CI credentials for a container that lives only for the
      # job — not secrets, and never reused.
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development
      # PRD-175: run the suite in the local edition so the anonymous dev-fallback
      # is on (REQUIRE_AUTH=false). Without it, saas-default requires Clerk creds
      # and every unauthenticated endpoint test 401s.
      AUTH_EDITION: local
      # AUTH_EDITION=local's boot guard (config.validate_auth_edition) requires
      # DEFAULT_WORKSPACE_ID — the single local workspace the anonymous session
      # resolves to. init_test_db.py seeds a workspaces row with this exact id so
      # the anonymous-fallback resolution finds a real workspace. Fixed throwaway
      # UUID for the ephemeral CI DB.
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"
      SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.backend_shard_count }}
      KEYWORDS: ${{ needs.changes.outputs.backend_keywords }}
      SYSTEM_PACKAGES: libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 libffi-dev libmagic1 ghostscript fonts-dejavu-core

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      # The downloaded .debs, kept a week: on 7 Oct (run 37689615384) the Azure
      # Ubuntu mirror served ghostscript and its libraries at 58 kB/s, 5 min 18 s
      # for 18.5 MB, and the job hit its timeout. The week in the key refreshes them.
      - name: The week, for the system-library cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the system-library downloads
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}-${{ steps.week.outputs.week }}
          restore-keys: apt-archives-${{ runner.os }}-

      # weasyprint (libpango/libcairo) and python-magic (libmagic) crash on
      # *import*, not at install, when their C libraries are missing — which
      # would break pytest collection before a single test runs. Install the
      # shared libs the dependency set needs at import time.
      - name: Install system libraries
        run: |
          # The runner image carries third-party apt sources (Google Chrome,
          # Microsoft); a stale index there ("Hash Sum mismatch", 2026-09-09) makes
          # apt-get update exit 100 and bash -e kills the step before a single
          # test runs. The packages below come from Ubuntu's own archive, so a
          # partial update is fine — install fails loudly if THAT index is stale.
          sudo apt-get update || echo "::warning::apt-get update reported errors (a third-party index?) — continuing with the indexes that did refresh"
          # fonts-dejavu-core: the image's PDF font, so F298's checklist boxes print here too.
          # A .deb already in ~/apt-archives at the wanted version is not downloaded again.
          mkdir -p ~/apt-archives/partial
          # shellcheck disable=SC2086 # the package list splits on spaces on purpose
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" $SYSTEM_PACKAGES
          sudo rm -f ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # PRD-140 hierarchy audit (F147): every mutating platform action is
      # hierarchy-gated or allow-listed with its reason. A new unlisted
      # mutator fails the job here. Once per run: the first shard.
      - name: Hierarchy gate audit
        if: matrix.shard == 0
        run: python scripts/check_hierarchy_gate.py

      - name: Initialise test database schema
        run: python scripts/init_test_db.py

      # PRD-251 US-202 (S3.4, D9): the Socials media-hosting test presigns links
      # against a real object store and fetches them over HTTP (a HEAD, a Range
      # GET). GitHub service containers cannot pass MinIO its `server /data`
      # command, so this step starts it. MinIO no longer publishes its community
      # images: quay.io/minio/minio refuses anonymous pulls (2026-09-28), Docker
      # Hub's minio/minio is gone, and dl.min.io answers 410. The image is
      # pgsty/minio, the community fork built from the same code with the same
      # entrypoint, pinned by tag and by digest. The root credentials are
      # throwaway values for a container that lives only for this job; the test
      # step below gets the same ones.
      - name: Start MinIO (the Socials media-hosting test)
        env:
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-pass
        run: |
          docker run -d --name socials-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then echo "MinIO is live"; exit 0; fi
            sleep 2
          done
          docker logs socials-minio
          echo "::error::MinIO never answered /minio/health/live"
          exit 1

      - name: This shard's test files
        run: |
          python ../scripts/ci/backend_test_plan.py plan --shard "$SHARD" --keywords "$KEYWORDS" > "$RUNNER_TEMP/shard-tests.txt"
          echo "shard $SHARD (keywords: ${KEYWORDS:-none, every test file}): $(grep -c . "$RUNNER_TEMP/shard-tests.txt" || true) test files"

      # The required gate stays pinned to `tests` (its shard of it): PRD-182 W12-S2
      # widened pytest.ini `testpaths` (so `--collect-only` shows the module trees),
      # but the orphaned trees run in the separate `orchestrator-module-tests` job.
      #
      # PRD-182 W12-S4 (F092): coverage is MEASURED on the suite that actually runs,
      # via pytest-cov + .coveragerc. Each full-scope shard keeps its data file; the
      # `orchestrator-tests` job combines them for the ratchet.
      - name: Run test net (with coverage)
        env:
          # The MinIO started above (tests/test_prd251w2_media_hosting.py fails,
          # never skips, in CI without it).
          SOCIALS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          SOCIALS_TEST_S3_ACCESS_KEY: ci-minio
          SOCIALS_TEST_S3_SECRET_KEY: ci-minio-pass
        run: |
          mapfile -t files < "$RUNNER_TEMP/shard-tests.txt"
          if [ "${#files[@]}" -eq 0 ]; then echo "No test file in this shard."; exit 0; fi
          pytest "${files[@]}" \
            --timeout=60 \
            --timeout-method=thread \
            -o faulthandler_timeout=90 \
            -p no:cacheprovider \
            --cov \
            --cov-config=.coveragerc \
            --cov-report= \
            -v
          mv .coverage ".coverage.shard${{ matrix.shard }}"
          python -c "import coverage; print(coverage.__version__)" > coverage-version.txt

      - name: Keep this shard's coverage data
        if: needs.changes.outputs.backend_mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            orchestrator/.coverage.shard${{ matrix.shard }}
            orchestrator/coverage-version.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The required check (the Protect-Main ruleset names `orchestrator-tests`). It
  # always reports: green when every shard passed, or when no backend test reads
  # what the PR changed; red when a shard failed or the scope is unknown. On a
  # full-scope run it combines the shards' coverage and runs the ratchet.
  orchestrator-tests:
    needs: [changes, orchestrator-tests-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ needs.changes.outputs.backend_mode }}
    steps:
      - name: Every shard passed, or this change needs no backend test
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.orchestrator-tests-shard.result }}
          KEYWORDS: ${{ needs.changes.outputs.backend_keywords }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::'Which lanes this change needs' ended $CHANGES: the backend scope is unknown, so there is no verdict."
            exit 1
          fi
          if [ "$MODE" = none ]; then echo "No backend test reads what this PR changed ($KEYWORDS): none to run."; exit 0; fi
          if [ "$SHARDS" != success ]; then echo "::error::the backend test shards ended $SHARDS."; exit 1; fi
          echo "Every shard passed (scope: $MODE${KEYWORDS:+, keywords $KEYWORDS})."

      - name: Checkout
        if: env.MODE == 'full'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.MODE == 'full'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The shards' coverage data
        if: env.MODE == 'full'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: orchestrator
          merge-multiple: true

      - name: Combine the shards' coverage
        if: env.MODE == 'full'
        working-directory: orchestrator
        run: |
          python -m pip install "coverage==$(head -n 1 coverage-version.txt)"
          python -m coverage combine --rcfile=.coveragerc .coverage.shard*
          python -m coverage xml --rcfile=.coveragerc
          python -m coverage report --rcfile=.coveragerc --skip-covered | tail -n 3

      # The ratchet. CI is ephemeral, so the floor only ENFORCES once it is
      # committed: while .coverage-baseline holds the SEED token this step prints
      # the MEASURED percentage and passes (so "CI reports a coverage number" is
      # true from day one). To ARM the ratchet, read the number this step prints,
      # then commit it into orchestrator/.coverage-baseline (replacing SEED) —
      # from then on a drop below it fails the build. Ratchet the committed number
      # up toward the 80% doctrine as coverage improves.
      - name: Coverage ratchet (measured baseline)
        if: env.MODE == 'full'
        working-directory: orchestrator
        run: python scripts/check_coverage_baseline.py

  # AGENTS.md → the engineering rules, held on the lines a change touches (a ratchet:
  # existing code meets them the next time someone edits it). ruff runs through
  # diff-quality (changed lines only; ruff.toml holds the rules), then the code-shape
  # check (function length, nesting, file size). Pinned tools, no app dependencies.
  # The base is the pull request's base branch, or main on a branch push.
  code-standards:
    name: Code standards on changed lines (ruff, function length, nesting) (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history, for the diff against the base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the linters (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.9" "diff-cover==10.6.0"

      - name: Fetch the base branch
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: ruff on changed lines (diff-quality)
        run: diff-quality --violations=ruff.check --compare-branch="origin/${GITHUB_BASE_REF:-main}" --fail-under=100

      - name: Function length, nesting and file size on changed Python
        run: python scripts/ci/check_changed_code_shape.py --base "origin/${GITHUB_BASE_REF:-main}"

  # PRD-160 S5 — NL2SQL regression eval. NON-REQUIRED (same posture as the test
  # net). Self-contained: it seeds an in-memory SQLite DB, so it needs no
  # Postgres service. The always-on checks prove every golden SQL executes and
  # passes the S2 validator; the generation-accuracy eval (no-regression vs
  # baseline.json) runs only when RUN_NL2SQL_EVAL=1 with an LLM configured.
  nl2sql-eval:
    name: NL2SQL eval (non-required)
    needs: changes
    if: needs.changes.outputs.backend_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself uses SQLite, not these. Flip RUN_NL2SQL_EVAL on (with an
      # embedding/LLM provider) to run the full generation-accuracy eval.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development
      # PRD-175: run the suite in the local edition so the anonymous dev-fallback
      # is on (REQUIRE_AUTH=false). Without it, saas-default requires Clerk creds
      # and every unauthenticated endpoint test 401s.
      AUTH_EDITION: local
      # AUTH_EDITION=local's boot guard requires DEFAULT_WORKSPACE_ID; set it so
      # any config.validate_auth_edition() reached during the eval passes. The
      # eval is SQLite-only and never resolves this workspace, but the flag must
      # be internally consistent with AUTH_EDITION=local (mirrors the test job).
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install system libraries
        run: |
          # The runner image carries third-party apt sources (Google Chrome,
          # Microsoft); a stale index there ("Hash Sum mismatch", 2026-09-09) makes
          # apt-get update exit 100 and bash -e kills the step before a single
          # test runs. The packages below come from Ubuntu's own archive, so a
          # partial update is fine — install fails loudly if THAT index is stale.
          sudo apt-get update || echo "::warning::apt-get update reported errors (a third-party index?) — continuing with the indexes that did refresh"
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev libmagic1 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NL2SQL eval
        run: |
          pytest tests/nl2sql_eval \
            --timeout=120 \
            --timeout-method=thread \
            -p no:cacheprovider \
            -v

  # PRD-177 S6 — operating-graph uplift eval. NON-REQUIRED (same posture as the
  # test net). The moat business gate: measures learned-edge tool-selection
  # accuracy vs BM25 + embedding baselines, PER TENANT, and prints the uplift.
  # Pure Python stdlib + the bundled eval_set fixture — no Postgres, no LLM, no
  # embedding provider. A sub-threshold number is a valid, honest outcome and
  # NEVER fails the job (the number is the deliverable); TOOL_ROUTING_GRAPH is
  # only flipped on once this clears the gate against PRODUCTION per-tenant
  # telemetry, not the bundled fixture.
  operating-graph-uplift-eval:
    name: Operating-graph uplift eval (non-required)
    needs: changes
    if: needs.changes.outputs.backend_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself reads only the jsonl fixture and stdlib.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the uplift harness self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_prd177_uplift_eval.py -q -p no:cacheprovider

      # A sub-threshold uplift is a BUSINESS signal, not a CI failure — the
      # number is the deliverable. The harness already exits 0 on a low uplift
      # (evals/operating_graph_uplift.main returns 0 always); continue-on-error
      # is belt-and-braces so this informational emit can never redden the job.
      # The self-tests step above stays the real gate.
      - name: Emit the per-tenant uplift number (informational)
        continue-on-error: true
        run: |
          python -m evals.operating_graph_uplift --json

  # PRD-185 S10 — the first memory quality number: recall@5 / MRR + a
  # with-vs-without task-lift of the memory retriever over a labelled workspace
  # gold-set. NON-REQUIRED, same posture as the uplift eval above — the number is
  # the deliverable, a sub-threshold recall is an honest outcome, not a CI
  # failure. The real gate is this harness run against a LIVE workspace snapshot
  # with the production retriever injected (--corpus + retriever_factory).
  memory-recall-eval:
    name: Memory-recall eval (non-required)
    needs: changes
    if: needs.changes.outputs.backend_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself reads only the jsonl fixtures and stdlib.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the memory-recall harness self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_p2w0_memory_recall.py -q -p no:cacheprovider

      # A sub-threshold recall is a BUSINESS signal, not a CI failure — the
      # number is the deliverable. The harness already exits 0 on a low recall
      # (evals/memory_recall.main returns 0 always); continue-on-error is
      # belt-and-braces so this informational emit can never redden the job.
      # The self-tests step above stays the real gate.
      - name: Emit the per-tenant memory-recall number (informational)
        continue-on-error: true
        run: |
          python -m evals.memory_recall --json

  # PRD-198 S1 — the Graphiti-vs-baseline A/B gate. NON-REQUIRED, exit-0:
  # prints the honest verdict — PENDING until the S10 memory baseline is
  # frozen (docs/runbooks/S10-MEMORY-BASELINE-FREEZE.md) and a graphiti
  # treatment run exists (S2-gated); uplift-vs-margin after. Pure stdlib +
  # committed artifacts — no Postgres, no LLM, no graph store. The gate can
  # NEVER read green ahead of the measurement (the PRD's whole discipline).
  graphiti-gate:
    name: Graphiti-vs-baseline gate (non-required)
    needs: changes
    if: needs.changes.outputs.backend_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the gate self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_prd198_graphiti_gate.py -q -p no:cacheprovider

      - name: Emit the gate verdict (informational)
        continue-on-error: true
        run: |
          python -m evals.graphiti_vs_baseline

  # PRD-188 S5 (P2-07) — the RAG quality number: document-level recall@5 / MRR
  # per retrieval variant (dense proxy, BM25, hybrid RRF) over a labelled
  # workspace gold-set, including the Internal-Audit-v1 phrasing-sensitivity
  # slice (natural vs keyword pairs). NON-REQUIRED, same posture as the memory
  # eval above — the number is the deliverable, a sub-threshold recall is an
  # honest outcome, not a CI failure. The real verdict is the --live lever grid
  # (rerank / hybrid / query-enhancement toggled) against a provisioned
  # workspace snapshot.
  retrieval-recall-eval:
    name: Retrieval-recall eval (non-required)
    needs: changes
    if: needs.changes.outputs.backend_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Dummy values keep any import-time config resolution from failing; the
      # eval itself reads only the jsonl fixtures and stdlib.
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the retrieval-recall harness self-tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest tests/test_p2w1_retrieval_recall.py -q -p no:cacheprovider

      # A sub-threshold recall is a BUSINESS signal, not a CI failure — the
      # number is the deliverable. The harness already exits 0 on a low recall
      # (evals/retrieval_recall.main returns 0 always); continue-on-error is
      # belt-and-braces so this informational emit can never redden the job.
      # The self-tests step above stays the real gate.
      - name: Emit the per-variant retrieval-recall number (informational)
        continue-on-error: true
        run: |
          python -m evals.retrieval_recall --json

  # PRD-176 F010 / PRD-209 S2 — the reliability bar: a fresh database reaches
  # exactly ONE head via the SUPPORTED fresh-clone path. NON-REQUIRED (same
  # posture as the test net) until the owner flips branch protection (Q2).
  #
  # Two gates:
  #   1. single-head invariant — asserts `alembic heads` returns exactly one
  #      revision. The 12-head forest was collapsed by prior merge revisions
  #      (PRD-176/203/204/230 …), so this is the permanent regression guard
  #      against a new divergent head. It needs no database.
  #   2. fresh-clone boot path (PRD-209 S2) — the approved shape is merge-to-one-
  #      head (done) + a stamped initdb, NOT a full-forest squash (deleting
  #      revision files would strand Railway prod). So this gate reproduces what
  #      a fresh compose volume actually does: load init_complete_schema.sql
  #      (which CREATEs the schema AND stamps alembic_version at the head), then
  #      run `alembic upgrade heads` — a no-op at head. A pure from-base replay
  #      is NOT the compose path and is deliberately not tested here (it crashes
  #      on tables that are ALTER-ed but never CREATE-d in the historical forest).
  #      Both gates are HARD (no continue-on-error) as of PRD-209 US-004.
  alembic-from-zero:
    name: Alembic from-zero — exactly one head (non-required)
    needs: changes
    if: needs.changes.outputs.backend_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # pgvector, not stock postgres — the schema declares vector columns, so a
      # from-zero replay needs the extension available.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: alembic_zero_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d alembic_zero_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/alembic_zero_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: alembic_zero_db
      ENVIRONMENT: development

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install system libraries
        run: |
          # The runner image carries third-party apt sources (Google Chrome,
          # Microsoft); a stale index there ("Hash Sum mismatch", 2026-09-09) makes
          # apt-get update exit 100 and bash -e kills the step before a single
          # test runs. The packages below come from Ubuntu's own archive, so a
          # partial update is fine — install fails loudly if THAT index is stale.
          sudo apt-get update || echo "::warning::apt-get update reported errors (a third-party index?) — continuing with the indexes that did refresh"
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev libmagic1 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Gate 1 — the single-head invariant (Step 1, green now, no DB needed).
      - name: Assert exactly one Alembic head
        run: |
          HEADS="$(alembic heads 2>/dev/null | grep -c '(head)')"
          echo "alembic head count: ${HEADS}"
          alembic heads
          if [ "${HEADS}" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found ${HEADS}. A new divergent head was introduced — add a merge revision."
            exit 1
          fi

      # Enable pgvector so the from-zero replay's vector columns resolve.
      - name: Enable pgvector extension
        env:
          PGPASSWORD: test
        run: |
          psql -h 127.0.0.1 -U test -d alembic_zero_db -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # Gate 2 — the SUPPORTED fresh-clone boot path (PRD-209 S2, revised
      # 2026-08-29): scripts/init_fresh_db.py builds the CI-proven schema
      # (create_all + raw-DDL extras) on the empty DB and stamps heads; then
      # `alembic upgrade heads` must be a no-op, and the tables the live local
      # test found MISSING from the old snapshot must exist. The old
      # init_complete_schema.sql was a stale hand-maintained copy (fresh DBs
      # got 107 of prod's ~152 tables); it is deleted — the 41 orphan-root
      # revisions make a from-empty forest replay impossible until the lineage
      # is repaired (recorded follow-on in the PRD addendum).
      # HARD (no continue-on-error) as of PRD-209 US-004.
      - name: Fresh-clone boot path — init_fresh_db (create_all + stamp), then upgrade heads
        env:
          PGPASSWORD: test
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/alembic_zero_db
        run: |
          echo "Building the fresh schema via scripts/init_fresh_db (CI-proven path)..."
          python -m scripts.init_fresh_db
          echo "Verifying the stamp equals the single alembic head..."
          STAMP="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc 'SELECT version_num FROM alembic_version;')"
          HEAD="$(alembic heads 2>/dev/null | awk 'NR==1{print $1}')"
          echo "stamp=[${STAMP}] alembic head=[${HEAD}]"
          if [ "${STAMP}" != "${HEAD}" ]; then
            echo "::error::stamp '${STAMP}' != alembic head '${HEAD}' — init_fresh_db stamped somewhere other than the head."
            exit 1
          fi
          echo "Running 'alembic upgrade heads' — must be a no-op at head..."
          alembic upgrade heads
          echo "Asserting the tables the stale snapshot was missing exist on the fresh path..."
          for t in notifications personas channel_connections marketplace_widgets workspaces document_chunks codegraph_projects; do
            FOUND="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc "SELECT to_regclass('${t}');" | tr -d ' ')"
            if [ -z "${FOUND}" ]; then
              echo "::error::fresh schema is missing table '${t}' — the create_all path regressed."
              exit 1
            fi
          done
          echo "Asserting document_chunks carries what ingestion writes (#825)..."
          for c in embedding parent_content headers chunk_type workspace_id; do
            FOUND="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc "SELECT 1 FROM information_schema.columns WHERE table_name='document_chunks' AND column_name='${c}';" | tr -d ' ')"
            if [ -z "${FOUND}" ]; then
              echo "::error::fresh schema is missing document_chunks.${c} — every document upload fails without it."
              exit 1
            fi
          done
          # ingestion's own local-mode INSERT shape (modules/rag/ingestion/manager.py), a 2048-d vector
          psql -h 127.0.0.1 -U test -d alembic_zero_db -v ON_ERROR_STOP=1 -c "BEGIN; INSERT INTO document_chunks (document_id, chunk_index, content, embedding, metadata, parent_content, headers, workspace_id) VALUES (NULL, 0, 'x', (SELECT array_fill(0.1::real, ARRAY[2048]))::vector, '{}', NULL, '{}', '00000000-0000-0000-0000-0000000000c1'); ROLLBACK;"
          echo "Asserting what orphan-root ORDERING used to lose on a fresh path (PRD-233 live-test finding)..."
          # prd82a (a root) adds agent_reports.orchestration_task_id before agent_reports exists in the
          # replay; prd133b (another root) builds v_workspace_outputs on it. The generator's
          # model-column reconciliation + idempotent raw-SQL re-run passes must leave both present.
          for chk in "v_workspace_outputs" ; do
            FOUND="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc "SELECT to_regclass('${chk}');" | tr -d ' ')"
            if [ -z "${FOUND}" ]; then
              echo "::error::fresh schema is missing '${chk}' — the idempotent raw-SQL (views) pass regressed."
              exit 1
            fi
          done
          COL="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc "SELECT column_name FROM information_schema.columns WHERE table_name='agent_reports' AND column_name='orchestration_task_id';" | tr -d ' ')"
          if [ -z "${COL}" ]; then
            echo "::error::fresh schema is missing agent_reports.orchestration_task_id — the model-column reconciliation pass regressed."
            exit 1
          fi
          ROWS="$(psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc 'SELECT count(*) FROM v_workspace_outputs;' | tr -d ' ')"
          echo "v_workspace_outputs answers (rows=${ROWS})"
          echo "Fresh-clone boot path succeeded: complete schema + stamp + no-op upgrade."

      # A first boot whose build dies partway (Postgres restarting, the host
      # stopping) leaves alembic_version behind. The next boot must finish the
      # build, not serve it: before the incomplete-build marker it skipped the
      # fresh path, and `upgrade heads` then failed for ever or served without the
      # columns stages 3-6 add. Proven here against the clean build above.
      - name: Interrupted fresh build — the next boot resumes it to the same schema
        env:
          PGPASSWORD: test
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/interrupted_db
        run: |
          psql -h 127.0.0.1 -U test -d alembic_zero_db -c "CREATE DATABASE interrupted_db;"
          echo "First boot: the build dies after stage 2 (alembic_version stamped, repairs not run)..."
          if python - <<'PY'
          import scripts.generate_schema_baseline as gsb
          from sqlalchemy import create_engine
          from config import config
          def interrupted(engine, script):
              raise RuntimeError("simulated interruption before stages 3-6")
          gsb._repair_passes = interrupted
          gsb.build_schema(create_engine(config.DATABASE_URL))
          PY
          then
            echo "::error::the simulated interruption did not interrupt the build"; exit 1
          fi
          MARK="$(psql -h 127.0.0.1 -U test -d interrupted_db -tAc "SELECT to_regclass('automatos_fresh_init_incomplete');" | tr -d ' ')"
          if [ -z "${MARK}" ]; then
            echo "::error::an interrupted build left no incomplete-build marker"; exit 1
          fi
          echo "Next boot: init_fresh_db must resume the build..."
          python -m scripts.init_fresh_db
          MARK="$(psql -h 127.0.0.1 -U test -d interrupted_db -tAc "SELECT to_regclass('automatos_fresh_init_incomplete');" | tr -d ' ')"
          if [ -n "${MARK}" ]; then
            echo "::error::the resumed build left its marker behind"; exit 1
          fi
          alembic upgrade heads
          # Indexes are compared by DEFINITION, not name: the residual pass re-runs
          # creator revisions whose unnamed unique constraints Postgres names
          # users_email_key, _key1, …, so every fresh build already carries
          # redundant copies, and a build resumed after that pass carries one more.
          SCHEMA="SELECT table_name||'.'||column_name||' '||data_type FROM information_schema.columns WHERE table_schema='public' UNION SELECT 'index '||regexp_replace(indexdef, 'INDEX \S+ ON', 'INDEX ON') FROM pg_indexes WHERE schemaname='public' UNION SELECT 'view '||table_name FROM information_schema.views WHERE table_schema='public' UNION SELECT 'version '||version_num FROM alembic_version ORDER BY 1"
          psql -h 127.0.0.1 -U test -d alembic_zero_db -tAc "${SCHEMA}" > clean.txt
          psql -h 127.0.0.1 -U test -d interrupted_db -tAc "${SCHEMA}" > resumed.txt
          if ! diff clean.txt resumed.txt; then
            echo "::error::the resumed build differs from a clean one (diff above)"; exit 1
          fi
          echo "Interrupted build resumed: $(wc -l < resumed.txt) columns/indexes/views/versions identical to a clean build."

  # Prod-image parity (2026-08-30, after #650 shipped the local edition's
  # Dockerfile defaults to production — Clerk outage, #668). Railway builds the
  # three Dockerfiles with NO build args (railway.json: DOCKERFILE, target
  # production), so this lane builds exactly that and checks what got baked:
  # the frontend's edition literal, the backend's graph extras, the worker's
  # browser. Non-required like the other lanes; the required flip is the repo
  # admin's call.
  prod-image-parity:
    name: Prod images built with default args carry production behaviour (non-required)
    needs: changes
    if: needs.changes.outputs.prod_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Frontend — edition baked with no args must be saas
        run: |
          docker build --target production -t parity-fe frontend/
          # lib/auth-edition.ts compiles to `"local"===<INLINED>.trim().toLowerCase()?"local":"saas"`
          # (Next folds the `|| ''` away), so the baked edition is the literal on the right.
          LOCAL=$(docker run --rm parity-fe sh -c 'grep -rlF "\"local\"===\"local\".trim()" .next 2>/dev/null | wc -l')
          SAAS=$(docker run --rm parity-fe sh -c 'grep -rlF "\"local\"===\"saas\".trim()" .next 2>/dev/null | wc -l')
          echo "chunks with local literal: $LOCAL; with saas literal: $SAAS"
          if [ "$LOCAL" != "0" ] || [ "$SAAS" = "0" ]; then
            echo "::error::the production frontend image bakes the LOCAL edition — check ARG NEXT_PUBLIC_AUTH_EDITION in frontend/Dockerfile"
            exit 1
          fi
      - name: Backend — graph extras present with no args
        run: |
          docker build --target production -t parity-be orchestrator/
          docker run --rm parity-be python -c "import graspologic, graphify.cluster; print('leiden extras present')"
      - name: Worker — headless browser present with no args
        run: |
          docker build -t parity-wk services/workspace-worker/
          # --entrypoint: the worker image's entrypoint.sh execs the worker itself
          # (ignoring CMD) and dies on Redis — we only want to look inside the image.
          docker run --rm --entrypoint sh parity-wk -c 'ls /opt/playwright-browsers | grep -q chromium && echo "chromium present"'

  # The media-render lanes (the image, the fixture renders, the seeded templates in 4 shards)
  # run on demand only, in .github/workflows/media-render.yml (Gerard, 7 Oct 2026: not on
  # every pull request; run it when the Socials feature changes).

  # PRD-209 S4 (F051 / deployability J4) — the schema-drift net for the "four
  # writers of schema truth" (init_complete_schema.sql, the Alembic migration
  # forest, create_all-at-boot, and inline ALTERs inside migrations). No lane
  # caught July's ALTER-ed-but-never-CREATE-d table, which crashed a from-base
  # replay with `relation "..." does not exist` (the very failure the from-zero
  # lane above sidesteps by booting via init-SQL+stamp instead of a replay).
  #
  # This lane runs scripts/ci/schema_drift_check.py — a PURE, static parse (no
  # database, no Base.metadata import, no live Alembic) asserting that every table
  # a migration ALTERs / add_columns / indexes / foreign-keys is also CREATE-d by
  # some migration or by init_complete_schema.sql. Green today (the known
  # create_all-only orphans are a documented baseline in the script); RED on the
  # NEXT new orphan. Stdlib only — no pip install, no Postgres service, so it is
  # fast and cannot flake. The pure diff core and the planted-divergence fixtures
  # live in orchestrator/tests/test_prd209_schema_drift.py (run by the required
  # pytest suite, so a new orphan also reddens that suite).
  #
  # NON-REQUIRED at introduction (the workflow's established posture); flipping it
  # to a required check once green is the repo admin's call (PRD-209 Q2).
  schema-drift:
    name: Schema-drift check (four writers) (non-required)
    needs: changes
    if: needs.changes.outputs.backend_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # HARD gate — red on a table ALTER-ed by a migration but CREATE-d by no
      # migration and not by init_complete_schema.sql (beyond the baseline).
      - name: Schema-drift check (ALTER-ed-but-never-CREATE-d tables)
        run: python scripts/ci/schema_drift_check.py

  # PRD-182 W12-S1 (F034) + S3 (F044) — the frontend CI lane. 148k lines of TS
  # were entirely ungated: `next.config.js` sets `ignoreBuildErrors:true` /
  # `ignoreDuringBuilds:true`, so `next build` never type-checks or lints, and
  # no job ran vitest. This lane closes that, BASELINED so it does not block on
  # the ~hundreds of pre-existing errors:
  #   * vitest  — HARD gate (the suite is green today: 17 files / 90 tests).
  #   * tsc     — baselined gate: fails only if the error count REGRESSES above
  #               .tsc-baseline.json (measured floor). `ignoreBuildErrors` stays
  #               true for deploy; this is the separate enforcement lane.
  #   * eslint  — reports (non-blocking): 208 pre-existing problems surface in
  #               the log without failing the lane.
  #   * route-contract (S3) — HARD gate on a NEW frontend call to a backend path
  #               absent from route-manifest.json (35 pre-existing drifts are
  #               baselined in scripts/route-contract-baseline.json).
  #
  # NON-REQUIRED at introduction (the workflow's established posture); flip to a
  # required check in branch protection once it has run green — that flip is the
  # repo admin's call (see S5 / F057 in the PRD).
  #
  # Install uses `npm install`, not `npm ci`: the committed package-lock.json is
  # out of sync with package.json today (missing entries), which makes `npm ci`
  # fail on install. `npm install` reconciles the lockfile so the lane can run.
  frontend-ci:
    name: Frontend CI (tsc baselined, vitest, eslint, route-contract) (non-required)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # HARD gate — the real enforcement win. Must stay green.
      - name: Vitest
        run: npm run test

      # Baselined gate — fails only on a regression above the recorded floor.
      - name: TypeScript (tsc --noEmit, baselined)
        run: node scripts/tsc-baseline-check.js

      # Report-only — surfaces the pre-existing lint problems without blocking.
      - name: ESLint (report only)
        continue-on-error: true
        run: npx eslint . --ext .ts,.tsx

      # HARD gate — fails on a NEW frontend call to a non-existent backend path.
      - name: Frontend route-contract (consumes route-manifest.json)
        run: node scripts/check-route-contract.js

      # HARD gate on changed lines only (AGENTS.md → Code shape): function length
      # (components 150), depth, new-file size, and the apiClient-only rule that the
      # full ESLint run above only reports. Needs the base branch and enough history
      # for the merge-base.
      - name: Code shape and apiClient on changed lines (ESLint)
        run: |
          git fetch --no-tags --unshallow origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}" \
            || git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"
          node scripts/check-changed-lines-eslint.js "origin/${GITHUB_BASE_REF:-main}"

  # PRD-182 W12-S2 (F056) — the two orphaned backend test trees. The required
  # `orchestrator-tests` job only ever ran `tests/`; `modules/*/tests` (81 fns)
  # and `integrations/*/tests` (34 fns) were never collected. This job runs them
  # against the same Postgres service the required job uses. Some module tests
  # need services this job does not stand up (Redis, pgvector, the benchmark
  # stack), so it is introduced NON-REQUIRED — the workflow's standard posture —
  # and reports the true state; flip it required once green. `--collect-only`
  # (via the widened pytest.ini testpaths) now shows these trees regardless.
  orchestrator-module-tests:
    name: Orchestrator module + integration tests (F056) (non-required)
    needs: changes
    if: needs.changes.outputs.backend_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: test_db
      ENVIRONMENT: development
      AUTH_EDITION: local
      DEFAULT_WORKSPACE_ID: "00000000-0000-0000-0000-0000000000c1"

    defaults:
      run:
        working-directory: orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt

      - name: Install system libraries
        run: |
          # The runner image carries third-party apt sources (Google Chrome,
          # Microsoft); a stale index there ("Hash Sum mismatch", 2026-09-09) makes
          # apt-get update exit 100 and bash -e kills the step before a single
          # test runs. The packages below come from Ubuntu's own archive, so a
          # partial update is fine — install fails loudly if THAT index is stale.
          sudo apt-get update || echo "::warning::apt-get update reported errors (a third-party index?) — continuing with the indexes that did refresh"
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev libmagic1 ghostscript

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialise test database schema
        run: python scripts/init_test_db.py

      # Prove the trees are now collected (S2 acceptance) — visible in the log
      # even if a later runtime failure occurs.
      - name: Collect the previously-orphaned trees
        run: |
          pytest modules integrations \
            --collect-only -q -p no:cacheprovider | tail -40

      - name: Run module + integration tests
        run: |
          pytest modules integrations \
            --timeout=120 \
            --timeout-method=thread \
            -o faulthandler_timeout=150 \
            -p no:cacheprovider \
            -v

  # PRD-234 S1b — the CLI host, driven end to end against a fake `claude` that
  # behaves like the interactive CLI (hooks over the settings file, a transcript
  # where Claude Code writes it, refuses -p/--bare). Stdlib + pytest; no services.
  cli-host-tests:
    name: CLI host (PRD-234) — fake-claude end to end (non-required)
    needs: changes
    if: needs.changes.outputs.cli_host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/cli-host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run the CLI host suite
        run: pytest -q tests

  # #818: the CLI host on native Windows: ConPTY, the job objects, the hook pipe,
  # the login task's supervisor, and one whole ticket through a session. The rest
  # of the suite exercises Unix internals (/bin/sh, AF_UNIX, POSIX signals) and
  # runs on the Linux lane above.
  cli-host-windows:
    name: CLI host on Windows — ConPTY (non-required)
    needs: changes
    if: needs.changes.outputs.cli_host == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/cli-host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run the ported CLI host tests
        run: >-
          pytest -q tests/test_ptyproc.py tests/test_filelock.py tests/test_lifecycle.py
          tests/test_winservice.py tests/test_hook_pipe.py tests/test_platform_guard.py
          tests/test_session_on_windows.py

  # PRD-247: the simulation harness's own unit tests (tests/sim/tests). Pure
  # standard library, no database, no platform — parsers, pack validation,
  # scoring, the answerer and the plist builder. --noconftest keeps the root
  # tests/conftest.py (python-dotenv, Railway .env) out of it.
  sim-units:
    name: sim harness units (stdlib)
    needs: changes
    if: needs.changes.outputs.sim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest==8.3.4
      - name: Run sim unit tests
        run: python -m pytest tests/sim/tests --noconftest --import-mode=importlib -q -p no:cacheprovider
