<!DOCTYPE html>
<html>

<head>
    <title>Logo Test</title>
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }

        .test {
            margin: 20px 0;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }

        img {
            width: 64px;
            height: 64px;
            margin: 10px;
            border: 2px solid #444;
        }

        .error {
            color: #ff4444;
        }

        .success {
            color: #44ff44;
        }
    </style>
</head>

<body>
    <h1>Logo Service Test</h1>

    <div class="test">
        <h2>Discord Logos</h2>

            <h3>Logo.dev</h3>
            <img src="https://img.logo.dev/discord.com?token=pk_X-1ZO13CRGqjHaT7kdWFQ&size=128"
                onerror="this.nextElementSibling.textContent='❌ Failed'; this.style.display='none'"
                onload="this.nextElementSibling.textContent='✅ Loaded'">
            <span></span>
        </div>
        <div>
