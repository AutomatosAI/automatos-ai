# =============================================================================
# Automatos AI Platform — Landing Page
# =============================================================================
# Services: Marketing/landing page (Vite SPA + Node server)
# Source repo: AutomatosAI/automatos-ai-landing
#
# Railway production:
#   - automatos-ai-landing → automatos.app
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Landing Page — Vite build + Node.js server (contact form API)
  # Railway: repo=automatos-ai-landing, dockerfile=/Dockerfile, port=80
  # ---------------------------------------------------------------------------
  automatos-ai-landing:
    build:
      context: ../automatos-ai-landing
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_AUTOMATOS_WORKSPACE_ID: ${VITE_AUTOMATOS_WORKSPACE_ID}
    container_name: automatos_landing
    restart: on-failure:10
    ports:
      - "${LANDING_PORT:-8090}:80"
    environment:
      PORT: 80
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
      VITE_AUTOMATOS_WORKSPACE_ID: ${VITE_AUTOMATOS_WORKSPACE_ID}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - automatos

networks:
  automatos:
    name: automatos_network
    external: true
