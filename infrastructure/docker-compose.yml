# =============================================================================
# Automatos AI Platform — Full Stack Composition
# =============================================================================
# Combines all service groups into a single deployable stack.
# Mirrors the Railway production topology (19 services, 9 volumes).
#
# Usage:
#   # Full platform
#   docker compose -f docker-compose.yml up -d
#
#   # Individual groups
#   docker compose -f docker-compose.data.yml up -d
#   docker compose -f docker-compose.core.yml up -d
#   docker compose -f docker-compose.voice.yml up -d
#   docker compose -f docker-compose.memory.yml up -d
#   docker compose -f docker-compose.landing.yml up -d
#
# Monitoring (prometheus/grafana/loki/alertmanager) lives in the standalone
# ../automatos-monitoring repo — it is NOT part of this stack.
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in required values
#   2. Create the shared network: docker network create automatos_network
#   3. Ensure all source repos are cloned as siblings in the parent directory
#
# Architecture (matches Railway production):
#   api.automatos.app    → automatos-ai-api (FastAPI)
#   ui.automatos.app     → automotas-ai-frontend (Next.js)
#   automatos.app        → automatos-ai-landing (Vite + Node)
#   (internal)           → 16 supporting services
# =============================================================================

include:
  - docker-compose.data.yml
  - docker-compose.core.yml
  - docker-compose.voice.yml
  - docker-compose.memory.yml
  - docker-compose.landing.yml
