# =============================================================================
# Automatos AI Platform — Core Services
# =============================================================================
# Services: API (FastAPI), Frontend (Next.js), Workspace Worker, Opt Worker
# Source repo: AutomatosAI/automatos-ai
#
# Railway production:
#   - automatos-ai-api       → api.automatos.app
#   - automotas-ai-frontend  → ui.automatos.app
#   - agent-workspace-worker  (internal only)
#   - agent-opt-worker        (internal, Railway domain)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API (FastAPI + Uvicorn)
  # Railway: root=/orchestrator, builder=RAILPACK, port=8000
  # ---------------------------------------------------------------------------
  automatos-ai-api:
    build:
      context: ../automatos-ai/orchestrator
      dockerfile: Dockerfile
      target: production
    container_name: automatos_api
    restart: on-failure:10
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # Redis
      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # LLM
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      # Embeddings
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      # Auth (Clerk)
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      # Security
      API_KEY: ${API_KEY}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      WIDGET_TOKEN_SECRET: ${WIDGET_TOKEN_SECRET}
      # Composio
      COMPOSIO_KEY: ${COMPOSIO_KEY}
      COMPOSIO_WEBHOOK_SECRET: ${COMPOSIO_WEBHOOK_SECRET}
      # Integrations
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      MEM0_API_URL: ${MEM0_API_URL:-http://mem0-server:8765}
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL:-http://voice-service:8300}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      AGENT_OPT_WORKER_URL: ${AGENT_OPT_WORKER_URL:-http://agent-opt-worker:8080}
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN}
      WORKER_INTERNAL_URL: ${WORKER_INTERNAL_URL:-http://agent-workspace-worker:8081}
      # Monitoring
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_RELAY_ENABLED: ${LOG_RELAY_ENABLED:-false}
      LOG_RELAY_URL: ${LOG_RELAY_URL}
      GRAFANA_URL: ${GRAFANA_URL}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
      GRAFANA_LOKI_DATASOURCE_UID: ${GRAFANA_LOKI_DATASOURCE_UID}
      ALERT_INGEST_TOKEN: ${ALERT_INGEST_TOKEN}
      # Observability (FutureAGI)
      FUTUREAGI_ENABLED: ${FUTUREAGI_ENABLED:-false}
      FUTUREAGI_API_KEY: ${FUTUREAGI_API_KEY}
      FUTUREAGI_SECRET_KEY: ${FUTUREAGI_SECRET_KEY}
      # AWS (S3 vectors)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_VECTORS_ENABLED: ${S3_VECTORS_ENABLED:-false}
      S3_VECTORS_BUCKET: ${S3_VECTORS_BUCKET}
      S3_VECTORS_DIMENSION: ${S3_VECTORS_DIMENSION}
      S3_VECTORS_INDEX_NAME: ${S3_VECTORS_INDEX_NAME}
      S3_VECTORS_METRIC: ${S3_VECTORS_METRIC}
      # GitHub
      GITHUB: ${GITHUB}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME}
      GITHUB_DEFAULT_BRANCH: ${GITHUB_DEFAULT_BRANCH:-main}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      # Slack
      SLACK_API_KEY: ${SLACK_API_KEY}
      # URLs
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}
      # Runtime
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SERVICE_NAME: automatos-ai-api
      SHARED_CONTEXT_BACKEND: ${SHARED_CONTEXT_BACKEND:-redis}
      TASK_RUNNER_BACKEND: ${TASK_RUNNER_BACKEND:-redis}
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - automatos

  # ---------------------------------------------------------------------------
  # Frontend (Next.js Standalone)
  # Railway: root=/frontend, dockerfile=/frontend/Dockerfile, port=3000, sleep=true
  # ---------------------------------------------------------------------------
  automotas-ai-frontend:
    build:
      context: ../automatos-ai/frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL:-/dashboard}
        NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL:-/dashboard}
    container_name: automatos_frontend
    restart: on-failure:10
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_VOICE_PIPELINE_URL: ${NEXT_PUBLIC_VOICE_PIPELINE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      API_KEY: ${API_KEY}
    depends_on:
      automatos-ai-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - automatos

  # ---------------------------------------------------------------------------
  # Agent Workspace Worker (Python — task execution in isolated workspaces)
  # Railway: root=/services/workspace-worker, port=8081, volume=/workspaces
  # ---------------------------------------------------------------------------
  agent-workspace-worker:
    build:
      context: ../automatos-ai/services/workspace-worker
      dockerfile: Dockerfile
    container_name: automatos_workspace_worker
    restart: on-failure:10
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      WORKSPACE_VOLUME_PATH: /workspaces
      WORKSPACE_DEFAULT_QUOTA_GB: ${WORKSPACE_DEFAULT_QUOTA_GB:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_HEALTH_PORT: 8081
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_RELAY_ENABLED: ${LOG_RELAY_ENABLED:-false}
      SERVICE_NAME: agent-workspace-worker
    volumes:
      - workspace_data:/workspaces
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - automatos

  # ---------------------------------------------------------------------------
  # Agent Optimization Worker (Python — prompt optimization, eval)
  # Railway: root=/services/agent-opt-worker, port=8080
  # ---------------------------------------------------------------------------
  agent-opt-worker:
    build:
      context: ../automatos-ai/services/agent-opt-worker
      dockerfile: Dockerfile
    container_name: automatos_opt_worker
    restart: on-failure:10
    ports:
      - "${OPT_WORKER_PORT:-8080}:8080"
    environment:
      PORT: 8080
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      FUTUREAGI_API_KEY: ${FUTUREAGI_API_KEY}
      FUTUREAGI_SECRET_KEY: ${FUTUREAGI_SECRET_KEY}
      FI_API_KEY: ${FI_API_KEY}
      FI_SECRET_KEY: ${FI_SECRET_KEY}
      MAX_OPTIMIZE_TIMEOUT: ${MAX_OPTIMIZE_TIMEOUT:-300}
      LOG_RELAY_ENABLED: ${LOG_RELAY_ENABLED:-false}
      SERVICE_NAME: agent-opt-worker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - automatos

volumes:
  workspace_data:
    name: automatos_workspace_data

networks:
  automatos:
    name: automatos_network
    external: true
