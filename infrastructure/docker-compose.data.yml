# =============================================================================
# Automatos AI Platform — Data Infrastructure
# =============================================================================
# Services: PostgreSQL (pgvector), Redis, Qdrant
# All image-based — no source repos, Railway-managed
#
# Railway production:
#   - automatos-ai-pgvector  → pgvector/pgvector:pg18 (TCP proxy)
#   - Redis                  → redis:8.2.1 (TCP proxy)
#   - Qdrant                 → qdrant/qdrant (railway domain)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector extension
  # Railway: image=pgvector/pgvector:pg18, volume=/var/lib/postgresql/data/
  # Custom start: unset PGPORT; docker-entrypoint.sh postgres --port=5432
  # ---------------------------------------------------------------------------
  pgvector:
    image: pgvector/pgvector:pg18
    container_name: automatos_pgvector
    restart: on-failure:10
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgvector_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - automatos

  # ---------------------------------------------------------------------------
  # Redis — Cache, Pub/Sub, Task Queue
  # Railway: image=redis:8.2.1, volume=/data
  # Custom start: redis-server --requirepass $REDIS_PASSWORD --save 60 1 --dir /data
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.2.1
    container_name: automatos_redis
    restart: on-failure:10
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --save 60 1
        --dir /data
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - automatos

  # ---------------------------------------------------------------------------
  # Qdrant — Vector Database
  # Railway: image=qdrant/qdrant, volume=/qdrant/storage, port=6333
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: automatos_qdrant
    restart: on-failure:10
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - automatos

volumes:
  pgvector_data:
    name: automatos_pgvector_data
  redis_data:
    name: automatos_redis_data
  qdrant_data:
    name: automatos_qdrant_data

networks:
  automatos:
    name: automatos_network
    external: true
