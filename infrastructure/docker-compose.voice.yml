# =============================================================================
# Automatos AI Platform — Voice Services
# =============================================================================
# Services: Voice Service (TTS/STT), Voice Pipeline (orchestration)
# Source repo: Automatos../../automatos-voice
#
# Railway production:
#   - voice-service   → voice-service-production-bb28.up.railway.app (sleep=true)
#   - voice-pipeline  → voice-pipeline-production.up.railway.app (sleep=true)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Voice Service — TTS (Chatterbox) & STT (Whisper)
  # Railway: repo=automatos-voice, root=/, port=8300, sleep=true
  # ---------------------------------------------------------------------------
  voice-service:
    build:
      context: ../../automatos-voice
      dockerfile: services/voice-service/Dockerfile
    container_name: automatos_voice_service
    restart: on-failure:10
    ports:
      - "${VOICE_SERVICE_PORT:-8300}:8300"
    environment:
      PORT: 8300
      HOST: 0.0.0.0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      # TTS config
      TTS_ENGINE: ${TTS_ENGINE:-chatterbox}
      TTS_DEFAULT_MODEL: ${TTS_DEFAULT_MODEL:-chatterbox}
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-default}
      # STT config (Whisper)
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - voice_model_cache:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8300/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - automatos

  # ---------------------------------------------------------------------------
  # Voice Pipeline — WebSocket orchestration layer
  # Railway: repo=automatos-voice, root=/, port=8301, sleep=true
  # ---------------------------------------------------------------------------
  voice-pipeline:
    build:
      context: ../../automatos-voice
      dockerfile: services/voice-pipeline/Dockerfile
    container_name: automatos_voice_pipeline
    restart: on-failure:10
    ports:
      - "${VOICE_PIPELINE_PORT:-8301}:8301"
    environment:
      PORT: 8301
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      MAX_CONCURRENT_SESSIONS: ${MAX_CONCURRENT_SESSIONS:-10}
      # Upstream connections
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL:-http://voice-service:8300}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://automatos-ai-api:8000}
      # Voice model config
      STT_MODEL: ${STT_MODEL:-whisper-base}
      TTS_MODEL: ${TTS_MODEL:-chatterbox}
      TTS_VOICE: ${TTS_VOICE:-default}
    depends_on:
      voice-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8301/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - automatos

volumes:
  voice_model_cache:
    name: automatos_voice_models

networks:
  automatos:
    name: automatos_network
    external: true
