<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{ size.width }}, height={{ size.height }}" />
    <title>Review</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* PRD-251B photo cards: "Review", a customer's words and stars on a card over a photo.
         Every colour and font reads the brand kit; the var() fallbacks are the platform's defaults.
         Words sit on the brand's ink (a panel, a chip or a card) so they read over any photo, and
         with no photo the brand's own backdrop shows instead. */
      :root {
        --ink: var(--brand-ink, #1a1714);
        --on-ink: var(--brand-on-ink, #f0e8db);
        --muted: var(--brand-on-ink-muted, #b0a38d);
        --accent: var(--brand-primary-on-ink, #e96235);
        --brand: var(--brand-primary, #ff6932);
        --display: var(--brand-heading-font, sans-serif);
        --body: var(--brand-body-font, sans-serif);
        --mono: var(--brand-mono-font, monospace);
        /* F382: how far a face's glyphs can reach above and below their baseline, as a share of the type
           (Geist 1.30, Inter 1.21, DejaVu Sans 1.16). Display type set tighter than this gets the rest as
           room below its last line, so the fit never reads the glyphs as overflow and shrinks the card. */
        --ink-reach: 1.32em;
        /* One design pixel: the 1080-wide feed post is the reference; a landscape card scales by its height. */
        --u: calc(min({{ size.width }}, {{ size.height }}) / 1080 * 1px);
        /* PRD-255: the kit's display and body sizes, as ratios to the default type scale (1 without a kit). */
        --display-scale: var(--brand-display-scale, 1);
        --body-scale: var(--brand-body-scale, 1);
        --logo-chip: var(--brand-logo-chip, transparent);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{ size.width }}px; height: {{ size.height }}px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--body); color: var(--on-ink); background: var(--ink); }
      .clip { position: absolute; inset: 0; }
      /* The backdrop: the brand's ink with two glows of its colour, what shows where no photo is given. */
      .backdrop { position: absolute; inset: 0; background:
        radial-gradient(80% 55% at 92% 6%, color-mix(in srgb, var(--brand) 58%, var(--ink)) 0%, transparent 72%),
        radial-gradient(70% 45% at 0% 100%, color-mix(in srgb, var(--brand) 28%, var(--ink)) 0%, transparent 78%),
        var(--ink); }
      .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* The page: every size below is design pixels times --s, and the fit script shrinks --fit until it all fits. */
      /* The page has no padding of its own: its blocks carry their spacing, so a panel runs to the card's edges. */
      /* F382: in a story, the words keep clear of the story app's own bars (--story-top and --story-bottom, set only for
         a 9:16 story render); the page and its backgrounds still run to the card's edges. */
      .page { --fit: 1; --s: calc(var(--u) * var(--fit)); position: absolute; inset: 0; display: flex; flex-direction: column;
        justify-content: space-between; gap: calc(28 * var(--s)); }
      .page.wrap-words * { overflow-wrap: anywhere; }
      .top { display: flex; align-items: center; justify-content: space-between; gap: calc(20 * var(--s));
        margin: calc(56 * var(--u) + var(--story-top, 0px)) calc(60 * var(--u)) 0; }
      .brand, .chip { display: inline-flex; align-items: center; gap: calc(12 * var(--s)); max-width: 100%;
        background: color-mix(in srgb, var(--ink) 82%, transparent); color: var(--on-ink); border-radius: calc(999 * var(--s));
        padding: calc(10 * var(--s)) calc(20 * var(--s)); font-size: calc(26 * var(--s) * var(--body-scale)); font-weight: 600; line-height: 1.2; }
      .chip.handle { font-family: var(--mono); font-weight: 500; margin-left: auto; }
      .logo { flex: none; width: calc(40 * var(--s)); height: calc(40 * var(--s)); object-fit: contain; }
      .logo[src^="data:image/gif"] { display: none; }
      .pill { display: inline-flex; align-self: flex-start; max-width: 100%; background: var(--accent); color: var(--ink);
        border-radius: calc(10 * var(--s)); padding: calc(10 * var(--s)) calc(20 * var(--s)); font-family: var(--mono);
        font-size: calc(24 * var(--s) * var(--body-scale)); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.2; }
      /* Display type sets tighter than its glyphs: the padding holds their ink, so the fit never reads it as overflow. */
      .headline { width: 100%; font-family: var(--display); font-weight: 800; line-height: 0.98; letter-spacing: -0.02em; color: var(--on-ink);
        padding-bottom: calc((var(--ink-reach) - 0.98em) / 2); }
      .headline .line { display: block; }
      .hot { color: var(--accent); }
      .lede { font-size: calc(34 * var(--s) * var(--body-scale)); line-height: 1.38; color: var(--on-ink); }
      .note { font-size: calc(28 * var(--s) * var(--body-scale)); line-height: 1.4; color: var(--muted); }
      .button { display: inline-flex; align-self: flex-start; align-items: center; max-width: 100%; background: var(--accent); color: var(--ink);
        border-radius: calc(14 * var(--s)); padding: calc(18 * var(--s)) calc(30 * var(--s)); font-size: calc(30 * var(--s) * var(--body-scale));
        font-weight: 700; line-height: 1.15; }

      .card { display: flex; flex-direction: column; gap: calc(22 * var(--s)); border-radius: calc(28 * var(--s));
        margin: 0 calc(60 * var(--u)) calc(60 * var(--u) + var(--story-bottom, 0px));
        padding: calc(44 * var(--s)) calc(46 * var(--s)); background: color-mix(in srgb, var(--ink) 90%, transparent); }
      .stars { font-size: calc(46 * var(--s) * var(--body-scale)); letter-spacing: 0.08em; line-height: 1; color: var(--accent); }
      .quote { font-family: var(--display); font-weight: 700; font-size: calc(58 * var(--s) * var(--display-scale)); line-height: 1.16; color: var(--on-ink); }
      .who { display: flex; flex-direction: column; gap: calc(6 * var(--s)); padding-top: calc(18 * var(--s));
        border-top: calc(2 * var(--u)) solid color-mix(in srgb, var(--on-ink) 22%, transparent); }
      .name { font-size: calc(32 * var(--s) * var(--body-scale)); font-weight: 700; color: var(--on-ink); }
      @media (min-aspect-ratio: 3/2) {
        .page { justify-content: flex-start; }
        .card { flex: 0 1 auto; margin: auto calc(60 * var(--u)) calc(60 * var(--u)); width: 60%; }
        .quote { font-size: calc(52 * var(--s) * var(--display-scale)); }
      }
      /* PRD-255 FR-9: on a dark stage, the kit's logo for dark backgrounds as it is; without one, the logo on a light chip. */
      .dark-logo { background: var(--logo-chip); border-radius: calc(8 * var(--s)); padding: calc(4 * var(--s)); }
      .dark-logo[src^="data:image/gif"] { background: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="{{ size.width }}" data-height="{{ size.height }}">
      <section id="card" class="clip" data-start="0" data-duration="1" data-track-index="0">
        <div class="backdrop"></div>
        <img class="photo" data-slot="photo" data-layout-allow-overflow src="assets/slots/photo.png" alt="" />
        <div class="page">
          <div class="top fit"><div class="chip brand" data-optional><img class="dark-logo logo" src="{{ brand.logo_on_dark }}" alt="" /><span class="v">{{ brand.name }}</span></div><span class="chip handle v">{{ handle }}</span></div>
          <div class="card fit">
            <span class="stars" data-stars="{{ rating }}"></span>
            <p class="quote fit" data-dress="quote">{{ quote }}</p>
            <div class="who">
              <span class="name">{{ name }}</span>
              <span class="note v">{{ detail }}</span>
            </div>
          </div>
        </div>
      </section>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="1" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};

      // ---------- setup: the card's own words, dressed and fitted before anything is sampled ----------
      const MIN_FIT = 0.5;
      const FIT_STEP = 0.04;
      // F382: a line's glyphs may reach past its line box (a face's ascent and descent run to 1.3em, its
      // lines to 1.2): that ink is not overflow, so a box may run this share of the largest type in it past its height.
      const INK_SLACK = 0.18;
      // No photo given: the slot's element was taken out, and the backdrop shows (a template may say more).
      if (!document.querySelector("img[data-slot]")) document.getElementById("root").classList.add("no-photo");
      // Stars: a rating of 1 to 5 as filled and empty stars.
      document.querySelectorAll("[data-stars]").forEach((el) => {
        const rating = Math.max(0, Math.min(5, Math.round(Number(el.getAttribute("data-stars")) || 0)));
        el.textContent = rating ? "\u2605".repeat(rating) + "\u2606".repeat(5 - rating) : "";
      });
      // A block whose every value is empty is taken out (an unused eyebrow, a third card),
      // and so is any empty value, so it leaves no gap.
      document.querySelectorAll("[data-optional]").forEach((block) => {
        const values = block.querySelectorAll(".v");
        const filled = Array.from(values.length ? values : [block]).some((el) => el.textContent.trim());
        if (!filled) block.remove();
      });
      document.querySelectorAll(".v").forEach((el) => {
        if (!el.textContent.trim()) el.remove();
      });
      // The display text: "|" breaks the line, and its accent words take the brand colour.
      function dress(el) {
        const accent = (el.getAttribute("data-accent") || "").trim();
        const quoted = el.getAttribute("data-dress") === "quote";
        const text = quoted ? "\u201c" + el.textContent.trim() + "\u201d" : el.textContent;
        const lines = text.split("|").map((line) => line.trim()).filter(Boolean);
        let marked = !accent;
        el.textContent = "";
        lines.forEach((line) => {
          const row = document.createElement("span");
          row.className = "line";
          const at = marked ? -1 : line.indexOf(accent);
          if (at < 0) {
            row.textContent = line;
          } else {
            marked = true;
            const hot = document.createElement("span");
            hot.className = "hot";
            hot.textContent = accent;
            row.append(line.slice(0, at), hot, line.slice(at + accent.length));
          }
          el.appendChild(row);
        });
      }
      document.querySelectorAll("[data-dress]").forEach(dress);
      // The fit: the page's scale steps down until every block sits inside the page and every box holds its text.
      function inkSlack(el) {
        const sizes = [el, ...el.querySelectorAll("*")].map((node) => parseFloat(getComputedStyle(node).fontSize) || 0);
        return INK_SLACK * Math.max(...sizes);
      }
      function overflowing(page) {
        const box = page.getBoundingClientRect();
        const style = getComputedStyle(page);
        const bottom = box.bottom - parseFloat(style.paddingBottom) + 1;
        const right = box.right - parseFloat(style.paddingRight) + 1;
        for (const child of page.children) {
          const rect = child.getBoundingClientRect();
          if (rect.bottom > bottom || rect.right > right) return true;
        }
        return Array.from(page.querySelectorAll(".fit")).some(
          (el) => el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1 + inkSlack(el)
        );
      }
      function fit(page) {
        // A page taken out of the layout (display: none) measures nothing: it keeps the fit it had.
        if (!page.getClientRects().length) return;
        page.classList.remove("wrap-words");
        for (let step = 0; ; step += 1) {
          const scale = Math.max(MIN_FIT, 1 - step * FIT_STEP);
          page.style.setProperty("--fit", scale.toFixed(2));
          if (!overflowing(page) || scale === MIN_FIT) break;
        }
        if (overflowing(page)) page.classList.add("wrap-words");
      }
      function fitAll() {
        document.querySelectorAll(".page").forEach(fit);
      }
      fitAll();
      // A brand font file loads after this script: the card fits again once it has.
      document.fonts.addEventListener("loadingdone", fitAll);
      document.fonts.ready.then(fitAll);

      // A still: nothing moves. The timeline only spans the card's one second.
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 1);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
