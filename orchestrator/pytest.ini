[pytest]
# PRD-142 Wave 2 (W2-S1): first pytest config for the orchestrator suite.
# Until this landed there was no config at all, so async mode, marker
# registration and import resolution were all implicit. This pins them.

# rootdir is orchestrator/ so `core.*` / `modules.*` absolute imports resolve.
pythonpath = .

# PRD-182 W12-S2 (F056): collect the two test trees the required gate never
# saw. Before this, testpaths was just `tests`, so `modules/*/tests` (81 fns)
# and `integrations/*/tests` (34 fns) were orphaned - `pytest --collect-only`
# and the CI gate skipped them entirely. They are added here so default
# collection (and `--collect-only`) is the true test surface.
#
# CI runs them in a DEDICATED job (`orchestrator-module-tests` in test.yml),
# introduced NON-REQUIRED - the same posture every other lane in that workflow
# took until proven green - because some module tests need live services
# (Redis, pgvector, the benchmark stack) the required job does not stand up.
# The existing REQUIRED `orchestrator-tests` job pins itself to `pytest tests`
# so widening testpaths here does not change what the green gate runs.
testpaths =
    tests
    modules
    integrations

# TEMPORARY DIAGNOSTIC (PR #545 hang hunt) -- REVERT ONCE GREEN.
# With capture on, pytest redirects the real stderr fd into a buffer, so the
# `-o faulthandler_timeout=90` watchdog dump the CI lane arms never reaches
# the job log when the suite freezes. Capture off lets any further hang
# print its exact stack into the log.
addopts = --capture=no

# pytest-asyncio 1.x already defaults to strict; pin it so a future default
# flip can't silently change collection of @pytest.mark.asyncio tests.
asyncio_mode = strict

# Registered markers (not --strict-markers, so existing ad-hoc marks still run).
markers =
    golden: end-to-end golden-journey backbone (J1-J10); select with `-m golden`
    integration: hits real infrastructure (Postgres/S3/vectors); needs services
    slow: long-running; deselect with `-m "not slow"` for fast inner-loop runs
    benchmark: pytest-benchmark latency benchmarks (PRD-157 S4 p50 gate); needs the live stack
