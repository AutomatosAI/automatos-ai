[phases.setup]
# System packages needed
# "file" package provides libmagic library needed for python-magic
# Note: In Nix, "file" package provides libmagic, but we need to ensure it's accessible
nixPkgs = ["python311", "gcc", "g++", "curl", "postgresql", "file", "tesseract", "ghostscript"]

# Explicitly use Python from nixpkgs, ignore mise/.python-version
[providers]
python = "nixpkgs"

# Install phase - Railway caches pip packages when requirements.txt hasn't changed
# IMPORTANT: Railway caches based on file hashes, so ensure requirements.txt is stable
[phases.install]
cmds = [
  # Install Python packages (pip uses cache - Railway caches the layer)
  # Railway will cache this step if requirements.txt hash hasn't changed
  "pip install -r requirements.txt",
  # Download NLTK data (cached - only downloads if missing)
  "export NLTK_DATA=/usr/local/nltk_data && python -c \"import nltk; import os; os.makedirs('/usr/local/nltk_data', exist_ok=True); nltk.download('punkt', quiet=True, download_dir='/usr/local/nltk_data'); nltk.download('stopwords', quiet=True, download_dir='/usr/local/nltk_data')\" || true",
  # Set up libmagic for python-magic (must be done at build time)
  # Find libmagic in /nix/store and create symlink in /usr/lib
  "LIBMAGIC=$(find /nix/store -name 'libmagic.so*' 2>/dev/null | head -1) && if [ -n \"$LIBMAGIC\" ]; then mkdir -p /usr/lib && ln -sf \"$LIBMAGIC\" /usr/lib/libmagic.so.1 2>/dev/null || true; fi",
  # Make startup script executable (important for Procfile)
  "chmod +x start-railway.sh || true"
]

[variables]
NLTK_DATA = "/usr/local/nltk_data"
# Set LD_LIBRARY_PATH to include /usr/lib where we symlink libmagic
# This ensures python-magic can find libmagic at import time
LD_LIBRARY_PATH = "/usr/lib:/nix/store"
