# Model matrix for PRD-138 tool-routing eval.
#
# All models routed through OpenRouter so we can hit the full ladder with
# one provider/key. Costs in USD per 1M tokens (input/output) — verify
# against https://openrouter.ai/models before publishing any chart.
#
# `tier` is for chart grouping only; it does not affect routing.
# Drop or comment out a model to skip it for a given run.

models:
  # Frontier — should tolerate full-dump prompts; semantic still saves cost.
  - id: openai/gpt-5
    tier: frontier
    cost_in: 1.25
    cost_out: 10.00
  - id: anthropic/claude-opus-4.7
    tier: frontier
    cost_in: 15.00
    cost_out: 75.00
  - id: google/gemini-2.5-pro
    tier: frontier
    cost_in: 1.25
    cost_out: 10.00

  # Mid — main production tier. Should show meaningful gain.
  - id: anthropic/claude-sonnet-4.6
    tier: mid
    cost_in: 3.00
    cost_out: 15.00
  - id: openai/gpt-5-mini
    tier: mid
    cost_in: 0.25
    cost_out: 2.00

  # Small — the interesting tier. Hypothesis: routing makes them viable.
  - id: anthropic/claude-haiku-4.5
    tier: small
    cost_in: 1.00
    cost_out: 5.00
  - id: openai/gpt-4.1-mini
    tier: small
    cost_in: 0.40
    cost_out: 1.60
  - id: google/gemini-2.5-flash
    tier: small
    cost_in: 0.075
    cost_out: 0.30
  - id: meta-llama/llama-3.3-70b-instruct
    tier: small
    cost_in: 0.20
    cost_out: 0.20

# Embedding model used for the semantic-filter mode.
# Matches production default (qwen3-embedding-8b @ 2048d).
embedding:
  model: qwen/qwen3-embedding-8b
  dimension: 2048

# Tunables.
top_k: 15            # how many actions semantic mode surfaces in the prompt
temperature: 0.0     # deterministic for reproducibility
max_tokens: 256      # we only need a tool call, not prose
request_timeout: 60
