    category: marketplace
    difficulty: easy

  - q: "what plugins are available?"
    correct_actions: [platform_browse_marketplace_plugins]
    category: marketplace
    difficulty: paraphrase

  - q: "show me marketplace agents I can install"
    correct_actions: [platform_browse_marketplace_agents]
    category: marketplace
    difficulty: easy

  # ──────────────────────────────────────────────────────────────────
