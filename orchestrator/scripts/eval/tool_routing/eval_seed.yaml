# Hand-curated seed eval set for PRD-138 tool routing.
#
# Each entry maps a natural-language query to one or more correct platform
# actions. The runner asks the LLM to pick an action via `platform_execute`
# given either the full action catalog (~107 actions) or the semantic-filtered
# top-K. A choice is correct if it matches any name in `correct_actions`.
#
# Categories are loose groupings for analysis, not for routing.
# Difficulty:
#   - easy: keyword-router gets it today (regex match leads to the right tool)
#   - ambiguous: keyword precedence picks the wrong tool
#   - paraphrase: same intent, no obvious keyword match
#   - cross: legit answer spans multiple action categories
#
# Add more freely. Re-run `python seed_eval_set.py` after edits to validate
# action names against the live ActionRegistry and emit eval_set.jsonl.

queries:
  # ──────────────────────────────────────────────────────────────────
  # Agents — list / inspect
  # ──────────────────────────────────────────────────────────────────
  - q: "list my agents"
    correct_actions: [platform_list_agents]
    category: agents
    difficulty: easy

  - q: "what agents do I have?"
    correct_actions: [platform_list_agents]
    category: agents
    difficulty: easy

  - q: "show me the agents that are running"
    correct_actions: [platform_list_agents]
    category: agents
    difficulty: easy

  - q: "who's on my roster?"
    correct_actions: [platform_list_agents]
    category: agents
    difficulty: paraphrase

  - q: "tell me about the SENTINEL agent"
    correct_actions: [platform_get_agent, platform_list_agents]
    category: agents
    difficulty: easy

  - q: "set up a new research agent"
    correct_actions: [platform_create_agent]
    category: agents
    difficulty: easy

  - q: "make me a marketing agent that writes blog posts"
    correct_actions: [platform_create_agent]
    category: agents
    difficulty: easy

  # ──────────────────────────────────────────────────────────────────
  # Playbooks / Recipes
  # ──────────────────────────────────────────────────────────────────
  - q: "list my playbooks"
    correct_actions: [platform_list_playbooks]
    category: playbooks
    difficulty: easy

  - q: "what playbooks do I have set up?"
    correct_actions: [platform_list_playbooks]
    category: playbooks
    difficulty: easy

  - q: "create a daily blog post playbook"
    correct_actions: [platform_create_playbook]
    category: playbooks
    difficulty: easy

  - q: "run my morning briefing playbook"
    correct_actions: [platform_execute_playbook]
    category: playbooks
    difficulty: easy

  # ──────────────────────────────────────────────────────────────────
  # Analytics / cost — the headline ambiguous case from the PRD
  # ──────────────────────────────────────────────────────────────────
  - q: "how much have I spent on tokens this week?"
    correct_actions: [platform_get_llm_usage, platform_get_cost_breakdown]
    category: analytics
    difficulty: easy

  - q: "what's my LLM bill looking like?"
    correct_actions: [platform_get_llm_usage, platform_get_cost_breakdown]
    category: analytics
    difficulty: paraphrase

  - q: "break down my costs by model"
    correct_actions: [platform_get_cost_breakdown, platform_get_llm_usage]
    category: analytics
    difficulty: easy

  - q: "how am I doing this week?"
    correct_actions: [platform_workspace_stats, platform_get_success_rate, platform_get_activity_feed]
    category: analytics
    difficulty: ambiguous
    notes: "Generic enough that keyword routing maps to SEARCH first. Multiple summary actions are acceptable."

  - q: "what's my agent success rate?"
    correct_actions: [platform_get_success_rate, platform_get_efficiency_score]
    category: analytics
    difficulty: easy

  - q: "show me workspace stats"
    correct_actions: [platform_workspace_stats]
    category: analytics
    difficulty: easy

  # ──────────────────────────────────────────────────────────────────
  # Documents / knowledge
  # ──────────────────────────────────────────────────────────────────
  - q: "what documents have I uploaded?"
    correct_actions: [platform_list_documents]
    category: documents
    difficulty: easy

  - q: "show me my knowledge base"
    correct_actions: [platform_list_documents]
    category: documents
    difficulty: paraphrase

  - q: "find the contract from Acme in the docs"
    correct_actions: [search_knowledge, platform_list_documents]
    category: documents
    difficulty: easy

  # ──────────────────────────────────────────────────────────────────
  # Workspace / connected apps
  # ──────────────────────────────────────────────────────────────────
  - q: "what integrations am I connected to?"
    correct_actions: [platform_list_connected_apps, platform_get_workspace_info]
