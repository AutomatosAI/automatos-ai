  # ──────────────────────────────────────────────────────────────────
  # Cross-cutting / paraphrase / adversarial
  # ──────────────────────────────────────────────────────────────────
  - q: "give me a quick health check on everything"
    correct_actions: [platform_get_system_health, platform_workspace_stats, platform_list_agents]
    category: cross
    difficulty: ambiguous
    notes: "No single right answer; surfacing any of these is acceptable."

  - q: "what's working and what's broken?"
    correct_actions: [platform_get_error_rates, platform_get_success_rate, platform_get_alerts, platform_list_missions]
    category: cross
    difficulty: ambiguous

  - q: "wie viele Agenten habe ich?"
    correct_actions: [platform_list_agents]
    category: agents
    difficulty: paraphrase
    notes: "German for 'how many agents do I have?' — tests cross-lingual robustness."

  - q: "résumé de la semaine"
    correct_actions: [platform_workspace_stats, platform_get_llm_usage, platform_get_activity_feed]
    category: analytics
    difficulty: paraphrase
    notes: "French for 'summary of the week' — tests cross-lingual robustness."

  - q: "I want to see what's been happening on the platform"
    correct_actions: [platform_get_activity_feed, platform_workspace_stats, platform_list_missions]
    category: cross
    difficulty: ambiguous
