# PRD-232 US-005 — synthetic utterance corpus (category: proactive)
# =============================================================================
# Seed INPUT data for the Intent Graph (NOT eval gold; decision §6.3). Every
# registered non-super_admin_only action in this category gets 15-25 diverse
# utterances a user might type to invoke it. Consumed by US-006
# (ActionSemanticIndex embedding text) and US-007 (seeded intent clusters).
#
# Schema:
#   version:  1                     corpus schema version
#   category: proactive               registry category (== filename stem)
#   actions:
#     <action_name>:
#       - text: "<what the user types>"
#         source: authored | example | phrase_map
#
#   source provenance:
#     example    — folded verbatim from ActionDefinition.examples
#     phrase_map — folded verbatim from AutoBrain _PLATFORM_KEYWORDS (incl. the
#                  legacy recipe->playbook remap)
#     authored   — written for this corpus (colloquial / terse / verbose /
#                  register variants: ticket·task·card·item, mail·email·inbox,
#                  close·finish·clear·kill·done)
#
# Regenerate/lint:  cd orchestrator && python -m scripts.generate_utterance_corpus
# super_admin_only actions are EXCLUDED (fail-closed, read from the registry flag).
#
# PRD-268 US-C19d: platform_get_brief only. platform_suggest_next_step runs in a
# check-in and nowhere else, so no chat utterance routes to it.
version: 1
category: proactive
actions:
  platform_get_brief:
  - text: what needs me?
    source: example
  - text: brief me
    source: example
  - text: what's on today?
    source: example
  - text: catch me up
    source: example
  - text: give me my brief
    source: authored
  - text: read me today's brief
    source: authored
  - text: what needs my attention today
    source: authored
  - text: anything waiting on me?
    source: authored
  - text: what's waiting for my answer
    source: authored
  - text: what's scheduled for today
    source: authored
  - text: what's happening today in the workspace
    source: authored
  - text: what finished since my last brief
    source: authored
  - text: what did I miss since yesterday
    source: authored
  - text: any suggestions from Auto for me?
    source: authored
  - text: morning brief please
    source: authored
  - text: give me the rundown for today
    source: authored
  - text: what's on my plate
    source: authored
  - text: start my day, what's going on?
    source: authored
  - text: what couldn't you check this morning
    source: authored
  - text: what do I need to deal with today
    source: authored
