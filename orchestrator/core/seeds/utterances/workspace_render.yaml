# PRD-232 US-005 — synthetic utterance corpus (category: workspace_render)
# =============================================================================
# Seed INPUT data for the Intent Graph (NOT eval gold; decision §6.3). Every
# registered non-super_admin_only action in this category gets 15-25 diverse
# utterances a user might type to invoke it. Consumed by US-006
# (ActionSemanticIndex embedding text) and US-007 (seeded intent clusters).
#
# Schema:
#   version:  1                     corpus schema version
#   category: workspace_render                 registry category (== filename stem)
#   actions:
#     <action_name>:
#       - text: "<what the user types>"
#         source: authored | example | phrase_map
#
#   source provenance:
#     example    — folded verbatim from ActionDefinition.examples
#     phrase_map — folded verbatim from AutoBrain _PLATFORM_KEYWORDS (incl. the
#                  legacy recipe->playbook remap)
#     authored   — written for this corpus (colloquial / terse / verbose /
#                  register variants: ticket·task·card·item, mail·email·inbox,
#                  close·finish·clear·kill·done)
#
# Regenerate/lint:  cd orchestrator && python -m scripts.generate_utterance_corpus
# super_admin_only actions are EXCLUDED (fail-closed, read from the registry flag).
version: 1
category: workspace_render
actions:
  workspace_html_to_png:
  - text: render the definition template for instagram
    source: example
  - text: screenshot the html page to a png
    source: example
  - text: generate a social card png from the template
    source: example
  - text: produce a 1080x1350 instagram post from the html
    source: example
  - text: render html
    source: phrase_map
  - text: html to png
    source: phrase_map
  - text: html to image
    source: phrase_map
  - text: screenshot the page
    source: phrase_map
  - text: screenshot template
    source: phrase_map
  - text: render the template
    source: phrase_map
  - text: render social card
    source: phrase_map
  - text: generate social post
    source: phrase_map
  - text: render social post
    source: phrase_map
  - text: make a social card
    source: phrase_map
  - text: render to png
    source: phrase_map
  - text: html screenshot
    source: phrase_map
  - text: turn this html file into a png for me
    source: authored
  - text: convert the card template to an image i can share
    source: authored
  - text: export the quote template as a png
    source: authored
  - text: bake the html into a shareable graphic
    source: authored
  - text: capture the landing page html as an image
    source: authored
  - text: make a png out of the twitter card html
    source: authored
