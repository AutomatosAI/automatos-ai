# PRD-232 US-005 — synthetic utterance corpus (category: capabilities)
# =============================================================================
# Seed INPUT data for the Intent Graph (NOT eval gold; decision §6.3). Every
# registered non-super_admin_only action in this category gets 15-25 diverse
# utterances a user might type to invoke it. Consumed by US-006
# (ActionSemanticIndex embedding text) and US-007 (seeded intent clusters).
#
# Schema:
#   version:  1                     corpus schema version
#   category: capabilities                 registry category (== filename stem)
#   actions:
#     <action_name>:
#       - text: "<what the user types>"
#         source: authored | example | phrase_map
#
#   source provenance:
#     example    — folded verbatim from ActionDefinition.examples
#     phrase_map — folded verbatim from AutoBrain _PLATFORM_KEYWORDS (incl. the
#                  legacy recipe->playbook remap)
#     authored   — written for this corpus (colloquial / terse / verbose /
#                  register variants: ticket·task·card·item, mail·email·inbox,
#                  close·finish·clear·kill·done)
#
# Regenerate/lint:  cd orchestrator && python -m scripts.generate_utterance_corpus
# super_admin_only actions are EXCLUDED (fail-closed, read from the registry flag).
version: 1
category: capabilities
actions:
  platform_find_tools:
  - text: what tools do you have for blogs?
    source: example
  - text: can you work with our codebase?
    source: example
  - text: find a tool to sync the shopify catalog
    source: example
  - text: what can you actually do on this platform?
    source: example
  - text: is there a tool to schedule missions?
    source: authored
  - text: what can you do with documents?
    source: authored
  - text: do you have any way to send emails?
    source: authored
  - text: find me an action for exporting reports
    source: authored
  - text: how would I automate posting to social?
    source: authored
  - text: what capabilities exist for managing agents?
    source: authored
  - text: is there something that handles invoices?
    source: authored
  - text: search your catalog for anything about analytics
    source: authored
  - text: can you help me with calendar events?
    source: authored
  - text: what actions are available for the knowledge base?
    source: authored
  - text: do you have a tool for managing api keys?
    source: authored
  - text: look for a way to run a playbook
    source: authored
  - text: what's available for working with tasks?
    source: authored
  - text: is there an action to create a workspace?
    source: authored
