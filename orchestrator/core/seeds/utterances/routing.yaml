# PRD-232 US-005 — synthetic utterance corpus (category: routing)
# =============================================================================
# Seed INPUT data for the Intent Graph (NOT eval gold; decision §6.3). Every
# registered non-super_admin_only action in this category gets 15-25 diverse
# utterances a user might type to invoke it. Consumed by US-006
# (ActionSemanticIndex embedding text) and US-007 (seeded intent clusters).
#
# Schema:
#   version:  1                     corpus schema version
#   category: routing                 registry category (== filename stem)
#   actions:
#     <action_name>:
#       - text: "<what the user types>"
#         source: authored | example | phrase_map
#
#   source provenance:
#     example    — folded verbatim from ActionDefinition.examples
#     phrase_map — folded verbatim from AutoBrain _PLATFORM_KEYWORDS (incl. the
#                  legacy recipe->playbook remap)
#     authored   — written for this corpus (colloquial / terse / verbose /
#                  register variants: ticket·task·card·item, mail·email·inbox,
#                  close·finish·clear·kill·done)
#
# Regenerate/lint:  cd orchestrator && python -m scripts.generate_utterance_corpus
# super_admin_only actions are EXCLUDED (fail-closed, read from the registry flag).
version: 1
category: routing
actions:
  platform_create_routing_rule:
  - text: route telegram messages to the support agent
    source: example
  - text: send anything mentioning 'invoice' to the billing playbook
    source: example
  - text: set up channel routing for slack
    source: example
  - text: create a routing rule
    source: example
  - text: send all discord messages to the sales agent
    source: authored
  - text: route anything about refunds to the billing playbook
    source: authored
  - text: make a rule that slack goes to the support agent
    source: authored
  - text: any message mentioning outage should hit the ops agent
    source: authored
  - text: set up a keyword rule for the word urgent
    source: authored
  - text: route telegram to the onboarding playbook
    source: authored
  - text: create a high-priority rule for whatsapp billing questions
    source: authored
  - text: direct messages containing password reset to the it agent
    source: authored
  - text: add a routing rule for the slack channel
    source: authored
  - text: whenever someone says invoice, send it to billing
    source: authored
  - text: route customer complaints to the escalation playbook
    source: authored
  - text: set the default handler for teams messages to the support agent
    source: authored
  - text: make anything from discord go to the community agent
    source: authored
  - text: create a rule routing pricing questions to the sales playbook
    source: authored
