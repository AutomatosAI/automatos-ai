# =============================================================================
# Automatos AI - Unified Docker Compose
# =============================================================================
# Quick Start:
#   1. Copy .env.example to .env and set required values (POSTGRES_PASSWORD, REDIS_PASSWORD, API_KEY)
#   2. Run: docker-compose up --build
#   3. Access: http://localhost:3000
#   4. Go to Settings > Credentials to add API keys (OpenAI, Anthropic, etc.)
#
# A .env file IS REQUIRED with at minimum: POSTGRES_PASSWORD, REDIS_PASSWORD, API_KEY
# All LLM credentials managed via the Settings UI.
#
# Profiles:
#   - Default: postgres, redis, minio (+ minio-init), backend, frontend and the
#     workspace-worker (Code Canvas runtime). The worker's files live in a host
#     directory bind-mounted at /workspaces — AUTOMATOS_WORKSPACE_DIR in .env,
#     default ./workspaces next to this file, created on first boot (PRD-233 S1).
#   - All: Add --profile all (adminer database GUI, gotenberg document conversion)
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database with pgvector
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: automatos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set in .env file}
      POSTGRES_INITDB_ARGS: "-c max_connections=200 -c shared_buffers=256MB"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - automatos

  # ===========================================================================
  # Redis Cache & Session Store
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: automatos_redis
    restart: unless-stopped
    # PRD-70 FIX-05: Disable dangerous Redis commands to prevent data wipe if exposed.
    # Note: CONFIG rename breaks redis-cli CONFIG commands — acceptable for production.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - set in .env file}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
      --rename-command DEBUG ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - automatos

  # ===========================================================================
  # MinIO — local S3-compatible object store (PRD-176 F089)
  # ===========================================================================
  # Gives the knowledge flywheel a durable local object store so generated
  # outputs persist instead of fail-softing to None on ephemeral disk. The
  # backend talks to it through the existing S3 seam via S3_ENDPOINT_URL.
  # Prod is unchanged (real AWS S3, S3_ENDPOINT_URL unset).
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: automatos_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - automatos

  # One-shot: create the documents bucket the flywheel writes to, then exit.
  minio-init:
    image: minio/mc:latest
    container_name: automatos_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_DOCUMENTS_BUCKET: ${S3_DOCUMENTS_BUCKET:-automatos-ai}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_DOCUMENTS_BUCKET} &&
      echo 'MinIO bucket ready: '$${S3_DOCUMENTS_BUCKET}
      "
    networks:
      - automatos

  # ===========================================================================
  # Backend API (FastAPI)
  # ===========================================================================
  backend:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
      target: development
    container_name: automatos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Local-edition topology + edition defaults (AUTH_EDITION=local,
    # DEFAULT_WORKSPACE_ID, MinIO/mem0/qdrant wiring). NO secrets — those stay in
    # `environment:` below as `:?`-required. `environment:` overrides env_file, so
    # secrets stay explicit and the edition/topology defaults stay silent. Railway
    # never reads this file, so local-default costs SaaS nothing (constraint A).
    env_file:
      - envs/api.defaults
      # Personal overrides for ANY backend var (gitignored, optional) — the
      # deep-override lane: .env only reaches vars this file references, while
      # api.local reaches all ~360 config.py dials. Later file wins.
      - path: envs/api.local
        required: false
    environment:
      # Database
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestrator_db}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # LLM API Keys (optional — any ONE unlocks AI features; QUICKSTART step 1)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Composio (hosted tool integrations) — bring your own key; without it the
      # integrations surface stays empty (PRD-233 makes that honest in the UI).
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}

      # Object storage — local MinIO via the S3 seam (PRD-176 F089).
      # S3_ENDPOINT_URL points boto at MinIO. The store's credentials are mapped
      # through S3_* names on purpose (PRD-233 S4 finding): a developer's AWS_*
      # in .env or the shell must never reach the local store — with a real
      # AWS key in AWS_ACCESS_KEY_ID every server-side call to MinIO failed
      # InvalidAccessKeyId. To use real S3 locally instead: S3_ENDPOINT_URL=
      # (empty) + S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY / S3_REGION in .env.
      # Prod (Railway) never reads this file and keeps its AWS_* env.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_DOCUMENTS_BUCKET: ${S3_DOCUMENTS_BUCKET:-automatos-ai}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      AWS_REGION: ${S3_REGION:-us-east-1}

      # Document Generation (PRD-63)
      GOTENBERG_URL: http://gotenberg:3000

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Security
      API_KEY: ${API_KEY:?API_KEY is required - set in .env file}
      # Optional shared secret for the workspace-worker's internal HTTP API —
      # sent as X-Internal-Token; must match the worker's value (empty = none,
      # the worker port is never published outside the compose network).
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-}
      
      # Clerk Authentication — SaaS-only. `:-` (not `:?`) so their ABSENCE never
      # blocks `docker compose up` in local mode; when set (saas) they resolve
      # byte-identically. AUTH_EDITION=local (from env_file) makes the backend's
      # validate_auth_edition() skip the Clerk requirement entirely.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount source for hot-reload in development
      - ./orchestrator:/app
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      # Persists the auto-generated credential-encryption key (see envs/api.defaults).
      - backend_data:/app/data
      - backend_logs:/app/logs
      # The workspace-worker's host directory, read-only (PRD-233 S1): the
      # backend's WORKSPACE_VOLUME_PATH view of agent deliverables. The file
      # browser and Code Canvas go through the worker's HTTP API instead
      # (WORKER_INTERNAL_URL in envs/api.defaults).
      - ${AUTOMATOS_WORKSPACE_DIR:-./workspaces}:/workspaces:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - automatos

  # ===========================================================================
  # Frontend (Next.js)
  # ===========================================================================
  # Note: For active frontend development, you can run locally instead:
  #   cd frontend && npm install && npm run dev
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: automatos_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Local-edition frontend defaults (NEXT_PUBLIC_AUTH_EDITION=local). No secrets.
    env_file:
      - envs/frontend.defaults
      - path: envs/frontend.local
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
      # Deliberately NO API_KEY here: the local edition is anonymous end to end —
      # the chat proxy forwards the browser's anonymous session (which the local
      # backend treats as workspace owner / super admin), exactly like direct calls.
      # An API-key principal would hit the workspace-permission gate instead (403).
      # SaaS-only; `:-` so its absence never blocks local `docker compose up`.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Mount source for hot-reload
      - ./frontend:/app
      # Prevent overwriting node_modules and build artifacts
      - /app/node_modules
      - /app/.next
    networks:
      - automatos

  # ===========================================================================
  # Workspace Worker — the Code Canvas runtime (PRD-56 Phase 2 · PRD-170 · PRD-233 S1)
  # ===========================================================================
  # Runs in the DEFAULT profile: agents act on files that live on YOUR machine.
  # The host directory ${AUTOMATOS_WORKSPACE_DIR:-./workspaces} is bind-mounted
  # at /workspaces (created on first boot). Each workspace gets
  # /workspaces/<workspace_id>/; every Code Canvas tool call is confined to it
  # (canvas_confinement.py) and mutations still need approval
  # (canvas_approvals.py) — local is not unguarded. AUTOMATOS_WORKSPACE_DIR in
  # .env is the ONE dial that widens host access. The backend reaches this
  # service over the compose network at WORKER_INTERNAL_URL (envs/api.defaults).
  # ===========================================================================
  workspace-worker:
    build:
      context: ./services/workspace-worker
      dockerfile: Dockerfile
    container_name: automatos_workspace_worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestrator_db}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Workspace config — the IN-CONTAINER mount root (worker_config.workspace_root);
      # the host side is the bind mount under `volumes:` below.
      WORKSPACE_VOLUME_PATH: /workspaces
      WORKSPACE_DEFAULT_QUOTA_GB: ${WORKSPACE_DEFAULT_QUOTA_GB:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_HEALTH_PORT: 8081
      # PRD-203 C·S8: model credential for the headless Claude Agent SDK
      # subprocess (canvas prompt loop). Without one the SDK connects and idles.
      # Set the same value on the Railway workspace-worker service.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Optional shared secret for this service's internal HTTP API (the
      # backend sends the same value as X-Internal-Token; empty = no token).
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-}
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The worker's log relay targets Railway's internal Loki push endpoint by
      # default (automatos_logging.py); off locally, like the backend.
      LOG_RELAY_ENABLED: "false"
      SERVICE_NAME: workspace-worker
    volumes:
      # Host directory (bind mount, read-write) — the ONE host-access dial.
      - ${AUTOMATOS_WORKSPACE_DIR:-./workspaces}:/workspaces
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - automatos

  # ===========================================================================
  # ADMIN TOOLS PROFILE - Add with: --profile all
  # ===========================================================================
  
  adminer:
    image: adminer:latest
    container_name: automatos_adminer
    restart: unless-stopped
    profiles: ["all"]
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - automatos

  # ===========================================================================
  # Gotenberg - Document Conversion Sidecar (PRD-63)
  # DOCX/XLSX → PDF via Chromium + LibreOffice
  # ===========================================================================
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: automatos_gotenberg
    restart: unless-stopped
    profiles: ["all"]
    environment:
      GOTENBERG_API_TIMEOUT: "120s"
      GOTENBERG_LOG_LEVEL: "info"
    ports:
      - "${GOTENBERG_PORT:-3001}:3000"
    networks:
      - automatos

# =============================================================================
# Volumes - Persistent Data Storage
# =============================================================================
volumes:
  backend_data:
  postgres_data:
    driver: local
    name: automatos_postgres_data
  redis_data:
    driver: local
    name: automatos_redis_data
  minio_data:
    driver: local
    name: automatos_minio_data
  backend_logs:
    driver: local
    name: automatos_backend_logs

# =============================================================================
# Networks
# =============================================================================
networks:
  automatos:
    driver: bridge
    name: automatos_network

