# =============================================================================
# Automatos AI - Unified Docker Compose
# =============================================================================
# Quick Start:
#   1. Copy .env.example to .env and set required values (POSTGRES_PASSWORD, REDIS_PASSWORD, API_KEY)
#   2. Run: docker-compose up --build
#   3. Access: http://localhost:3000
#   4. Go to Settings > Credentials to add API keys (OpenAI, Anthropic, etc.)
#
# A .env file IS REQUIRED with at minimum: POSTGRES_PASSWORD, REDIS_PASSWORD, API_KEY
# All LLM credentials managed via the Settings UI.
#
# Profiles:
#   - Default: Core services (postgres, redis, backend, frontend)
#   - All: Add --profile all (includes admin tools)
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database with pgvector
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: automatos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set in .env file}
      POSTGRES_INITDB_ARGS: "-c max_connections=200 -c shared_buffers=256MB"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./orchestrator/core/database/init_complete_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - automatos

  # ===========================================================================
  # Redis Cache & Session Store
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: automatos_redis
    restart: unless-stopped
    # PRD-70 FIX-05: Disable dangerous Redis commands to prevent data wipe if exposed.
    # Note: CONFIG rename breaks redis-cli CONFIG commands — acceptable for production.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - set in .env file}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
      --rename-command DEBUG ""
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - automatos

  # ===========================================================================
  # MinIO — local S3-compatible object store (PRD-176 F089)
  # ===========================================================================
  # Gives the knowledge flywheel a durable local object store so generated
  # outputs persist instead of fail-softing to None on ephemeral disk. The
  # backend talks to it through the existing S3 seam via S3_ENDPOINT_URL.
  # Prod is unchanged (real AWS S3, S3_ENDPOINT_URL unset).
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: automatos_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - automatos

  # One-shot: create the documents bucket the flywheel writes to, then exit.
  minio-init:
    image: minio/mc:latest
    container_name: automatos_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_DOCUMENTS_BUCKET: ${S3_DOCUMENTS_BUCKET:-automatos-ai}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_DOCUMENTS_BUCKET} &&
      echo 'MinIO bucket ready: '$${S3_DOCUMENTS_BUCKET}
      "
    networks:
      - automatos

  # ===========================================================================
  # Backend API (FastAPI)
  # ===========================================================================
  backend:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
      target: development
    container_name: automatos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Database
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestrator_db}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # LLM API Keys (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Object storage — local MinIO via the S3 seam (PRD-176 F089).
      # S3_ENDPOINT_URL points boto at MinIO; the AWS_* creds are the MinIO
      # root creds. Prod leaves S3_ENDPOINT_URL unset and uses real AWS S3.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_DOCUMENTS_BUCKET: ${S3_DOCUMENTS_BUCKET:-automatos-ai}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      AWS_REGION: ${AWS_REGION:-us-east-1}

      # Document Generation (PRD-63)
      GOTENBERG_URL: http://gotenberg:3000

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Security
      API_KEY: ${API_KEY:?API_KEY is required - set in .env file}
      
      # Clerk Authentication
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount source for hot-reload in development
      - ./orchestrator:/app
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - backend_logs:/app/logs
      # PRD-66: Read-only access to workspace files for code viewer widget
      - workspace_data:/workspaces:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - automatos

  # ===========================================================================
  # Frontend (Next.js)
  # ===========================================================================
  # Note: For active frontend development, you can run locally instead:
  #   cd frontend && npm install && npm run dev
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: automatos_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Mount source for hot-reload
      - ./frontend:/app
      # Prevent overwriting node_modules and build artifacts
      - /app/node_modules
      - /app/.next
    networks:
      - automatos

  # ===========================================================================
  # Workspace Worker (PRD-56 Phase 2: Physical Workspaces)
  # ===========================================================================
  # Agent task execution in isolated workspace directories.
  # Enable with: --profile workers
  # ===========================================================================
  workspace-worker:
    build:
      context: ./services/workspace-worker
      dockerfile: Dockerfile
    container_name: automatos_workspace_worker
    restart: unless-stopped
    profiles: ["workers"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestrator_db}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Workspace config
      WORKSPACE_VOLUME_PATH: /workspaces
      WORKSPACE_DEFAULT_QUOTA_GB: ${WORKSPACE_DEFAULT_QUOTA_GB:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_HEALTH_PORT: 8081
      # PRD-203 C·S8: model credential for the headless Claude Agent SDK
      # subprocess (canvas prompt loop). Without one the SDK connects and idles.
      # Set the same value on the Railway workspace-worker service.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - workspace_data:/workspaces
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - automatos

  # ===========================================================================
  # ADMIN TOOLS PROFILE - Add with: --profile all
  # ===========================================================================
  
  adminer:
    image: adminer:latest
    container_name: automatos_adminer
    restart: unless-stopped
    profiles: ["all"]
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - automatos

  # ===========================================================================
  # Gotenberg - Document Conversion Sidecar (PRD-63)
  # DOCX/XLSX → PDF via Chromium + LibreOffice
  # ===========================================================================
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: automatos_gotenberg
    restart: unless-stopped
    profiles: ["all"]
    environment:
      GOTENBERG_API_TIMEOUT: "120s"
      GOTENBERG_LOG_LEVEL: "info"
    ports:
      - "${GOTENBERG_PORT:-3001}:3000"
    networks:
      - automatos

# =============================================================================
# Volumes - Persistent Data Storage
# =============================================================================
volumes:
  postgres_data:
    driver: local
    name: automatos_postgres_data
  redis_data:
    driver: local
    name: automatos_redis_data
  minio_data:
    driver: local
    name: automatos_minio_data
  backend_logs:
    driver: local
    name: automatos_backend_logs
  workspace_data:
    driver: local
    name: automatos_workspace_data

# =============================================================================
# Networks
# =============================================================================
networks:
  automatos:
    driver: bridge
    name: automatos_network

