# =============================================================================
# Automatos AI - Unified Docker Compose
# =============================================================================
# Quick Start:
#   1. Run: docker-compose up --build
#   2. Access: http://localhost:3000
#   3. Go to Settings > Credentials to add API keys (OpenAI, Anthropic, etc.)
#
# No .env file needed! Infrastructure uses secure defaults.
# All credentials managed via the Settings UI.
#
# Profiles:
#   - Default: Core services (postgres, redis, backend, frontend)
#   - All: Add --profile all (includes admin tools)
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database with pgvector
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: automatos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automatos_dev_pass}
      POSTGRES_INITDB_ARGS: "-c max_connections=200 -c shared_buffers=256MB"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./orchestrator/database/init_complete_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - automatos

  # ===========================================================================
  # Redis Cache & Session Store
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: automatos_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-automatos_redis_dev} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-automatos_redis_dev}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - automatos

  # ===========================================================================
  # Backend API (FastAPI)
  # ===========================================================================
  backend:
    build:
      context: ..
      dockerfile: automatos-ai/orchestrator/Dockerfile
      target: development
    container_name: automatos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automatos_dev_pass}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-automatos_dev_pass}@postgres:5432/${POSTGRES_DB:-orchestrator_db}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-automatos_redis_dev}
      
      # LLM API Keys (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Security
      API_KEY: ${API_KEY:-dev_api_key_change_in_production}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount source for hot-reload in development
      - ./orchestrator:/app
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - automatos

  # ===========================================================================
  # Frontend (Next.js)
  # ===========================================================================
  # Note: For active frontend development, you can run locally instead:
  #   cd frontend && npm install && npm run dev
  # ===========================================================================
  frontend:
    build:
      context: ..
      dockerfile: automatos-ai/frontend/Dockerfile
      target: development
    container_name: automatos_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Mount source for hot-reload
      - ./frontend:/app
      # Prevent overwriting node_modules and build artifacts
      - /app/node_modules
      - /app/.next
    networks:
      - automatos

  # ===========================================================================
  # ADMIN TOOLS PROFILE - Add with: --profile all
  # ===========================================================================
  
  adminer:
    image: adminer:latest
    container_name: automatos_adminer
    restart: unless-stopped
    profiles: ["all"]
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - automatos

# =============================================================================
# Volumes - Persistent Data Storage
# =============================================================================
volumes:
  postgres_data:
    driver: local
    name: automatos_postgres_data
  redis_data:
    driver: local
    name: automatos_redis_data
  backend_logs:
    driver: local
    name: automatos_backend_logs

# =============================================================================
# Networks
# =============================================================================
networks:
  automatos:
    driver: bridge
    name: automatos_network

