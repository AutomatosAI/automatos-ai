# =============================================================================
# Automatos AI - Unified Docker Compose
# =============================================================================
# Quick Start:
#   0. Docker Engine 25 or later with Compose 2.24.4 or later. The healthchecks below
#      probe every second while a service starts (start_interval), and Compose refuses
#      that key on an older engine. `make up` checks both first (PRD-262 US-038).
#   1. .env with the required values (POSTGRES_PASSWORD, REDIS_PASSWORD, API_KEY): `make up`
#      writes them (make env, PRD-262 US-037); without make, self-hosting.md §1b
#   PRD-234/262: every published port, the web app included, listens on ${BIND_ADDRESS:-127.0.0.1}
#   — this machine only. Set BIND_ADDRESS=0.0.0.0 in .env to expose them to your network
#   deliberately (whoever reaches the local edition is its owner; session mode runs commands).
#   PRD-266: API_PUBLISH_ADDRESS (the backend) and WEB_PUBLISH_ADDRESS (the frontend) publish
#   only those two, each defaulting to BIND_ADDRESS; Postgres, Redis, MinIO, Qdrant, Adminer
#   and SearXNG always stay on BIND_ADDRESS. LOCAL_REMOTE_ACCESS (off | paired | open) says
#   who may call a published install. off (the default) refuses to start the backend while
#   either address reaches beyond loopback; paired makes every phone and browser pair with
#   a one-time code (docker compose exec backend python -m scripts.mint_pairing_code); open
#   keeps the anonymous owner and warns at every boot.
#   2. Run: make up (or docker compose up)
#   3. Access: http://localhost:3000
#   4. Add an LLM key: Settings → API Keys in the UI, or OPENAI_API_KEY /
#      ANTHROPIC_API_KEY / OPENROUTER_API_KEY in .env (passed through below)
#
# This file runs the production images, the ones CI builds and scans: the code is
# inside them and nothing reloads (PRD-262 US-035). Editing the code instead:
# `make dev` (docker-compose.dev.yml) builds the development stages, mounts your
# source and runs uvicorn --reload and the Next.js dev server.
#
# The three app services (backend, frontend, workspace-worker) name the image CI
# publishes, ghcr.io/automatosai/automatos-<x>:${AUTOMATOS_IMAGE_TAG:-edge}, next to
# their build: (PRD-262 US-036). Compose pulls it first and builds only when no such
# image exists. `make up` picks the tag for this checkout (sha-<7>, edge, or a
# local-<sha7> it re-tags or builds), pulls it, starts the stack with --no-build and
# writes the tag to .env, so later plain compose commands run the same images.
# `make build` builds all three from source as local-<sha7>.
# Source builds outside make: `AUTOMATOS_IMAGE_TAG=local-<ref> docker compose up -d
# --build` builds the production stages under a tag no pull ever replaces (no local-*
# tag is published). Image names are global to the Docker engine, so a second stack
# next to this one sets its own local-<ref> in its .env. A plain `docker compose up
# --build` with no tag tags its build :edge, which the next `make up` that picks edge
# pulls over. Every local build is labelled org.opencontainers.image.revision from
# AUTOMATOS_REVISION (make exports git HEAD, -dirty with uncommitted changes in a
# context; `unknown` without it), as the published images are by CI.
#
# A .env file IS REQUIRED with at minimum: POSTGRES_PASSWORD, REDIS_PASSWORD, API_KEY,
# none of them a CHANGE_ME placeholder from .env.example: the backend refuses to start
# on one (orchestrator/docker-secrets-guard.sh).
# LLM keys live in the database (Settings → API Keys) or in .env; the stored key
# also drives embeddings locally (PLATFORM_KEY_WORKSPACE_ID in envs/api.defaults).
#
# Profiles:
#   - Default: postgres, redis, minio, backend, frontend and the
#     workspace-worker (Code Canvas runtime), plus minio-volume-owner, a one-shot
#     that runs before MinIO and exits (PRD-262 US-041). The worker's files live
#     in a host directory — AUTOMATOS_WORKSPACE_DIR in .env, default ./workspaces next to
#     this file, created on first boot (PRD-233 S1). It is mounted as THE local
#     workspace's root (/workspaces/<DEFAULT_WORKSPACE_ID>), so on your machine
#     it holds artifacts/, reports/, sessions/… directly — no workspace-id
#     folder in between. Point it next to your projects folder
#     (e.g. LOCAL_PROJECTS_DIR=~/Development, AUTOMATOS_WORKSPACE_DIR=~/Development/deliverables)
#     and Deliverables → Explorer, the chat's Code mode and your Claude Code
#     sessions all read and write the one place. Every OTHER workspace on this
#     stack (a second workspace, a test workspace) lives in the named volume
#     automatos_workspaces_data, so it survives `docker compose up --build` too
#     (F220); only `docker compose down -v` removes it.
#   - All: Add --profile all (adminer, the database GUI)
#   - Memory: Add --profile memory (qdrant, durable memory; also QDRANT_URL, below)
#   - Search: Add --profile search (searxng, web search for agents; also SEARXNG_URL)
#   - Media: Add --profile media (media-render, the Socials video/image renderer;
#     PRD-251 D3). Without it, rendering a post says it needs the media profile.
#   - Voice: Add --profile voice (voice-tts, Auto's server voice) and VOICE_TTS_URL=http://voice-tts:8100 in .env
#   - Core, five containers (PRD-262 US-040): `make up CORE=1`, or
#     docker compose -f docker-compose.yml -f docker-compose.core.yml up -d
#     The override puts the workspace-worker behind a `workspace` profile, so
#     postgres, redis, minio, backend and frontend run without it. Agents' workspace
#     tools, the Deliverables file browser and Code Canvas then answer "Workspace
#     worker not running". The default stays six containers, the worker included,
#     for every .env old or new: no key turns the worker off.
#   docs/getting-started/self-hosting.md §3 lists every service, profile and the core
#   override; orchestrator/tests/test_prd262_self_host_docs.py holds it to this file.
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database with pgvector
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: automatos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set in .env file}
      POSTGRES_INITDB_ARGS: "-c max_connections=200 -c shared_buffers=256MB"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PRD-262 US-038: probed every second while it starts (start_interval, Docker Engine
    # 25 or later), so the backend starts within about a second of Postgres being ready.
    # Over TCP (-h 127.0.0.1): on a fresh volume, initdb first runs a temporary server
    # that listens on the unix socket alone, and a socket probe would pass on it. The
    # start period covers a slow first initdb, so the 1 s probes last until it is done.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s
    networks:
      - automatos

  # ===========================================================================
  # Redis Cache & Session Store
  # ===========================================================================
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: automatos_redis
    restart: unless-stopped
    # PRD-70 FIX-05: Disable dangerous Redis commands to prevent data wipe if exposed.
    # Note: CONFIG rename breaks redis-cli CONFIG commands — acceptable for production.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - set in .env file}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
      --rename-command DEBUG ""
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    # PRD-262 US-038: probed every second while it starts (start_interval, Docker Engine
    # 25 or later); CI holds it to healthy within 2 s of its start
    # (scripts/ci/smoke_health_gates.py). The 1 s probes run only inside start_period,
    # and the first passing one ends it, so the longer period costs a fast start nothing.
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    networks:
      - automatos

  # ===========================================================================
  # minio-volume-owner — hands MinIO's volume to MinIO's own user (PRD-262 US-041)
  # ===========================================================================
  # MinIO runs as its image's user, uid 65532, not root. A minio_data volume that
  # the official minio/minio image (or this stack, before US-041) wrote as root
  # would refuse it. This one-shot re-owns such a volume to 65532:65532 once,
  # says so in its log, and exits; on a volume already MinIO's it changes nothing.
  # minio waits for it to finish (service_completed_successfully), so make up,
  # plain `docker compose up` and every documented compose command repair an old
  # volume before MinIO starts. A repair in the Makefile alone would leave plain
  # compose upgrades with an unhealthy MinIO, and so no backend (it waits for
  # minio: service_healthy).
  # It runs on the stack's own digest-pinned redis image, already pulled, whose
  # busybox has stat and chown: root, with no network and only the capabilities
  # chown needs. Its image stays equal to redis's (a test holds them together).
  # $$ is a literal $ to compose, which would otherwise read $owner as a variable.
  # ===========================================================================
  minio-volume-owner:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: automatos_minio_volume_owner
    restart: "no"
    user: "0:0"
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    volumes:
      - minio_data:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        owner="$$(stat -c '%u:%g' /data)"
        if [ "$$owner" = "65532:65532" ]; then
          exit 0
        fi
        if ! chown -R 65532:65532 /data; then
          echo "minio-volume-owner: could not re-own /data (owned by $$owner) to 65532:65532, the user MinIO runs as" >&2
          exit 1
        fi
        echo "minio-volume-owner: /data was owned by $$owner; re-owned it to 65532:65532, the user MinIO runs as (PRD-262 US-041)"

  # ===========================================================================
  # MinIO — local S3-compatible object store (PRD-176 F089)
  # ===========================================================================
  # Gives the knowledge flywheel a durable local object store so generated
  # outputs persist instead of fail-softing to None on ephemeral disk. The
  # backend talks to it through the existing S3 seam via S3_ENDPOINT_URL.
  # Prod is unchanged (real AWS S3, S3_ENDPOINT_URL unset).
  # ===========================================================================
  minio:
    # MinIO no longer publishes free images: quay.io/minio/minio and Docker Hub's
    # minio/minio both refuse anonymous pulls (401) since 2026-09, which broke
    # `docker compose up` and the fresh-clone smoke lane. Chainguard publishes a
    # maintained build; its free tier offers only `latest`, so the digest pins it
    # and Dependabot moves the digest weekly (.github/dependabot.yml, PRD-262).
    image: cgr.dev/chainguard/minio:latest@sha256:2915cb406f38ed6ff9634de0a3e4a9423e2dda06a6f1aca18f8c968aa37a01f6
    container_name: automatos_minio
    restart: unless-stopped
    # No user: key. MinIO runs as the image's own user, uid 65532, never root
    # (PRD-262 US-041); minio-volume-owner, above, re-owns a volume root wrote first.
    depends_on:
      minio-volume-owner:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    # PRD-262 US-038: probed every second while it starts (start_interval, Docker Engine
    # 25 or later); CI holds it to healthy within 2 s of its start
    # (scripts/ci/smoke_health_gates.py). The 1 s probes run only inside start_period,
    # and the first passing one ends it, so the longer period costs a fast start nothing.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    networks:
      - automatos
  # (minio-init deleted — S4's storage factory calls ensure_bucket() on first
  # use for every bucket against any S3-compatible endpoint, so the one-shot mc
  # container was an extra 82 MB image doing work the app now does itself.)

  # ===========================================================================
  # Qdrant — durable (L3) + field memory. OPT-IN (PRD-238 S10):
  #   docker compose --profile memory up -d
  # and QDRANT_URL=http://qdrant:6333 in envs/api.local. With the profile off
  # the backend keeps memory honestly off (QDRANT_URL is empty by default).
  # Prod is unchanged (hosted Qdrant via its own QDRANT_URL).
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:latest@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    container_name: automatos_qdrant
    restart: unless-stopped
    profiles: ["memory"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - automatos

  backend:
    # The image CI publishes (PRD-262 US-036), pulled before anything is built.
    image: ghcr.io/automatosai/automatos-api:${AUTOMATOS_IMAGE_TAG:-edge}
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
      # No build args: one API dependency set for every build, Leiden through
      # graspologic-native included (PRD-262 US-027).
      # A local build carries its commit, as images.yml's published ones do.
      labels:
        org.opencontainers.image.revision: ${AUTOMATOS_REVISION:-unknown}
      # PRD-262 US-035: the stage CI builds, scans and publishes, with the code inside
      # the image. Its worker count comes from WEB_CONCURRENCY (envs/api.defaults).
      # Hot reload is `make dev`: docker-compose.dev.yml builds the development stage
      # and mounts the source, the entrypoint and the healthcheck.
      target: production
    container_name: automatos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # F220: the worker mounts workspaces_data first, so a fresh volume takes the
      # worker image's /workspaces ownership (uid 1000), never root's; the backend
      # image's /workspaces is uid 1000 too, for a stack without the worker (PRD-262
      # US-040). required: false lets docker-compose.core.yml (make up CORE=1) leave the
      # worker out: the backend then starts without it and its workspace calls answer
      # "Workspace worker not running".
      workspace-worker:
        condition: service_started
        required: false
    # Local-edition topology + edition defaults (AUTH_EDITION=local,
    # DEFAULT_WORKSPACE_ID, MinIO/mem0/qdrant wiring). NO secrets — those stay in
    # `environment:` below as `:?`-required. `environment:` overrides env_file, so
    # secrets stay explicit and the edition/topology defaults stay silent. Railway
    # never reads this file, so local-default costs SaaS nothing (constraint A).
    env_file:
      - envs/api.defaults
      # Personal overrides for ANY backend var (gitignored, optional) — the
      # deep-override lane: .env only reaches vars this file references, while
      # api.local reaches all ~360 config.py dials. Later file wins. An edit applies
      # with `docker compose up -d --no-deps backend`, which recreates the backend
      # (the night tooling's path; the fresh-clone smoke checks it, PRD-262 US-035).
      - path: envs/api.local
        required: false
    environment:
      # Database
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestrator_db}
      
      # Redis — REDIS_URL is set here too because config.py prefers it over
      # REDIS_HOST/PORT and loads orchestrator/.env at import: a .env carrying a
      # hosted (Railway) REDIS_URL silently pointed the whole local stack at that
      # remote Redis (2026-09-16: every chat reply stalled mid-sentence behind it).
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      
      # LLM API Keys (optional — any ONE unlocks AI features; QUICKSTART step 1)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional: pin the credential-encryption key instead of the auto-generated
      # one on the backend_data volume (CREDENTIAL_KEY_FILE in envs/api.defaults).
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      # Composio (hosted tool integrations) — bring your own key; without it the
      # integrations surface stays empty (PRD-233 makes that honest in the UI).
      # COMPOSIO_KEY is the canonical name (it matches the Railway variable);
      # config.py accepts COMPOSIO_API_KEY as an alias. BOTH are forwarded — only
      # COMPOSIO_API_KEY used to be, so a .env carrying COMPOSIO_KEY never reached
      # the process and integrations stayed off with no way to tell why.
      COMPOSIO_KEY: ${COMPOSIO_KEY:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      # Firecrawl (the onboarding site scan, api/wizard.py): config.py reads
      # FIRECRAWL_API_KEY but it was never forwarded — a .env key could not reach
      # the process and the scan reported "Firecrawl is not configured" regardless.
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      # PRD-240 — agents read and search the web. On by default in the local
      # edition; WEB_ACCESS_DENY blocks hosts (suffix match); WEB_SEARCH_PROVIDER
      # pins the search engine (auto = openrouter -> composio -> searxng).
      # Private/loopback/link-local ranges are always refused, regardless.
      WEB_ACCESS: ${WEB_ACCESS:-}
      WEB_ACCESS_DENY: ${WEB_ACCESS_DENY:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-auto}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      WEB_SEARCH_MAX_USES_PER_TURN: ${WEB_SEARCH_MAX_USES_PER_TURN:-3}
      WEB_SEARCH_OPENROUTER_MODEL: ${WEB_SEARCH_OPENROUTER_MODEL:-openai/gpt-4o-mini}
      # Set to http://searxng:8080 when the search profile is up.
      SEARXNG_URL: ${SEARXNG_URL:-}
      WEB_FETCH_MAX_BYTES: ${WEB_FETCH_MAX_BYTES:-2097152}
      WEB_FETCH_TIMEOUT_SECONDS: ${WEB_FETCH_TIMEOUT_SECONDS:-20}
      # PRD-234 Session mode — tickets of `runtime: cli` agents run as YOUR OWN
      # Claude Code sessions on this machine via `make cli-host`. Off by default;
      # the boot guard refuses it outside the local edition. Set it in .env.
      CLI_RUNTIME_ENABLED: ${CLI_RUNTIME_ENABLED:-false}
      # PRD-234 S2: where the owner's projects folder lives on the HOST (a string for
      # path mapping only — the folder itself is mounted into the workspace-worker).
      LOCAL_PROJECTS_DIR: ${LOCAL_PROJECTS_DIR:-}
      LOCAL_PROJECTS_MOUNT: ${LOCAL_PROJECTS_MOUNT:-ro}
      # The deliverables root on the HOST (the folder mounted as the local
      # workspace's root, below) — a string for path mapping and for Settings →
      # Session mode. `make up` exports it absolute; a relative value (plain
      # `docker compose up`) is shown but not used for mapping.
      AUTOMATOS_WORKSPACE_DIR: ${AUTOMATOS_WORKSPACE_DIR:-./workspaces}

      # Object storage — local MinIO via the S3 seam (PRD-176 F089).
      # S3_ENDPOINT_URL points boto at MinIO. The store's credentials are mapped
      # through S3_* names on purpose (PRD-233 S4 finding): a developer's AWS_*
      # in .env or the shell must never reach the local store — with a real
      # AWS key in AWS_ACCESS_KEY_ID every server-side call to MinIO failed
      # InvalidAccessKeyId. To use real S3 locally instead: S3_ENDPOINT_URL=
      # (empty) + S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY / S3_REGION in .env.
      # Prod (Railway) never reads this file and keeps its AWS_* env.
      # `-` (no colon) on purpose: an EMPTY S3_ENDPOINT_URL in .env means 'real S3'
      # (`:-` would silently put MinIO back). Then also override S3_PUBLIC_ENDPOINT_URL=
      # and S3_USE_PATH_STYLE=false in envs/api.local.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://minio:9000}
      S3_DOCUMENTS_BUCKET: ${S3_DOCUMENTS_BUCKET:-automatos-ai}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      AWS_REGION: ${S3_REGION:-us-east-1}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Security
      API_KEY: ${API_KEY:?API_KEY is required - set in .env file}
      # Optional shared secret for the workspace-worker's internal HTTP API —
      # sent as X-Internal-Token; must match the worker's value (empty = none,
      # the worker port is never published outside the compose network).
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-}
      # The same, for media-render (the media profile). SOCIALS_RENDER_URL is in
      # envs/api.defaults.
      SOCIALS_RENDER_TOKEN: ${SOCIALS_RENDER_TOKEN:-}
      # Auto's server voice (the voice profile); empty = off, the device speaks.
      VOICE_TTS_URL: ${VOICE_TTS_URL:-}
      VOICE_TTS_TOKEN: ${VOICE_TTS_TOKEN:-}
      
      # Clerk Authentication — SaaS-only. `:-` (not `:?`) so their ABSENCE never
      # blocks `docker compose up` in local mode; when set (saas) they resolve
      # byte-identically. AUTH_EDITION=local (from env_file) makes the backend's
      # validate_auth_edition() skip the Clerk requirement entirely.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}

      # PRD-266 remote access (header): the two publish addresses below, so the backend
      # knows whether it is reachable beyond this machine, and who may call it then.
      API_PUBLISH_ADDRESS: ${API_PUBLISH_ADDRESS:-${BIND_ADDRESS:-127.0.0.1}}
      WEB_PUBLISH_ADDRESS: ${WEB_PUBLISH_ADDRESS:-${BIND_ADDRESS:-127.0.0.1}}
      LOCAL_REMOTE_ACCESS: ${LOCAL_REMOTE_ACCESS:-off}
    ports:
      - "${API_PUBLISH_ADDRESS:-${BIND_ADDRESS:-127.0.0.1}}:${API_PORT:-8000}:8000"
    volumes:
      # No checkout over the image (PRD-262 US-035): the code, the entrypoint and the
      # healthcheck are the image's own. Only data mounts here; `make dev` adds the
      # source mounts (docker-compose.dev.yml).
      # Persists the auto-generated credential-encryption key (see envs/api.defaults).
      - backend_data:/app/data
      # The backend's log files, on a named volume that outlives a recreate (kept for
      # the night and test tooling, PRD-262 §9-Q1).
      - backend_logs:/app/logs
      # The workspace-worker's files, read-only (PRD-233 S1): the backend's
      # WORKSPACE_VOLUME_PATH view of agent deliverables (session files it adopts,
      # their sizes, HARNESS's reads). The file browser and Code Canvas go through
      # the worker's HTTP API instead (WORKER_INTERNAL_URL in envs/api.defaults).
      # Same shape as the worker's mounts below: every workspace in the named
      # volume (F220), the local workspace's root nested in it from your folder.
      - workspaces_data:/workspaces:ro
      - ${AUTOMATOS_WORKSPACE_DIR:-./workspaces}:/workspaces/${DEFAULT_WORKSPACE_ID:-00000000-0000-0000-0000-0000000000c1}:ro
    healthcheck:
      # The same probe the entrypoint's liveness watchdog runs (F416): Docker only
      # marks the container unhealthy, and restart: unless-stopped never applies to
      # an unhealthy container, so with AUTOMATOS_LIVENESS_WATCHDOG=true
      # (envs/api.defaults) the entrypoint stops a backend that has stopped
      # serving after 3 failed probes 30 s apart; the container exits and is
      # restarted within ~2 minutes.
      test: ["CMD", "docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      # F228 (2 Oct): a boot with migrations and seeds took 147 s, past the old
      # 40 s + 3 x 30 s budget, so the backend was marked unhealthy and the
      # frontend never started. A probe that passes inside start_period marks it
      # healthy at once, so a fast boot waits for nothing more.
      start_period: 300s
      # PRD-262 US-038: inside start_period Docker probes every second, not every 30 s
      # (Docker Engine 25 or later), so the frontend, which waits for a healthy
      # backend, starts within about 2 s of the backend answering /health.
      start_interval: 1s
    networks:
      - automatos

  # ===========================================================================
  # Frontend (Next.js)
  # ===========================================================================
  # Note: For active frontend development, you can run locally instead:
  #   cd frontend && npm install && npm run dev
  # ===========================================================================
  frontend:
    # The image CI publishes (PRD-262 US-036). It inlines images.yml's build args
    # (the local edition, localhost:8000 and localhost:9000); `make up` builds the
    # frontend here instead when .env sets other NEXT_PUBLIC_* values.
    image: ghcr.io/automatosai/automatos-frontend:${AUTOMATOS_IMAGE_TAG:-edge}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # PRD-233: the SHIPPED local edition runs the Next.js standalone build
      # (~350 MB, ~200 MB RAM) — not the dev server, which carried every
      # devDependency (1.7 GB image, 3.2 GB RAM). Contributors who want hot
      # reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
        NEXT_PUBLIC_AUTH_EDITION: ${NEXT_PUBLIC_AUTH_EDITION:-local}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        # F237: the browser loads presigned media from MinIO's public origin (S3_PUBLIC_ENDPOINT_URL).
        NEXT_PUBLIC_MEDIA_ORIGINS: ${NEXT_PUBLIC_MEDIA_ORIGINS:-http://localhost:9000}
      labels:
        org.opencontainers.image.revision: ${AUTOMATOS_REVISION:-unknown}
    container_name: automatos_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Local-edition frontend defaults (NEXT_PUBLIC_AUTH_EDITION=local). No secrets.
    env_file:
      - envs/frontend.defaults
      - path: envs/frontend.local
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
      # Deliberately NO API_KEY here: the local edition is anonymous end to end —
      # the chat proxy forwards the browser's anonymous session (which the local
      # backend treats as workspace owner / super admin), exactly like direct calls.
      # An API-key principal would hit the workspace-permission gate instead (403).
      # SaaS-only; `:-` so its absence never blocks local `docker compose up`.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      # The dev server (docker-compose.dev.yml) reads next.config.js at start, from this env.
      NEXT_PUBLIC_MEDIA_ORIGINS: ${NEXT_PUBLIC_MEDIA_ORIGINS:-http://localhost:9000}
      NODE_ENV: production
    ports:
      - "${WEB_PUBLISH_ADDRESS:-${BIND_ADDRESS:-127.0.0.1}}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - automatos

  # ===========================================================================
  # Workspace Worker — the Code Canvas runtime (PRD-56 Phase 2 · PRD-170 · PRD-233 S1)
  # ===========================================================================
  # Runs in the DEFAULT profile: agents act on files that live on YOUR machine.
  # The host directory ${AUTOMATOS_WORKSPACE_DIR:-./workspaces} is bind-mounted
  # as the local workspace's root, /workspaces/<DEFAULT_WORKSPACE_ID> (created
  # on first boot): the worker still sees /workspaces/<workspace_id>/…, your
  # machine sees artifacts/, reports/, sessions/… directly. Every Code Canvas
  # tool call is confined to that root (canvas_confinement.py) and mutations
  # still need approval (canvas_approvals.py) — local is not unguarded.
  # AUTOMATOS_WORKSPACE_DIR in .env is the ONE dial that widens host access.
  # The backend reaches this service over the compose network at
  # WORKER_INTERNAL_URL (envs/api.defaults).
  # ===========================================================================
  workspace-worker:
    # The image CI publishes (PRD-262 US-036), pulled before anything is built.
    image: ghcr.io/automatosai/automatos-workspace-worker:${AUTOMATOS_IMAGE_TAG:-edge}
    build:
      context: ./services/workspace-worker
      dockerfile: Dockerfile
      args:
        # Production default is a bundled Chromium (1.18 GB); the local edition
        # opts out — workspace_html_to_png says so honestly if used.
        INSTALL_BROWSER: "false"
      labels:
        org.opencontainers.image.revision: ${AUTOMATOS_REVISION:-unknown}
    container_name: automatos_workspace_worker
    restart: unless-stopped
    # F452 (#1309): the worker runs agent code. Its entrypoint starts as root only to re-own
    # the workspace volume (CHOWN; DAC_OVERRIDE to walk folders it doesn't own) and drop to
    # uid 1000 (SETUID, SETGID) with setpriv --no-new-privs; nothing after needs a capability.
    # The chart's worker securityContext keeps the same four.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orchestrator_db}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Workspace config — the IN-CONTAINER mount root (worker_config.workspace_root);
      # the host side is the bind mount under `volumes:` below.
      WORKSPACE_VOLUME_PATH: /workspaces
      # The local workspace's root: your deliverables folder, the bind mount below. When
      # uid 1000 cannot write it (a Linux host whose user has another uid), the entrypoint
      # runs the worker as the folder's owner rather than re-owning it (PRD-262 US-040).
      LOCAL_WORKSPACE_ROOT: /workspaces/${DEFAULT_WORKSPACE_ID:-00000000-0000-0000-0000-0000000000c1}
      WORKSPACE_DEFAULT_QUOTA_GB: ${WORKSPACE_DEFAULT_QUOTA_GB:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_HEALTH_PORT: 8081
      # PRD-203 C·S8: model credential for the headless Claude Agent SDK
      # subprocess (canvas prompt loop). Without one the SDK connects and idles.
      # Set the same value on the Railway workspace-worker service.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Optional shared secret for this service's internal HTTP API (the
      # backend sends the same value as X-Internal-Token; empty = no token).
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-}
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The worker's log relay targets Railway's internal Loki push endpoint by
      # default (automatos_logging.py); off locally, like the backend.
      LOG_RELAY_ENABLED: "false"
      SERVICE_NAME: workspace-worker
    volumes:
      # F220: every workspace's files (/workspaces/<workspace_id>/…) in a named
      # volume. Without it, any workspace but the local one lived in this
      # container's own layer, and `docker compose up --build` discarded its
      # reports, sessions and artifacts while their rows stayed in the database.
      # Railway mounts its volume at /workspaces the same way.
      - workspaces_data:/workspaces
      # Host directory (bind mount, read-write) — the ONE host-access dial,
      # mounted as THE local workspace's root (no <workspace_id> folder on the
      # host), nested inside the volume above. `make up` migrates an older
      # ./workspaces/<workspace_id>/ layout.
      - ${AUTOMATOS_WORKSPACE_DIR:-./workspaces}:/workspaces/${DEFAULT_WORKSPACE_ID:-00000000-0000-0000-0000-0000000000c1}
      # PRD-234 S2 (local edition): your own projects folder, read-only, shown by
      # Deliverables → Explorer under projects/. Sessions write to it through the
      # CLI host on your machine, never through this container. Nested inside the
      # read-write workspace mount above so Docker can create the mountpoint.
      # PRD-235 S5: read-only by default — sessions write through the CLI host on
      # your machine. LOCAL_PROJECTS_MOUNT=rw lets the Canvas editor save into
      # your repositories directly (decision D-B).
      - ${LOCAL_PROJECTS_DIR:-./workspaces/projects}:/workspaces/${DEFAULT_WORKSPACE_ID:-00000000-0000-0000-0000-0000000000c1}/projects:${LOCAL_PROJECTS_MOUNT:-ro}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    # PRD-262 US-038: probed every second while it starts (start_interval, Docker Engine
    # 25 or later), within a start period long enough for a slow first start.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    networks:
      - automatos

  # ===========================================================================
  # media-render — the Socials renderer (PRD-251 D3). Add with: --profile media
  # ===========================================================================
  # Turns a template, the brand kit, the Kokoro voice and the music into a
  # finished MP4 or PNG. It assembles; it never generates. The backend reaches
  # it at SOCIALS_RENDER_URL (envs/api.defaults); its port stays inside the
  # compose network. The image carries Chromium, ffmpeg, Hyperframes and Kokoro,
  # so it is the heaviest image in the stack (docs/getting-started/self-hosting.md).
  # ===========================================================================
  media-render:
    build:
      context: ./services/media-render
      dockerfile: Dockerfile
    container_name: automatos_media_render
    restart: unless-stopped
    profiles: ["media"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Off locally, like the backend's (the service relays logs to Loki by default).
      LOG_RELAY_ENABLED: "false"
      SERVICE_NAME: media-render
      # The backend sends the same value as X-Internal-Token (empty = none).
      SOCIALS_RENDER_TOKEN: ${SOCIALS_RENDER_TOKEN:-}
      # Media inputs arrive as presigned GETs on the local MinIO bucket only.
      MEDIA_RENDER_MEDIA_URL_PREFIXES: ${MEDIA_RENDER_MEDIA_URL_PREFIXES:-http://minio:9000/${S3_DOCUMENTS_BUCKET:-automatos-ai}/}
      # Two renders at once overall, one per workspace (owner, 2026-09-23).
      MEDIA_RENDER_MAX_CONCURRENT_RENDERS: ${MEDIA_RENDER_MAX_CONCURRENT_RENDERS:-2}
      MEDIA_RENDER_MAX_RENDERS_PER_WORKSPACE: ${MEDIA_RENDER_MAX_RENDERS_PER_WORKSPACE:-1}
      # One workspace's jobs in progress (checking, queued or rendering); past it that
      # workspace gets 429 and the others are still admitted (P251W1-RVW-4).
      MEDIA_RENDER_MAX_ACTIVE_JOBS_PER_WORKSPACE: ${MEDIA_RENDER_MAX_ACTIVE_JOBS_PER_WORKSPACE:-4}
    # PRD-264 EUAI-06b: every AI-made file carries a signed C2PA manifest. With no
    # MEDIA_RENDER_C2PA_SIGNING_CERT_PEM / _KEY_PEM set (the local default), this install
    # makes its own signing certificate on first use and keeps it in this volume, never
    # in the image (MEDIA_RENDER_C2PA_DATA_DIR, /var/lib/media-render/c2pa).
    volumes:
      - media_render_data:/var/lib/media-render
    # Chrome renders the frames; the CI job runs the image with 1 GB of /dev/shm too.
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    healthcheck:
      # Python's urllib: the image carries no curl (PRD-262 US-051).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      # PRD-262 US-038: probed every second while it starts (Docker Engine 25 or later),
      # within a start period long enough for the renderer's first start.
      start_interval: 1s
    networks:
      - automatos

  # voice-tts: Auto's server voice, Kokoro streamed as MP3 (services/voice-tts).
  # Add with --profile voice. Port 8100 stays inside the compose network.
  voice-tts:
    build:
      context: ./services/voice-tts
    container_name: automatos_voice_tts
    restart: unless-stopped
    profiles: ["voice"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_RELAY_ENABLED: "false"
      SERVICE_NAME: voice-tts
      VOICE_TTS_TOKEN: ${VOICE_TTS_TOKEN:-}
    deploy:
      resources:
        limits: {cpus: '2.0', memory: 2G}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    networks:
      - automatos

  # ===========================================================================
  # ADMIN TOOLS PROFILE - Add with: --profile all
  # ===========================================================================
  
  adminer:
    image: adminer:latest@sha256:49a7d30e71de97fb18933ffe7d46cc2b343c49fd7a63a7791c8be2548eb65115
    container_name: automatos_adminer
    restart: unless-stopped
    profiles: ["all"]
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ADMINER_PORT:-8080}:8080"
    networks:
      - automatos

  # ===========================================================================
  # SearXNG - self-hosted web search for agents (PRD-240 S5). No key.
  # Add with: docker compose --profile search up -d
  # then SEARXNG_URL=http://searxng:8080 in .env (the backend resolves it as
  # the third search backend after OpenRouter and Composio).
  # ===========================================================================
  searxng:
    image: docker.io/searxng/searxng:latest@sha256:8bdd9aa136b2dc3b9332cf24714fa34a375b8a1949a1201ec900c24d7378596e
    container_name: automatos_searxng
    restart: unless-stopped
    profiles: ["search"]
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      # settings.yml reads this; any non-empty value works locally.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-local-only}
    volumes:
      - ./envs/searxng:/etc/searxng:rw
      - searxng_cache:/var/cache/searxng
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    networks:
      - automatos

# =============================================================================
# Volumes - Persistent Data Storage
# =============================================================================
volumes:
  backend_data:
  searxng_cache:
  postgres_data:
    driver: local
    name: automatos_postgres_data
  redis_data:
    driver: local
    name: automatos_redis_data
  minio_data:
    driver: local
    name: automatos_minio_data
  qdrant_data:
    driver: local
    name: automatos_qdrant_data
  backend_logs:
    driver: local
    name: automatos_backend_logs
  # F220: every workspace's files but the local one's (which is your folder).
  workspaces_data:
    driver: local
    name: automatos_workspaces_data
  # PRD-264 EUAI-06b: media-render's own C2PA signing certificate (local edition).
  media_render_data:
    driver: local
    name: automatos_media_render_data

# =============================================================================
# Networks
# =============================================================================
networks:
  automatos:
    driver: bridge
    name: automatos_network

