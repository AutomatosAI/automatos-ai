{{- /*
The schema lifecycle, once per install and upgrade, before the API pods start:
`docker-entrypoint.sh migrate` waits for PostgreSQL, builds an empty database,
migrates, seeds and (local edition) creates the workspace and operator, then
exits. A failed seed fails the Job, and a failed Job fails the install/upgrade.

As a hook it runs before the release's ordinary resources exist, so it takes its
settings inline (automatos.apiEnv), and its own account is a hook too, of a lower
weight, so it exists before the Job (serviceaccount.yaml).
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "automatos.fullname" . }}-migrate
  labels:
    {{- include "automatos.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    # Keep a failed Job for its logs; replace it on the next install or upgrade.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "automatos.serviceAccountName" (dict "ctx" $ "component" "migrate") }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: {{ include "automatos.image" (dict "ctx" $ "image" .Values.api.image) }}
          imagePullPolicy: {{ include "automatos.imagePullPolicy" (dict "ctx" $ "image" .Values.api.image) }}
          args: ["migrate"]
          env:
            {{- include "automatos.apiEnv" . | nindent 12 }}
          {{- $caMount := include "automatos.databaseCaMount" . | trim }}
          {{- if or $caMount .Values.migrations.readOnlyRootFilesystem }}
          volumeMounts:
            {{- with $caMount }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.migrations.readOnlyRootFilesystem }}
            # A read-only root (PRD-280 US-104): /tmp is the one path the Job writes, for a
            # here-document too large for a pipe (docs/PRDS/PRD-280-US-103-WRITE-PATHS.md).
            - name: tmp
              mountPath: /tmp
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            {{- if .Values.migrations.readOnlyRootFilesystem }}
            readOnlyRootFilesystem: true
            {{- end }}
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- $caVolume := include "automatos.databaseCaVolume" . | trim }}
      {{- if or $caVolume .Values.migrations.readOnlyRootFilesystem }}
      volumes:
        {{- with $caVolume }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.migrations.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        {{- end }}
      {{- end }}
