{{- if .Values.worker.enabled }}
{{- $secret := include "automatos.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "automatos.fullname" . }}-worker
  labels:
    {{- include "automatos.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  # One pod owns the workspace volume at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "automatos.serviceAccountName" . }}
      automountServiceAccountToken: false
      # No runAsNonRoot: the image's entrypoint starts as root to fix the workspace
      # volume's ownership, then drops to the `worker` user (uid 1000) with setpriv
      # --no-new-privs. The container's securityContext keeps that root start narrow,
      # and a uid other than 0 holds none of the capabilities below.
      containers:
        - name: worker
          image: {{ include "automatos.image" (dict "ctx" $ "image" .Values.worker.image) }}
          imagePullPolicy: {{ include "automatos.imagePullPolicy" (dict "ctx" $ "image" .Values.worker.image) }}
          env:
            - name: WORKSPACE_VOLUME_PATH
              value: /workspaces
            - name: WORKSPACE_DEFAULT_QUOTA_GB
              value: {{ .Values.worker.defaultQuotaGb | quote }}
            - name: WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            - name: WORKER_HEALTH_PORT
              value: "8081"
            - name: SERVICE_NAME
              value: workspace-worker
            - name: LOG_RELAY_ENABLED
              value: "false"
            {{- range $key := list "DATABASE_URL" "REDIS_URL" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
            {{- end }}
            {{- range $key := list "WORKER_INTERNAL_TOKEN" "ANTHROPIC_API_KEY" "CLAUDE_CODE_OAUTH_TOKEN" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- include "automatos.otelEnv" (dict "ctx" $ "service" "automatos-workspace-worker") | nindent 12 }}
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
          # F452 (#1309): the worker runs agent code. No process in it may gain a privilege
          # (a setuid-root binary such as su or passwd runs without root), every capability
          # is dropped but the four the root entrypoint needs, and the runtime's default
          # seccomp profile applies (compose already runs the worker under Docker's).
          # This passes PodSecurity "baseline", not "restricted": the pod starts as root
          # and keeps capabilities beyond NET_BIND_SERVICE, for the entrypoint above.
          #
          # NOTE (fix/f452-worker-extra-privs, reconcile against #1309/#1311 before merge):
          # #1311 measured this exact set against the built image (see its PR description's
          # table) and kept DAC_OVERRIDE, not DAC_READ_SEARCH -- without DAC_OVERRIDE the
          # volume walk failed with EACCES on a mode-700 folder. An earlier, unmeasured
          # draft of this change (13c03f89f) used DAC_READ_SEARCH instead; that capability
          # set is NOT kept here because it was never run against the built image. Confirm
          # DAC_OVERRIDE is still right now that the Dockerfile also strips every setuid/
          # setgid bit (below) before dropping either set further.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # chown -h re-owns the volume (CHOWN; DAC_OVERRIDE to walk folders it doesn't
              # own), then setpriv drops to uid 1000 (SETUID, SETGID). Measured: without
              # DAC_OVERRIDE the walk fails on a mode-700 folder; FOWNER isn't needed.
              add: ["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ include "automatos.workspacesClaim" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "automatos.fullname" . }}-worker
  labels:
    {{- include "automatos.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  selector:
    {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 4 }}
  ports:
    - name: http
      port: 8081
      targetPort: http
{{- end }}
