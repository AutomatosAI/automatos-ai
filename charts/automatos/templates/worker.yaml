{{- if .Values.worker.enabled }}
{{- include "automatos.validateWorker" . }}
{{- include "automatos.validateLogFormat" . }}
{{- /*
The worker's own Secret (worker.existingSecret, PRD-280 US-202) holds only what it needs, and
the token it shares with the API is a key it must hold. With the chart's one Secret, as
before, that key stays optional.
*/}}
{{- $secret := include "automatos.workerSecretName" . }}
{{- $required := list "DATABASE_URL" "REDIS_URL" }}
{{- $optional := list "WORKER_INTERNAL_TOKEN" "ANTHROPIC_API_KEY" "CLAUDE_CODE_OAUTH_TOKEN" }}
{{- if .Values.worker.existingSecret }}
{{- $required = append $required "WORKER_INTERNAL_TOKEN" }}
{{- $optional = without $optional "WORKER_INTERNAL_TOKEN" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "automatos.fullname" . }}-worker
  {{- if include "automatos.workerApart" . }}
  namespace: {{ .Values.worker.namespace }}
  {{- end }}
  labels:
    {{- include "automatos.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  # One pod owns the workspace volume at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "automatos.serviceAccountName" (dict "ctx" $ "component" "worker") }}
      automountServiceAccountToken: false
      # PRD-280 US-201: the worker starts as itself, uid 1000, as the image does. The
      # storage hands the volume over to the pod's group (fsGroup), as it must for the API's
      # volume, and the entrypoint re-owns nothing: it checks it can write the volume, and
      # stops with a message that says what the storage must provide when it cannot.
      # OnRootMismatch: the kubelet changes the volume's group and permissions only when its
      # top folder does not already match, so a start does not walk every agent file.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: worker
          image: {{ include "automatos.image" (dict "ctx" $ "image" .Values.worker.image) }}
          imagePullPolicy: {{ include "automatos.imagePullPolicy" (dict "ctx" $ "image" .Values.worker.image) }}
          env:
            - name: WORKSPACE_VOLUME_PATH
              value: /workspaces
            - name: WORKSPACE_DEFAULT_QUOTA_GB
              value: {{ .Values.worker.defaultQuotaGb | quote }}
            - name: WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            - name: WORKER_HEALTH_PORT
              value: "8081"
            - name: SERVICE_NAME
              value: workspace-worker
            - name: LOG_RELAY_ENABLED
              value: "false"
            {{- with include "automatos.workerLogFormatEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- range $key := $required }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
            {{- end }}
            {{- range $key := $optional }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- include "automatos.otelEnv" (dict "ctx" $ "service" "automatos-workspace-worker" "secret" $secret) | nindent 12 }}
            {{- with include "automatos.databaseTlsEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
            {{- with include "automatos.databaseCaMount" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.worker.readOnlyRootFilesystem }}
            # A read-only root (PRD-280 US-104): scratch volumes for the two paths the worker
            # writes outside its volume, /tmp and the home folder the entrypoint sets
            # (docs/PRDS/PRD-280-US-103-WRITE-PATHS.md).
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/worker
            {{- end }}
          # F452 (#1309): the worker runs agent code. No process in it may gain a privilege
          # (a setuid-root binary such as su or passwd runs without root), every capability
          # is dropped and none is added (PRD-280 US-201: nothing runs as root), and the
          # runtime's default seccomp profile applies. With the pod's non-root settings
          # above, this passes PodSecurity "restricted".
          securityContext:
            allowPrivilegeEscalation: false
            {{- if .Values.worker.readOnlyRootFilesystem }}
            readOnlyRootFilesystem: true
            {{- end }}
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ include "automatos.workerWorkspacesClaim" . }}
        {{- with include "automatos.databaseCaVolume" . | trim }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.worker.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        {{- end }}
      {{- with include "automatos.placement" .Values.worker | trim }}
      {{- . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "automatos.fullname" . }}-worker
  {{- if include "automatos.workerApart" . }}
  namespace: {{ .Values.worker.namespace }}
  {{- end }}
  labels:
    {{- include "automatos.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  selector:
    {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 4 }}
  ports:
    - name: http
      port: 8081
      targetPort: http
{{- end }}
