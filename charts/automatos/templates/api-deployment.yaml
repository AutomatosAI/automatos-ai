apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "automatos.fullname" . }}-api
  labels:
    {{- include "automatos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  {{- if and .Values.api.data.enabled (has "ReadWriteOnce" .Values.api.data.accessModes) }}
  # The new pod can't attach the volume on another node until the old one has let go.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "automatos.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: {{ include "automatos.image" (dict "ctx" $ "image" .Values.api.image) }}
          imagePullPolicy: {{ include "automatos.imagePullPolicy" (dict "ctx" $ "image" .Values.api.image) }}
          # The migration Job is the only thing that may change the schema. The
          # image's entrypoint migrates before a uvicorn command, so the pods set
          # AUTOMATOS_SKIP_MIGRATIONS=true (below): it then runs no boot step.
          args:
            - uvicorn
            - main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - {{ .Values.api.uvicornWorkers | quote }}
          env:
            {{- include "automatos.apiEnv" . | nindent 12 }}
            {{- include "automatos.otelEnv" (dict "ctx" . "service" "automatos-api") | nindent 12 }}
            {{- if .Values.api.data.enabled }}
            # The API pods only: the migration Job writes no files here.
            - name: DOCUMENT_UPLOAD_DIR
              value: /app/data/uploads
            - name: DOCUMENT_STORAGE_DIR
              value: /app/data/documents
            {{- end }}
            # Last, so a `config` entry of the same name cannot turn it off.
            - name: AUTOMATOS_SKIP_MIGRATIONS
              value: "true"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
              readOnly: true
            {{- if .Values.api.data.enabled }}
            - name: data
              mountPath: /app/data
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ include "automatos.workspacesClaim" . }}
        {{- if .Values.api.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "automatos.apiDataClaim" . }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
