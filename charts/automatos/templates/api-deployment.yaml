apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "automatos.fullname" . }}-api
  labels:
    {{- include "automatos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "automatos.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: {{ include "automatos.image" (dict "ctx" $ "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          # uvicorn directly: the image CMD would run `alembic upgrade heads` first,
          # and the migration Job is the only thing that may change the schema.
          args:
            - uvicorn
            - main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - {{ .Values.api.uvicornWorkers | quote }}
          env:
            {{- include "automatos.apiEnv" . | nindent 12 }}
            {{- include "automatos.otelEnv" (dict "ctx" . "service" "automatos-api") | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ include "automatos.workspacesClaim" . }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
