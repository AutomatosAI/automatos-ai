apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "automatos.fullname" . }}-api
  labels:
    {{- include "automatos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  {{- if include "automatos.apiDataSingleAttach" . }}
  # Stop the old pod first: the new one can't attach the volume until the old one has let
  # go. Not type: Recreate, which Helm 4's server-side apply can't change a live Deployment
  # to: the defaulted rollingUpdate block stays, and the API server refuses the pair.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "automatos.serviceAccountName" (dict "ctx" $ "component" "api") }}
      # Nothing in the API calls the cluster's own API (PRD-280 US-101).
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: {{ include "automatos.image" (dict "ctx" $ "image" .Values.api.image) }}
          imagePullPolicy: {{ include "automatos.imagePullPolicy" (dict "ctx" $ "image" .Values.api.image) }}
          # The migration Job is the only thing that may change the schema. The
          # image's entrypoint migrates before a uvicorn command, so the pods set
          # AUTOMATOS_SKIP_MIGRATIONS=true (below): it then runs no boot step.
          args:
            - uvicorn
            - main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - {{ .Values.api.uvicornWorkers | quote }}
          env:
            {{- include "automatos.apiEnv" . | nindent 12 }}
            {{- with include "automatos.qdrantApiEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- include "automatos.otelEnv" (dict "ctx" . "service" "automatos-api") | nindent 12 }}
            {{- if .Values.api.data.enabled }}
            # The API pods only: the migration Job writes no files here.
            - name: DOCUMENT_UPLOAD_DIR
              value: /app/data/uploads
            - name: DOCUMENT_STORAGE_DIR
              value: /app/data/documents
            {{- end }}
            {{- if .Values.api.readOnlyRootFilesystem }}
            # The home folder is a scratch volume (below); HOME names it, whatever the user.
            - name: HOME
              value: /home/automatos
            {{- end }}
            # Last, so a `config` entry of the same name cannot turn it off.
            - name: AUTOMATOS_SKIP_MIGRATIONS
              value: "true"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
              readOnly: true
            {{- if .Values.api.data.enabled }}
            - name: data
              mountPath: /app/data
            {{- end }}
            {{- with include "automatos.databaseCaMount" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with include "automatos.oidcCaMount" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.api.readOnlyRootFilesystem }}
            # A read-only root (PRD-280 US-104): a scratch volume for each path the API
            # writes outside its volumes (docs/PRDS/PRD-280-US-103-WRITE-PATHS.md). Keep
            # automatos.apiScratchDirs, which config's document paths are checked against, in step.
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/automatos
            - name: logs
              mountPath: /app/logs
            {{- if not .Values.api.data.enabled }}
            # DOCUMENT_STORAGE_DIR's default, `documents`, under the working directory /app.
            - name: documents
              mountPath: /app/documents
            {{- end }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            {{- if .Values.api.readOnlyRootFilesystem }}
            readOnlyRootFilesystem: true
            {{- end }}
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ include "automatos.workspacesClaim" . }}
        {{- if .Values.api.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "automatos.apiDataClaim" . }}
        {{- end }}
        {{- with include "automatos.databaseCaVolume" . | trim }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with include "automatos.oidcCaVolume" . | trim }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.api.readOnlyRootFilesystem }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: logs
          emptyDir: {}
        {{- if not .Values.api.data.enabled }}
        - name: documents
          emptyDir: {}
        {{- end }}
        {{- end }}
      {{- with include "automatos.placement" .Values.api | trim }}
      {{- . | nindent 6 }}
      {{- end }}
