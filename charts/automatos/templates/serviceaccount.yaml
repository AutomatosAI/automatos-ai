{{- /*
PRD-280 US-101: one account for each component, so a cloud role tied to one of them (by an
annotation, or by the account's name) reaches that component and no other. None of them
carries a token for the cluster's own API: nothing in Automatos calls it.

The migration Job's account is a hook, like the Job: as a pre-install/pre-upgrade hook the
Job runs before the release's ordinary resources exist, so its account is created by a hook
that runs first (a lower weight). Helm deletes it once the install's or upgrade's hooks are
done, whether the Job succeeded or failed (a failed Job is kept for its logs, its account is
not). If one is ever left behind, the next install or upgrade replaces it.
*/ -}}
{{- include "automatos.validateServiceAccounts" . }}
{{- if .Values.serviceAccount.create }}
{{- range $index, $component := include "automatos.serviceAccountComponents" . | splitList " " }}
{{- $account := index $.Values.serviceAccount $component | default dict }}
{{- $annotations := deepCopy ($account.annotations | default dict) }}
{{- if eq $component "migrate" }}
{{- $annotations = merge (dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-10" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded") $annotations }}
{{- end }}
{{- if $index }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "automatos.serviceAccountName" (dict "ctx" $ "component" $component) }}
  labels:
    {{- include "automatos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
