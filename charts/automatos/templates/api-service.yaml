apiVersion: v1
kind: Service
metadata:
  name: {{ include "automatos.fullname" . }}-api
  labels:
    {{- include "automatos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
