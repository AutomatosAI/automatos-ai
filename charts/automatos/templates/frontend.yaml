{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "automatos.fullname" . }}-frontend
  labels:
    {{- include "automatos.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "automatos.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: frontend
          image: {{ include "automatos.image" (dict "ctx" $ "image" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          env:
            # Server-side route handlers (the chat proxy) reach the API in-cluster.
            - name: BACKEND_INTERNAL_URL
              value: {{ printf "http://%s-api:8000" (include "automatos.fullname" .) | quote }}
            {{- include "automatos.otelEnv" (dict "ctx" . "service" "automatos-web") | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "automatos.fullname" . }}-frontend
  labels:
    {{- include "automatos.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "automatos.selectorLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
