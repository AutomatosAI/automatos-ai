suite: Install notes
templates:
  - templates/NOTES.txt
set:
  existingSecret: automatos-secrets
tests:
  - it: says there is no login when remote access is off
    asserts:
      - matchRegexRaw:
          pattern: there is no login
  - it: names pairing, and how to mint the first code, in paired mode
    release:
      name: demo
      namespace: apps
    set:
      config:
        LOCAL_REMOTE_ACCESS: paired
    asserts:
      - notMatchRegexRaw:
          pattern: there is no login
      - matchRegexRaw:
          pattern: every browser and phone pairs once
      - matchRegexRaw:
          pattern: kubectl -n apps exec deploy/demo-automatos-api -- python -m scripts\.mint_pairing_code
  - it: warns in open mode that whoever reaches the install is its operator
    set:
      config:
        LOCAL_REMOTE_ACCESS: open
    asserts:
      - notMatchRegexRaw:
          pattern: there is no login
      - matchRegexRaw:
          pattern: Anyone who can reach the API or the web app is the operator
