suite: Install notes
templates:
  - templates/NOTES.txt
set:
  existingSecret: automatos-secrets
tests:
  - it: says nothing of the worker's namespace while the worker is in the release's (PRD-280 US-202)
    asserts:
      - notMatchRegexRaw:
          pattern: The worker runs in the namespace
  - it: names what must already exist in the worker's own namespace (PRD-280 US-202)
    release:
      name: demo
      namespace: automatos
    set:
      worker:
        namespace: automatos-worker
        existingSecret: automatos-worker-secrets
      workspaces:
        api:
          existingClaim: agent-files-api
        worker:
          existingClaim: agent-files-worker
    asserts:
      - matchRegexRaw:
          pattern: The worker runs in the namespace automatos-worker
      - matchRegexRaw:
          pattern: the Secret automatos-worker-secrets \(DATABASE_URL, REDIS_URL, WORKER_INTERNAL_TOKEN\)
      - matchRegexRaw:
          pattern: the claim agent-files-worker, on the same file system as agent-files-api in automatos
      - notMatchRegexRaw:
          pattern: the ConfigMap
      - notMatchRegexRaw:
          pattern: the account
      - matchRegexRaw:
          pattern: kubectl -n automatos-worker rollout status deploy/demo-automatos-worker
  - it: adds the CA ConfigMap and the named account when they are the operator's (PRD-280 US-202)
    release:
      name: demo
      namespace: automatos
    set:
      database:
        sslmode: verify-full
        caConfigMap: database-ca
      serviceAccount:
        create: false
        worker:
          name: worker-account
      worker:
        namespace: automatos-worker
        existingSecret: automatos-worker-secrets
      workspaces:
        api:
          existingClaim: agent-files-api
        worker:
          existingClaim: agent-files-worker
    asserts:
      - matchRegexRaw:
          pattern: the ConfigMap database-ca \(the database's CA\)
      - matchRegexRaw:
          pattern: the account worker-account
  - it: says the published web app calls localhost:8000 in the local edition
    asserts:
      - matchRegexRaw:
          pattern: The published web app calls the API at http://localhost:8000
  - it: says the enterprise web app needs the API on its own host, and nothing of localhost:8000 (PRD-277 US-505)
    set:
      edition:
        authEdition: enterprise
    asserts:
      - matchRegexRaw:
          pattern: The enterprise web app calls the API on its own address
      - notMatchRegexRaw:
          pattern: localhost:8000 \(fixed at build time\)
      - notMatchRegexRaw:
          pattern: there is no login
  - it: says there is no login when remote access is off
    asserts:
      - matchRegexRaw:
          pattern: there is no login
  - it: names pairing, and how to mint the first code, in paired mode
    release:
      name: demo
      namespace: apps
    set:
      config:
        LOCAL_REMOTE_ACCESS: paired
    asserts:
      - notMatchRegexRaw:
          pattern: there is no login
      - matchRegexRaw:
          pattern: every browser and phone pairs once
      - matchRegexRaw:
          pattern: kubectl -n apps exec deploy/demo-automatos-api -- python -m scripts\.mint_pairing_code
  - it: reads the mode the way the API does, ignoring case and spaces
    set:
      config:
        LOCAL_REMOTE_ACCESS: " PAIRED "
    asserts:
      - matchRegexRaw:
          pattern: every browser and phone pairs once
  - it: treats an empty config as off
    set:
      config: null
    asserts:
      - matchRegexRaw:
          pattern: there is no login
  - it: warns in open mode that whoever reaches the install is its operator
    set:
      config:
        LOCAL_REMOTE_ACCESS: open
    asserts:
      - notMatchRegexRaw:
          pattern: there is no login
      - matchRegexRaw:
          pattern: Anyone who can reach the API or the web app is the operator
