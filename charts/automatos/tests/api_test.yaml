suite: API Deployment
templates:
  - templates/api-deployment.yaml
set:
  existingSecret: automatos-secrets
tests:
  - it: starts uvicorn with the entrypoint's boot steps off, so only the migration Job changes the schema
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: uvicorn
      - notContains:
          path: spec.template.spec.containers[0].args
          content: migrate
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTOMATOS_SKIP_MIGRATIONS
            value: "true"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTOMATOS_MIGRATE_ON_BOOT
            value: "true"
  - it: keeps the boot steps off even when config sets the flag
    set:
      config:
        AUTOMATOS_SKIP_MIGRATIONS: "false"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[-1]
          value:
            name: AUTOMATOS_SKIP_MIGRATIONS
            value: "true"
  - it: runs one replica by default (the schedulers use a per-container lock)
    asserts:
      - equal:
          path: spec.replicas
          value: 1
  - it: takes every secret from the existing Secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: automatos-secrets
                key: DATABASE_URL
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CREDENTIAL_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: automatos-secrets
                key: CREDENTIAL_ENCRYPTION_KEY
  - it: sets the local edition and its workspace
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_EDITION
            value: local
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_WORKSPACE_ID
            value: 00000000-0000-0000-0000-0000000000c1
  - it: points the API at the worker service
    release:
      name: demo
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKER_INTERNAL_URL
            value: http://demo-automatos-worker:8081
  - it: mounts the workspaces read-only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: workspaces
            mountPath: /workspaces
            readOnly: true
  - it: keeps the API's files on a volume, and points the document settings at it
    release:
      name: demo
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /app/data
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: demo-automatos-api-data
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DOCUMENT_UPLOAD_DIR
            value: /app/data/uploads
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DOCUMENT_STORAGE_DIR
            value: /app/data/documents
  - it: stops the old pod first when the volume attaches to one node at a time
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
  - it: rolls as usual on ReadWriteMany storage
    set:
      api:
        data:
          accessModes:
            - ReadWriteMany
    asserts:
      - notExists:
          path: spec.strategy
  - it: leaves the volume, the settings and the strategy out when data is off
    set:
      api:
        data:
          enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /app/data
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DOCUMENT_STORAGE_DIR
            value: /app/data/documents
      - notExists:
          path: spec.strategy
  - it: takes the object storage credentials from the Secret, as optional keys
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: automatos-secrets
                key: AWS_ACCESS_KEY_ID
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: automatos-secrets
                key: AWS_SECRET_ACCESS_KEY
                optional: true
  - it: passes extra config through as env
    set:
      config:
        S3_ENDPOINT_URL: http://minio:9000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_ENDPOINT_URL
            value: http://minio:9000
  - it: defaults the image tag to the chart appVersion
    chart:
      appVersion: edge
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/automatosai/automatos-api:edge
  - it: fails clearly without the Secret
    set:
      existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: existingSecret is required
