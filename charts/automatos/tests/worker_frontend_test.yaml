suite: Worker and frontend
set:
  existingSecret: automatos-secrets
tests:
  - it: gives the worker the workspaces read-write, one pod at a time
    template: templates/worker.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: workspaces
            mountPath: /workspaces
      - equal:
          path: spec.strategy.type
          value: Recreate
  - it: lets no worker process gain a privilege, with no capability (F452, PRD-280 US-201), on a read-only root (PRD-280 US-104)
    template: templates/worker.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
  - it: starts the worker as uid 1000, never root, with the pod's group on its volume (PRD-280 US-201)
    template: templates/worker.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
  - it: keeps the worker non-root with a writable root too (PRD-280 US-201)
    template: templates/worker.yaml
    documentIndex: 0
    set:
      worker:
        readOnlyRootFilesystem: false
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - notExists:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
  - it: runs the worker under its own account, with no cluster token (PRD-280 US-101)
    template: templates/worker.yaml
    documentIndex: 0
    release:
      name: demo
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: demo-automatos-worker
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
  - it: runs the worker under a pre-existing account when the chart creates none
    template: templates/worker.yaml
    documentIndex: 0
    set:
      serviceAccount:
        create: false
        worker:
          name: automatos-worker-identity
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: automatos-worker-identity
  - it: runs the web app under its own account, with no cluster token (PRD-280 US-101)
    template: templates/frontend.yaml
    documentIndex: 0
    release:
      name: demo
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: demo-automatos-frontend
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
  - it: runs the web app under a pre-existing account when the chart creates none
    template: templates/frontend.yaml
    documentIndex: 0
    set:
      serviceAccount:
        create: false
        frontend:
          name: automatos-web-identity
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: automatos-web-identity
  - it: gives the web app the runtime's default system-call filter (PRD-280 US-102) and a read-only root (US-104)
    template: templates/frontend.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
  - it: renders nothing for a disabled worker
    template: templates/worker.yaml
    set:
      worker:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: points the frontend's server side at the API service
    template: templates/frontend.yaml
    documentIndex: 0
    release:
      name: demo
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BACKEND_INTERNAL_URL
            value: http://demo-automatos-api:8000
  - it: keeps the workspaces claim on uninstall
    template: templates/workspaces-pvc.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
