suite: Migration Job
templates:
  - templates/migrate-job.yaml
set:
  existingSecret: automatos-secrets
tests:
  - it: writes no files on the API's data volume, so it gets neither the mount nor the paths
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DOCUMENT_STORAGE_DIR
            value: /app/data/documents
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DOCUMENT_UPLOAD_DIR
            value: /app/data/uploads
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: data}
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content: {name: data}
          any: true
  - it: gets the object storage credentials from the Secret, like the API
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: automatos-secrets
                key: AWS_ACCESS_KEY_ID
                optional: true
  - it: stops on a name in config that the chart also sets
    set:
      config:
        AWS_ACCESS_KEY_ID: visible
    asserts:
      - failedTemplate:
          errorPattern: "config.AWS_ACCESS_KEY_ID: move it to the Secret"
  - it: runs `docker-entrypoint.sh migrate` as a pre-install/pre-upgrade hook
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["migrate"]
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
  - it: gets the same edition settings as the API, or the local workspace is skipped
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_EDITION
            value: local
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_WORKSPACE_ID
            value: 00000000-0000-0000-0000-0000000000c1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOCAL_OPERATOR_EMAIL
            value: local@automatos.local
  - it: runs under its own account, with no cluster token, after the hook that creates the account (PRD-280 US-101)
    release:
      name: demo
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: demo-automatos-migrate
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      # The account's hook weighs -10 (serviceaccount_test.yaml), so it runs first.
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
  - it: has the runtime's default system-call filter (PRD-280 US-102) and a read-only root (US-104)
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
  - it: uses a pre-existing account when one is named
    set:
      serviceAccount:
        create: false
        migrate:
          name: automatos-migrate-identity
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: automatos-migrate-identity
  - it: runs under the namespace's default account when none is created or named
    set:
      serviceAccount:
        create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
  - it: stops on the one account for every pod that charts before 0.7.0 took, saying what to set
    set:
      serviceAccount:
        create: false
        name: automatos-identity
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.name: since chart 0.7.0 each component has its own account. Set serviceAccount.api.name"
  - it: omits the local-edition settings in the hosted edition
    set:
      edition:
        authEdition: saas
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEFAULT_WORKSPACE_ID
            value: 00000000-0000-0000-0000-0000000000c1
