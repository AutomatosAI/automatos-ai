suite: Service accounts (PRD-280 US-101)
templates:
  - templates/serviceaccount.yaml
set:
  existingSecret: automatos-secrets
release:
  name: demo
tests:
  - it: creates one account for each component
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: demo-automatos-api
        documentIndex: 0
      - equal:
          path: metadata.name
          value: demo-automatos-frontend
        documentIndex: 1
      - equal:
          path: metadata.name
          value: demo-automatos-worker
        documentIndex: 2
      - equal:
          path: metadata.name
          value: demo-automatos-migrate
        documentIndex: 3
  - it: labels each account with its component
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: frontend
        documentIndex: 1
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: worker
        documentIndex: 2
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate
        documentIndex: 3
  - it: gives no account a cluster token
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
  - it: creates the API's, the web app's and the worker's accounts with the release, not as hooks
    asserts:
      - notExists:
          path: metadata.annotations
        documentIndex: 0
      - notExists:
          path: metadata.annotations
        documentIndex: 1
      - notExists:
          path: metadata.annotations
        documentIndex: 2
  - it: creates the migration Job's account in a hook that runs before the Job, on install and on upgrade
    asserts:
      - equal:
          path: metadata.annotations
          value:
            helm.sh/hook: pre-install,pre-upgrade
            # Below the Job's weight of 0 (migrate_job_test.yaml): Helm runs lower weights first.
            helm.sh/hook-weight: "-10"
            # Deleted once the hooks succeed; after a failed Job it can be left behind,
            # until the next install or upgrade replaces it.
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        documentIndex: 3
  - it: puts each account's annotations on that account only
    set:
      serviceAccount:
        api:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/automatos-api
        worker:
          annotations:
            example.com/owner: worker
    asserts:
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/automatos-api
        documentIndex: 0
      - notExists:
          path: metadata.annotations
        documentIndex: 1
      - equal:
          path: metadata.annotations
          value:
            example.com/owner: worker
        documentIndex: 2
  - it: keeps the migration account a hook when annotations are added to it
    set:
      serviceAccount:
        migrate:
          annotations:
            example.com/owner: migrate
            helm.sh/hook: post-install
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/owner: migrate
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        documentIndex: 3
  - it: renames an account
    set:
      serviceAccount:
        api:
          name: automatos-api-identity
    asserts:
      - equal:
          path: metadata.name
          value: automatos-api-identity
        documentIndex: 0
      - equal:
          path: metadata.name
          value: demo-automatos-worker
        documentIndex: 2
  - it: creates no account for a web app or a worker that is off
    set:
      frontend:
        enabled: false
      worker:
        enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: demo-automatos-api
        documentIndex: 0
      - equal:
          path: metadata.name
          value: demo-automatos-migrate
        documentIndex: 1
  - it: creates the memory store's account, with the release, when qdrant.enabled (PRD-280 US-601)
    set:
      qdrant:
        enabled: true
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: metadata.name
          value: demo-automatos-qdrant
        documentIndex: 3
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: qdrant
        documentIndex: 3
      - notExists:
          path: metadata.annotations
        documentIndex: 3
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 3
      - equal:
          path: metadata.name
          value: demo-automatos-migrate
        documentIndex: 4
  - it: puts the memory store's annotations and name on its account only
    set:
      qdrant:
        enabled: true
      serviceAccount:
        qdrant:
          name: automatos-memory
          annotations:
            example.com/owner: memory
    asserts:
      - equal:
          path: metadata.name
          value: automatos-memory
        documentIndex: 3
      - equal:
          path: metadata.annotations
          value:
            example.com/owner: memory
        documentIndex: 3
      - notExists:
          path: metadata.annotations
        documentIndex: 2
  - it: stops on the memory store's account named as another created account
    set:
      qdrant:
        enabled: true
      serviceAccount:
        qdrant:
          name: automatos-shared
        api:
          name: automatos-shared
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.api.name and serviceAccount.qdrant.name are both \"automatos-shared\""
  - it: takes serviceAccount.qdrant while the memory store is off, and creates no account for it
    set:
      serviceAccount:
        qdrant:
          annotations:
            example.com/owner: memory
    asserts:
      - hasDocuments:
          count: 4
  - it: takes an empty serviceAccount.name and annotations from a values file of an older chart
    set:
      serviceAccount:
        name: ""
        annotations: {}
    asserts:
      - hasDocuments:
          count: 4
  - it: stops on serviceAccount.name, naming the values that replace it
    set:
      serviceAccount:
        name: automatos-identity
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.name: since chart 0.7.0 each component has its own account. Set serviceAccount.api.name, serviceAccount.frontend.name, serviceAccount.worker.name and serviceAccount.migrate.name instead"
  - it: stops on serviceAccount.annotations, naming the values that replace it
    set:
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/automatos
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.annotations: since chart 0.7.0 each component has its own account. Put the annotations on the account that needs them, e.g. serviceAccount.api.annotations"
  - it: stops on serviceAccount.name when the chart creates no account too
    set:
      serviceAccount:
        create: false
        name: automatos-identity
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.name: since chart 0.7.0"
  - it: stops on a key that names no component
    set:
      serviceAccount:
        web:
          name: automatos-web
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.web: unknown key. The accounts are serviceAccount.api, serviceAccount.frontend \\(the web app\\), serviceAccount.worker, serviceAccount.qdrant \\(the memory store\\) and serviceAccount.migrate"
  - it: stops on two created accounts with one name
    set:
      serviceAccount:
        api:
          name: automatos-shared
        worker:
          name: automatos-shared
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.api.name and serviceAccount.worker.name are both \"automatos-shared\""
