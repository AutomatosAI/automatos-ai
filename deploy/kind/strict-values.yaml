# Values for chart.yml's install lane (deploy/kind/strict.sh, PRD-280 US-100): every
# optional component the chart has, on, with the images the lane built in the same run
# and loaded into the kind cluster, so none is pulled. The datastores and the collector
# run in their own namespace (automatos-datastores), so the chart's namespace holds only
# the chart's pods. Each later wave of PRD-280 adds what it builds here.
existingSecret: automatos-secrets

config:
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  LOG_RELAY_ENABLED: "false"
  QDRANT_URL: ""
  AGENT_OPT_WORKER_URL: ""
  LOKI_URL: ""
  PROMETHEUS_URL: ""

api:
  image:
    repository: automatos-api
    tag: ci
    pullPolicy: Never
  data:
    enabled: true
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}

migrations:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}

frontend:
  enabled: true
  image:
    repository: automatos-frontend
    tag: ci
    pullPolicy: Never
  resources:
    requests: {cpu: 50m, memory: 128Mi}

worker:
  enabled: true
  image:
    repository: automatos-workspace-worker
    tag: ci
    pullPolicy: Never
  resources:
    requests: {cpu: 50m, memory: 256Mi}

otel:
  enabled: true
  endpoint: http://otel-collector.automatos-datastores:4318
  resourceAttributes: k8s.cluster.name=automatos-ci

sessionMode:
  enabled: true

# The Ingress objects only: the lane installs no controller, and nothing is sent through it.
ingress:
  enabled: true

# kind's local-path storage is ReadWriteOnce; a single node shares it fine.
workspaces:
  size: 1Gi
  accessModes:
    - ReadWriteOnce
